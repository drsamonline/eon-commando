<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>EON COMMANDO — a run-and-gun in one HTML file</title>
<meta name="description" content="EON COMMANDO is a retro run-and-gun platformer: three eras, five weapons, boss fights and chiptune audio in one self-contained HTML file. No dependencies, works offline.">
<meta property="og:title" content="EON COMMANDO">
<meta property="og:description" content="A retro run-and-gun platformer in one self-contained HTML file.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305070d'/%3E%3Cpath d='M8 2l5 4v4l-5 4-5-4V6z' fill='%23ffb545'/%3E%3Crect x='6' y='7' width='4' height='2' fill='%2305070d'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#05070d; --panel:#0b1220; --line:#1d2b3f;
    --amber:#ffb545; --cyan:#54e0ff; --dim:#7f8fa6;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; height:100%; background:var(--ink); color:#cfd8e3;
    font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow:hidden; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:none; overscroll-behavior:none;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #0d1726 0%, #05070d 62%, #03040a 100%);
  }
  /* the canvas owns the whole viewport — no page furniture, no letterbox gaps */
  #stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center}
  canvas{
    display:block; image-rendering:pixelated; image-rendering:crisp-edges;
    background:#070a12; border:0; border-radius:0; box-shadow:none;
  }
  /* portrait phones: square play area at the top, thumbs below, no dead margins */
  body.portrait #stage{align-items:flex-start; padding-top:max(3vh,env(safe-area-inset-top))}
  body.touch.portrait canvas{border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 0 1px #1b2839}
  /* a soft glow behind the thumb area so the lower half reads as part of the game */
  body.touch.portrait::after{
    content:''; position:fixed; left:0; right:0; bottom:0; height:44%;
    background:radial-gradient(ellipse 70% 90% at 50% 110%, rgba(84,224,255,.10), transparent 70%);
    pointer-events:none; z-index:1;
  }
  body.touch.portrait #rotate{top:62%; bottom:auto}
  #rotate{
    display:none; position:fixed; left:0; right:0; bottom:36%;
    text-align:center; font-size:11px; letter-spacing:.14em; color:#3f4d61;
    pointer-events:none;
  }
  body.touch.portrait #rotate{display:block}
  /* on-screen controls — shown only for touch devices */
  #pads{display:none}
  body.touch #pads{display:block}
  .pad{position:fixed; bottom:max(14px,env(safe-area-inset-bottom)); display:grid; gap:8px; z-index:5}
  #padL{left:max(14px,env(safe-area-inset-left)); grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,58px)}
  #padL [data-k="up"]{grid-area:1/2}
  #padL [data-k="left"]{grid-area:2/1}
  #padL [data-k="down"]{grid-area:2/2}
  #padL [data-k="right"]{grid-area:2/3}
  #padR{right:max(14px,env(safe-area-inset-right)); grid-template-columns:repeat(3,54px); grid-template-rows:54px 62px;
        justify-items:end; align-items:end}
  #padR [data-k="fire"]{grid-area:2/2}
  #padR [data-k="jump"]{grid-area:2/3}
  #padR [data-k="melee"]{grid-area:1/1}
  #padR [data-k="dash"]{grid-area:1/2}
  #padR [data-k="grenade"]{grid-area:1/3}
  #padR [data-k="power"]{grid-area:2/2}
  #padR button.sm{font-size:12px; opacity:.82}
  .pad button{
    width:100%; height:100%; padding:0; color:#cfd8e3; font:16px ui-monospace,monospace;
    background:rgba(19,28,40,.82); border:1px solid #26394f; border-radius:14px;
    backdrop-filter:blur(2px); transition:background .06s, transform .06s;
  }
  .pad button:active, .pad button.on{background:rgba(84,224,255,.28); border-color:var(--cyan); transform:scale(.96)}
  #padR button{background:rgba(40,26,10,.82); border-color:#4a3a1c; font-weight:700; color:var(--amber)}
  #padR button:active, #padR button.on{background:rgba(255,181,69,.3); border-color:var(--amber)}
  #btnPause{
    position:fixed; bottom:calc(max(14px,env(safe-area-inset-bottom)) + 8px); left:50%;
    transform:translateX(-50%); width:46px; height:34px; padding:0; z-index:6;
    color:#cfd8e3; font-size:12px; background:rgba(19,28,40,.7);
    border:1px solid #26394f; border-radius:10px; display:none;
  }
  body.touch.portrait #btnPause{bottom:auto; top:calc(max(10px,env(safe-area-inset-top)) + 4px)}
  body.touch #btnPause{display:block}
  #hint{
    position:fixed; left:0; right:0; bottom:6px; text-align:center; font-size:11px;
    color:#3f4d61; letter-spacing:.08em; pointer-events:none; z-index:4;
    animation:hintFade 1s ease 9s forwards;
  }
  @keyframes hintFade{to{opacity:0}}
  body.touch #hint{display:none}
  body.shot #hint, body.shot #pads, body.shot #btnPause{display:none!important}
  body.shot{background:#000}
  body.shot canvas{border:0;border-radius:0;box-shadow:none}
  body.shot #stage{filter:none}
  @media (max-height:520px){ #hint{display:none} }

  /* ---- auto-fire touch layout -------------------------------------------
     With the gun firing itself, up/down stop being aim controls: up becomes
     jump, down becomes duck, and the fire button has no job. */
  body.auto #padR [data-k="fire"]{ display:none }
  /* jump lives on A; keeping a second jump button duplicated the action */
  body.auto #padL [data-k="up"]{ display:none }
  body.auto #padL [data-k="left"]{ grid-area:2/1 }
  body.auto #padL [data-k="down"]{ grid-area:2/2; background:rgba(255,181,69,.16); border-color:#7a5a2a }
  body.auto #padL [data-k="right"]{ grid-area:2/3 }
  body.auto #padL [data-k="down"]{ background:rgba(255,181,69,.16); border-color:#7a5a2a }
  #padR [data-k="power"]{ display:none; background:rgba(255,210,87,.20); border-color:#8a6a22; color:#ffd257; font-size:15px }
  body.auto #padR [data-k="power"].ready{ display:block; animation:pulse 1.1s ease-in-out infinite }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 7px rgba(255,210,87,.16) } }

  /* ---- pad layout editor ------------------------------------------------ */
  #padEditor{ position:fixed; inset:0; z-index:30; display:none; pointer-events:none }
  body.editing #padEditor{ display:block }
  #padEditor .pe-bar{
    position:absolute; top:0; left:0; right:0; display:flex; gap:8px; align-items:center;
    padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:rgba(5,7,13,.94); border-bottom:1px solid #1b2839; pointer-events:auto;
  }
  #padEditor .pe-bar span{ flex:1; font-size:9px; letter-spacing:.18em; color:#7f8fa6; line-height:1.3 }
  #padEditor button{
    background:rgba(19,28,40,.9); color:#cfd8e3; border:1px solid #26394f; border-radius:8px;
    font:inherit; font-size:12px; padding:8px 10px; min-width:38px; cursor:pointer;
  }
  #padEditor button:active{ background:rgba(84,224,255,.2); border-color:#2f6f8f }
  body.editing #padL, body.editing #padR{
    outline:2px dashed rgba(84,224,255,.55); outline-offset:8px; border-radius:10px;
    touch-action:none; z-index:31;
  }
  body.editing #touch{ background:rgba(5,7,13,.55) }
</style>
</head>
<body>

<div id="stage"><canvas id="c" width="480" height="270" aria-label="Eon Commando — game screen"></canvas></div>

<div id="pads">
  <div class="pad" id="padL">
    <button data-k="up" aria-label="Aim up">▲</button>
    <button data-k="left" aria-label="Move left">◀</button>
    <button data-k="down" aria-label="Duck">▼</button>
    <button data-k="right" aria-label="Move right">▶</button>
  </div>
  <div class="pad" id="padR">
    <button data-k="grenade" class="sm" aria-label="Grenade">G</button>
    <button data-k="dash" class="sm" aria-label="Dash">&#187;</button>
    <button data-k="melee" class="sm" aria-label="Melee">M</button>
    <button data-k="fire" id="btnFire" aria-label="Fire">B</button>
    <button data-k="jump" aria-label="Jump">A</button>
    <button data-k="power" id="btnPower" aria-label="Unleash">&#9889;</button>
  </div>
</div>
<div id="padEditor" aria-hidden="true">
  <div class="pe-bar">
    <span>DRAG THE PADS WHERE YOUR THUMBS ARE</span>
    <button id="peSmall" type="button">&minus;</button>
    <button id="peBig" type="button">+</button>
    <button id="peReset" type="button">RESET</button>
    <button id="peDone" type="button">DONE</button>
  </div>
</div>
<button id="btnPause" aria-label="Pause">❙❙</button>
<div id="hint">ARROWS / WASD move &middot; SPACE jump &middot; Z fire &middot; SHIFT dash &middot; V melee &middot; G grenade &middot; P pause</div>
<div id="rotate">&#8635; ROTATE FOR A WIDER VIEW</div>

<script>
