}

function keyLabel(code) {
  if (!code) return '---';
  if (code.indexOf('Key') === 0) return code.slice(3);
  if (code.indexOf('Digit') === 0) return code.slice(5);
  var m = {
    ArrowLeft: '\u25C0', ArrowRight: '\u25B6', ArrowUp: '\u25B2', ArrowDown: '\u25BC',
    Space: 'SPACE', Enter: 'ENTER', Escape: 'ESC', Backspace: 'BKSP', Tab: 'TAB',
    ShiftLeft: 'L-SHIFT', ShiftRight: 'R-SHIFT', ControlLeft: 'L-CTRL',
    ControlRight: 'R-CTRL', Period: 'PERIOD', Comma: 'COMMA', Slash: 'SLASH',
    Semicolon: 'SEMI', Quote: 'QUOTE', NumpadEnter: 'NP-ENTER'
  };
  return m[code] || code.toUpperCase();
}

function drawRemap(g) {
  dim(g, 0.85);
  Game.hitRows = [];
  var narrow = W < 380;
  drawFit(g, 'CONTROLS', 20, 3, '#54e0ff', 'rgba(0,0,0,0.85)', W - 16);

  var who = Game.remapPlayer === 'p1' ? 'PLAYER 1' : 'PLAYER 2';
  drawText(g, '< ' + who + ' >', W / 2, 44, 1, '#ffd257', 'center');

  var acts = Game.REMAP_ACTIONS;
  var y = 62;
  var padX = narrow ? 26 : 60;
  for (var i = 0; i < acts.length; i++) {
    var sel = i === Game.remapIndex;
    var act = acts[i];
    var bound = (Input.BINDINGS[Game.remapPlayer][act] || [])[0];
    if (sel) {
      px(g, padX - 14, y - 4, W - (padX - 14) * 2, 13, 'rgba(84,224,255,0.14)');
      drawText(g, '>', padX - 10, y, 1, '#54e0ff');
    }
    drawText(g, act.toUpperCase(), padX, y, 1, sel ? '#ffffff' : '#9fb2c6');
    var listening = Input.listening && Input.listening.action === act &&
                    Input.listening.player === Game.remapPlayer;
    drawText(g, listening ? 'PRESS A KEY' : keyLabel(bound),
             W - padX, y, 1, listening ? '#ff4d6d' : (sel ? '#ffd257' : '#7f8fa6'), 'right');
    Game.hitRows.push({ y0: y - 7, y1: y + 9, i: i });
    y += narrow ? 15 : 16;
  }

  drawText(g, 'ENTER REBIND   R RESET', W / 2, H - 30, 1, '#54637a', 'center');
  drawText(g, 'LEFT/RIGHT SWITCH PLAYER   P BACK', W / 2, H - 19, 1, '#54637a', 'center');
}

/* ---- story panel -------------------------------------------------------- */
function wrapText(str, max) {
  var words = String(str).split(' '), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var t = cur ? cur + ' ' + words[i] : words[i];
    if (t.length > max) { if (cur) lines.push(cur); cur = words[i]; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* draw a heading at the largest scale that still fits the view */
function drawFit(g, str, y, preferred, color, shadow, maxW) {
  str = String(str).toUpperCase();
  var limit = maxW || (W - 16);
  var sc = preferred || 3;
  while (sc > 1 && textWidth(str, sc) > limit) sc--;
  drawText(g, str, W / 2, y, sc, color, 'center', shadow);
  return sc;
}

function drawStory(g) {
  var st = Game.story;
  if (!st || !st[Game.storyIndex]) return;
  var line = st[Game.storyIndex];
  var narrow = W < 380;

  dim(g, 0.82);

  var padX = narrow ? 12 : 34;
  var boxH = narrow ? 112 : 100;
  var boxY = H - boxH - (narrow ? 10 : 16);
  var boxW = W - padX * 2;

  px(g, padX, boxY, boxW, boxH, 'rgba(6,9,14,0.94)');
  g.strokeStyle = '#22344a';
  g.lineWidth = 1;
  g.strokeRect(padX + 0.5, boxY + 0.5, boxW - 1, boxH - 1);
  px(g, padX, boxY, boxW, 2, line.who === 'YOU' ? '#54e0ff' : '#ff2d95');

  /* portrait plate */
  var pw = narrow ? 34 : 44;
  px(g, padX + 8, boxY + 12, pw, pw, '#0b1220');
  g.strokeStyle = '#1b2839';
  g.strokeRect(padX + 8.5, boxY + 12.5, pw - 1, pw - 1);
  if (line.who === 'YOU') {
    var ghost = { x: padX + 8 + pw / 2 - 6, y: boxY + 14, w: 12, h: 22, facing: 1, aimAngle: 0,
                  onGround: true, ducking: false, runPhase: 0, invuln: 0, hurtFlash: 0, vx: 0 };
    g.save();
    g.translate(0, 6);
    drawPlayer(g, ghost);
    g.restore();
  } else {
    g.fillStyle = line.who === 'CONTROL' ? '#54e0ff' : '#ff2d95';
    g.beginPath();
    var cx0 = padX + 8 + pw / 2, cy0 = boxY + 12 + pw / 2;
    g.moveTo(cx0, cy0 - pw * 0.3);
    g.lineTo(cx0 + pw * 0.3, cy0);
    g.lineTo(cx0, cy0 + pw * 0.3);
    g.lineTo(cx0 - pw * 0.3, cy0);
    g.closePath();
    g.fill();
  }

  var tx = padX + pw + 20;
  drawText(g, line.who, tx, boxY + 12, 1, line.who === 'YOU' ? '#54e0ff' : '#ff2d95');

  var lines = wrapText(line.text, narrow ? 26 : 44);
  var budget = Math.floor(Game.storyChars);
  var ty = boxY + 30;
  for (var i = 0; i < lines.length && i < 4; i++) {
    var l = lines[i];
    var part = l.length <= budget ? l : l.slice(0, Math.max(0, budget));
    budget -= l.length + 1;
    if (part.length) drawText(g, part, tx, ty, 1, '#e6edf5');
    ty += 12;
  }

  if (Game.storyChars >= line.text.length && Math.floor(Game.time / 20) % 2 === 0) {
    drawText(g, narrow ? 'TAP TO CONTINUE' : 'ENTER / TAP', W - padX - 10, boxY + boxH - 14, 1, '#54637a', 'right');

}

var Scan = { canvas: null };
function buildScanlines() {
  var c = document.createElement('canvas');
  c.width = W; c.height = VIEW_H;
  var g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.16)';
  for (var y = 0; y < VIEW_H; y += 3) g.fillRect(0, y, W, 1);
  Scan.canvas = c;
}

/* ---- master draw ------------------------------------------------------- */
function Render(g) {
  var shakeX = 0, shakeY = 0;
  if (Game.shake > 0.2 && !SET.reduceMotion) {
    shakeX = RNG.fr(-Game.shake, Game.shake);
    shakeY = RNG.fr(-Game.shake, Game.shake) * 0.7;
  }

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, VIEW_H);

  /* portrait: fill the whole canvas with the era sky before the band goes down */
  if (VIEW_H !== H) {
    var skg = g.createLinearGradient(0, 0, 0, VIEW_H);
    var st = Game.stage;
    skg.addColorStop(0, st.sky[0]);
    skg.addColorStop(0.55, st.sky[1]);
    skg.addColorStop(1, st.sky[2]);
    g.fillStyle = skg;
    g.fillRect(0, 0, W, VIEW_H);
  }

  if (Game.state === 'title') {
    g.save();
    g.translate(0, Y0);
    drawTitle(g);
    g.restore();
  } else {
    g.save();
    g.translate(0, Y0);
    g.translate(Math.round(shakeX), Math.round(shakeY));
    drawWorld(g);
    g.restore();
    if (Game.state === 'playing' || Game.state === 'stageclear' ||
        Game.state === 'gameover' || Game.state === 'victory' || Game.state === 'story') {
      g.save();
      g.translate(0, Y0);
      drawHUD(g);
      g.restore();
    }

    g.save();
    g.translate(0, Y0);
    if (Game.state === 'paused') drawPause(g);
    else if (Game.state === 'settings') drawSettings(g);
    else if (Game.state === 'remap') drawRemap(g);
    else if (Game.state === 'pads') drawPads(g);
    else if (Game.state === 'perk') drawPerk(g);
    else if (Game.state === 'lan') drawLan(g);
    else if (Game.state === 'story') drawStory(g);
    else if (Game.state === 'credits') drawCredits(g);
    else if (Game.state === 'stageclear') drawStageClear(g);
    else if (Game.state === 'gameover') drawGameOver(g);
    else if (Game.state === 'victory') drawVictory(g);
    g.restore();
  }

  /* hit flash, scaled by the photosensitivity setting */
  if (Game.flash > 0.01 && !SET.reduceMotion && SET.flash > 0) {
    g.fillStyle = 'rgba(255,255,255,' + (Game.flash * 0.5 * SET.flash) + ')';
    g.fillRect(0, 0, W, VIEW_H);
  }

  /* debug overlay */
  if (PARAMS.fps) {
    g.fillStyle = 'rgba(0,0,0,0.6)';
    g.fillRect(0, H - 26, 118, 24);
    drawText(g, 'FPS ' + Math.round(Perf.fps), 4, H - 23, 1, '#54ffa8');
    drawText(g, 'MS ' + Perf.ms.toFixed(2), 4, H - 14, 1, '#9fb2c6');
    drawText(g, 'E' + Game.enemies.length + ' B' + Game.bullets.length + ' P' + Game.particles.length, 58, H - 23, 1, '#7f8fa6');
    drawText(g, 'H' + Game.hazards.length, 58, H - 14, 1, '#7f8fa6');
  }

  /* scanlines */
  if (Scan.canvas && !SET.reduceMotion) {
    g.globalAlpha = 0.5;
    g.drawImage(Scan.canvas, 0, 0, W, VIEW_H);
    g.globalAlpha = 1;
  }

  /* vignette */
  var vg = g.createRadialGradient(W / 2, VIEW_H / 2, VIEW_H * 0.35, W / 2, VIEW_H / 2, VIEW_H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, VIEW_H);
}

/* ===== 90_main.js ===== */
/* ===========================================================================
   EON COMMANDO — 90 main
   Canvas setup, the fixed-timestep loop, and the debug harness used to
   capture the screenshots in docs/.
   =========================================================================== */

/* auto-fire changes the touch layout: up becomes jump, down becomes duck,
   and the fire button disappears */

/* ===========================================================================
   Pad layout editor — the pads are DOM, so the editor is DOM too.
   Positions are stored as percentages of the viewport so they survive rotation.
   =========================================================================== */
function applyPadLayout() {
  var padL = document.getElementById('padL');
  var padR = document.getElementById('padR');
  if (!padL || !padR) return;
  var p = SET.pads;
  if (!p) {
    padL.style.cssText = ''; padR.style.cssText = '';
    return;
  }
  function place(el, x, y) {
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.transformOrigin = 'top left';
    el.style.transform = 'scale(' + (p.scale || 1) + ')';
  }
  place(padL, p.lx, p.ly);
  place(padR, p.rx, p.ry);
}

var padDrag = null;
var padEditorAddedTouch = false;

function initPadEditor() {
  var editor = document.getElementById('padEditor');
  if (!editor) return;

  ['padL', 'padR'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('pointerdown', function (e) {
      if (!document.body.classList.contains('editing')) return;
      e.preventDefault();
      e.stopPropagation();
      var r = el.getBoundingClientRect();
      padDrag = { el: el, id: id, dx: e.clientX - r.left, dy: e.clientY - r.top };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', function (e) {
      if (!padDrag || padDrag.el !== el) return;
      e.preventDefault();
      var vw = window.innerWidth || 1, vh = window.innerHeight || 1;
      var x = clamp((e.clientX - padDrag.dx) / vw * 100, -6, 92);
      var y = clamp((e.clientY - padDrag.dy) / vh * 100, 2, 92);
      el.style.left = x + '%';
      el.style.top = y + '%';
      el.style.right = 'auto';
      el.style.bottom = 'auto';
      padDrag.x = x; padDrag.y = y;
    });
    el.addEventListener('pointerup', function () {
      if (!padDrag || padDrag.el !== el) return;
      SET.pads = SET.pads || { lx: 2, ly: 62, rx: 62, ry: 62, scale: 1 };
      if (padDrag.id === 'padL') { SET.pads.lx = padDrag.x; SET.pads.ly = padDrag.y; }
      else { SET.pads.rx = padDrag.x; SET.pads.ry = padDrag.y; }
      saveSettings();
      applyPadLayout();
      padDrag = null;
    });
  });

  var small = document.getElementById('peSmall');
  var big = document.getElementById('peBig');
  var reset = document.getElementById('peReset');
  var done = document.getElementById('peDone');
  if (small) small.addEventListener('click', function () { padScale(-0.1); });
  if (big) big.addEventListener('click', function () { padScale(0.1); });
  if (reset) reset.addEventListener('click', function () {
    SET.pads = null; saveSettings(); applyPadLayout(); Snd.sfx('coin');
  });
  if (done) done.addEventListener('click', function () { closePadEditor(); });
}

function padScale(delta) {
  SET.pads = SET.pads || { lx: 2, ly: 62, rx: 62, ry: 62, scale: 1 };
  SET.pads.scale = clamp(Math.round((SET.pads.scale + delta) * 10) / 10, 0.7, 1.5);
  saveSettings();
  applyPadLayout();
  Snd.sfx('select');
}

function openPadEditor() {
  if (!SET.pads) {
    /* seed from where the pads currently sit */
    var vw = window.innerWidth || 1, vh = window.innerHeight || 1;
    var l = document.getElementById('padL'), r = document.getElementById('padR');
    var lr = l ? l.getBoundingClientRect() : null;
    var rr = r ? r.getBoundingClientRect() : null;
    SET.pads = {
      lx: lr ? Math.round(lr.left / vw * 100) : 2,
      ly: lr ? Math.round(lr.top / vh * 100) : 62,
      rx: rr ? Math.round(rr.left / vw * 100) : 62,
      ry: rr ? Math.round(rr.top / vh * 100) : 62,
      scale: 1
    };
    saveSettings();
  }
  padEditorAddedTouch = !document.body.classList.contains('touch');
  document.body.classList.add('editing', 'touch');
  applyPadLayout();
  Game.state = 'pads';
  Snd.sfx('select');
}

function closePadEditor() {
  document.body.classList.remove('editing');
  if (padEditorAddedTouch) document.body.classList.remove('touch');
  padEditorAddedTouch = false;
  Game.state = 'settings';
  Snd.sfx('select');
}

function applyAutoLayout() {
  document.body.classList.toggle('auto', !!SET.autoFire);
}

var canvas, ctx;
var _last = 0, _acc = 0;

/* frame meter, used by the ?fps overlay and the ?bench harness */
var Perf = { fps: 0, ms: 0, frames: 0, total: 0, since: 0 };

/* surface runtime errors instead of failing silently */
window.addEventListener('error', function (e) {
  (window.__eonErrors = window.__eonErrors || []).push(String(e.message));
  try { document.title = 'ERR ' + e.message; } catch (err) {}
});

function boot() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  if (PARAMS.shot) document.body.classList.add('shot');
  if (PARAMS.touch === '1') document.body.classList.add('touch');
  buildScanlines();
  Input.init();
  fitCanvas();
  window.addEventListener('resize', function () { fitCanvas(); applyPadLayout(); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitCanvas);
    window.visualViewport.addEventListener('scroll', fitCanvas);
  }
  window.addEventListener('orientationchange', function () {
    setTimeout(fitCanvas, 150);
  });

  /* first run on a touch device: the fire button is the hardest thing to hold,
     so default to auto-fire there and leave it off for keyboard players */
  if (PARAMS.autofire) { SET.autoFire = PARAMS.autofire === '1' ? 1 : 0; saveSettings(); }
  if (Store.get('settings', null) === null) {
    var touchy = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ||
                 window.matchMedia('(pointer: coarse)').matches;
    SET.autoFire = touchy ? 1 : 0;
    saveSettings();
  }

  Snd.setMuted(!!Store.get('muted', false));
  Game.init();
  applyAutoLayout();
  applyPadLayout();
  initPadEditor();
  lanTestHooks();

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    Snd.resume();
    if (Game.state === 'title') { Game.pressStart(); return; }
    var rect = canvas.getBoundingClientRect();
    var mx = (e.clientX - rect.left) / rect.width * W;
    var my = (e.clientY - rect.top) / rect.height * VIEW_H - Y0;
    Game.tap(mx, my);
  });

  window.__eon = Game;              // test hook

  /* PWA: only over http(s), never from file:// */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  if (PARAMS.demo) runDemo(parseInt(PARAMS.demo, 10) || 240);

  /* benchmark: time N update+render pairs and report the average */
  if (PARAMS.bench) {
    var n = parseInt(PARAMS.bench, 10) || 600;
    var t0 = performance.now();
    for (var bi = 0; bi < n; bi++) {
      Input.touch.right = true;
      Input.touch.fire = true;
      Input.frame();
      Game.update();
      Render(ctx);
    }
    Input.touch = {};
    var per = (performance.now() - t0) / n;
    document.title = 'BENCH ' + per.toFixed(3) + ' ms/frame over ' + n +
      ' frames | enemies=' + Game.enemies.length +
      ' bullets=' + Game.bullets.length + ' particles=' + Game.particles.length;
    return;
  }

  _last = performance.now();
  requestAnimationFrame(loop);
}

function loop(now) {
  var dt = (now - _last) / 1000;
  _last = now;
  if (dt > 0.25) dt = 0.25;
  _acc += dt;

  if (window.__freeze) { Render(ctx); requestAnimationFrame(loop); return; }

  var steps = 0;
  while (_acc >= STEP && steps < 5) {
    if (LAN.active) {
      /* lockstep: do not advance until both players' inputs are in */
      if (!LAN.step()) break;
    } else if (Game.replayMode && Game.replayMasks) {
      /* replay: feed the recorded masks instead of the keyboard */
      var rm = Game.replayMasks[Game.replayFrame] || 0;
      Input.prev = Input.cur;
      Input.cur = actionsFromMask(rm & 511);
      Input.prev2 = Input.cur2;
      Input.cur2 = actionsFromMask((rm >> 9) & 511);
      Game.replayFrame++;
    } else {
      Input.frame();
      if (Rec.recording) Rec.capture();
    }
    if (Input.pressed('fullscreen')) toggleFullscreen();
    Game.update();
    _acc -= STEP;
    steps++;
  }

  var pw = document.getElementById('btnPower');
  if (pw) pw.classList.toggle('ready', Game.canUnleash && Game.canUnleash());

  var t0 = performance.now();
  Render(ctx);
  var t1 = performance.now();

  Perf.frames++;
  Perf.total += (t1 - t0);
  if (Perf.frames % 30 === 0) {
    Perf.ms = Perf.total / 30;
    Perf.total = 0;
  }
  if (now - Perf.since > 500) {
    Perf.fps = Perf.frames * 1000 / Math.max(1, now - Perf.since);
    Perf.frames = 0;
    Perf.since = now;
  }

  requestAnimationFrame(loop);
}

/* ---- fullscreen + wake lock -------------------------------------------- */
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  } catch (e) {}
}

var _wakeLock = null;
function keepAwake(on) {
  if (!('wakeLock' in navigator)) return;
  try {
    if (on && !_wakeLock) {
      navigator.wakeLock.request('screen').then(function (lock) {
        _wakeLock = lock;
        lock.addEventListener('release', function () { _wakeLock = null; });
      }).catch(function () {});
    } else if (!on && _wakeLock) {
      _wakeLock.release().catch(function () {});
      _wakeLock = null;
    }
  } catch (e) {}
}

/* ---- deterministic demo: used for screenshots and smoke tests ----------- */
function lanTestHooks() {
  /* a probe that measures the plain sim rate through the same channel, so a
     slow LAN session can be told apart from a slow machine */
  if (PARAMS.probe) {
    var pc = Lan.client({
      url: Lan.hostUrl(LAN.portFromUrl()),
      onOpen: function () {
        setInterval(function () {
          pc.send({ t: 'report', role: 'probe', frame: Game.time, score: Game.score });
        }, 400);
      }
    });
  }
  if (PARAMS.lan === 'host') LAN.connect('host');
  else if (PARAMS.lan === 'join') LAN.connect('client');
  if (PARAMS.lanreport) {
    setInterval(function () {
      if (!LAN.active) return;
      LAN.send({ t: 'report', role: LAN.role, frame: LAN.frame, delay: LAN.delay, waitT: LAN.waitT, pend: Object.keys(LAN.peerMasks).length, stalls: LAN.stalls, steps: LAN.steps, gt: Game.time,
                 score: Game.score, x: Math.round(Game.player.x),
                 p2x: Game.players[1] ? Math.round(Game.players[1].x) : -1 });
    }, 400);
  }
}

function runDemo(n) {
  if (PARAMS.endless === '1') {
    Game.startEndless(PARAMS.coop === '1');
    if (PARAMS.wave) {
      Game.wave = Math.max(0, parseInt(PARAMS.wave, 10) - 1);
      Game.waveActive = false;
      Game.waveTimer = 1;
    }
  }
  else Game.startGame(PARAMS.coop === '1');
  if (PARAMS.stage) {
    var idx = clamp(parseInt(PARAMS.stage, 10) - 1, 0, STAGES.length - 1);
    Game.loadStage(idx);
    /* screenshots want gameplay, not the intro panel */
    Game.story = null;
    Game.state = 'playing';
  }
  if (PARAMS.warp) {
    Game.player.x = parseFloat(PARAMS.warp);
    Game.camX = clamp(Game.player.x - W * 0.42, 0, Game.stage.length - W);
    Game.pending = Game.pending.filter(function (e) { return e.x > Game.player.x - 100; });
  }
  if (PARAMS.hp) Game.player.hp = parseInt(PARAMS.hp, 10);

  var fire = PARAMS.idle !== '1' && PARAMS.fire !== '0';
  var move = PARAMS.idle !== '1' && PARAMS.right !== '0';
  var jump = PARAMS.jump !== '0';
  for (var i = 0; i < n; i++) {
    Input.touch.right = move;
    Input.touch.fire = fire;
    Input.touch.jump = jump && move && (i % 96 < 5);
    Input.touch.up = PARAMS.aimup === '1' && (i % 120 < 40);
    Input.keys2.right = move;
    Input.keys2.fire = fire;
    Input.keys2.jump = jump && move && (i % 96 < 5);
    Input.frame();
    Game.update();
  }
  /* optional final pose, then settle the camera */
  if (PARAMS.px) {
    var bx = parseFloat(PARAMS.px);
    for (var qi = 0; qi < Game.players.length; qi++) {
      var qp = Game.players[qi];
      qp.x = bx - qi * 34;
      qp.y = GROUND_Y - qp.h;
      qp.vx = 0; qp.vy = 0;
      qp.dead = false; qp.downed = false;
      if (qp.hp < 2) qp.hp = Math.max(2, qp.maxHp - 1);
      qp.invuln = 0; qp.hurtFlash = 0;
    }
    Game.player = Game.players[0];
  }
  Input.keys2 = {};
  if (PARAMS.py) Game.player.y = parseFloat(PARAMS.py);
  if (PARAMS.px || PARAMS.py) {
    Game.camX = Game.arenaLocked ? Game.stage.arenaStart
      : clamp(Game.player.x - W * 0.42, 0, Game.stage.length - W);
    for (var s2 = 0; s2 < 3; s2++) { Input.frame(); Game.update(); }
  }
  Input.touch = {};
  Game.stateTimer = Math.max(Game.stateTimer, 0);
  /* force a boss hazard into a photogenic state for screenshots */
  if (PARAMS.haz && Game.boss) {
    var bn = Game.boss;
    if (PARAMS.haz === 'debris') { bn.debrisT = 1; for (var d1 = 0; d1 < 26; d1++) { Input.frame(); Game.update(); } }
    if (PARAMS.haz === 'beam') {
      bn.beamT = 1;
      for (var d2 = 0; d2 < 96; d2++) { Input.frame(); Game.update(); }
    }
    bn.flash = 0;
  }

  if (PARAMS.pose === 'settings') { Game.state = 'settings'; Game.settingsIndex = 0; }
  if (PARAMS.pose === 'story') {
    Game.startGame(false, 7);
    Game.startStory(STAGES[0].storyIn, 'play');
    for (var sq = 0; sq < 90; sq++) { Game.storyChars += 1; }
  }
  if (PARAMS.pose === 'credits') { Game.startCredits(); Game.creditsY = 150; Game.creditsT = 100; }
  if (PARAMS.pose === 'lan') { Game.state = 'lan'; }
  if (PARAMS.pose === 'perk') { Game.startGame(false, 7); Game.story = null; Game.startPerk(); }
  if (PARAMS.pose === 'pads') { Game.startGame(false, 7); Game.story = null; openPadEditor(); }
  if (PARAMS.pose === 'pause') { Game.state = 'paused'; Game.pauseIndex = 0; }
  if (PARAMS.pose === 'remap') { Game.state = 'remap'; Game.remapPlayer = 'p1'; Game.remapIndex = 3; }
  if (PARAMS.pose === 'leaderboard') { Game.score = 24500; Game.recordRun('EON SECURED'); }
  if (Game.boss) Game.boss.flash = 0;
  if (Game.player) { Game.player.dead = false; Game.player.hurtFlash = 0; Game.player.invuln = 0; }
  window.__freeze = true;
  if (PARAMS.debug) {
    var b = Game.boss;
    document.title = 'DBG cam=' + Math.round(Game.camX) + ' locked=' + Game.arenaLocked +
      ' boss=' + (b ? (Math.round(b.x) + ',' + Math.round(b.y) + ' hp' + b.hp + ' intro' + b.introT) : 'none') +
      ' player=' + Math.round(Game.player.x) + ',' + Math.round(Game.player.y) +
      ' state=' + Game.state + ' banner=' + (Game.banner ? Game.banner.life : '-');
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

/* ===== 95_lan.js ===== */
/* ===========================================================================
   LAN CO-OP — two players on the same Wi-Fi, no internet, no accounts.

   Lockstep input relay. Both machines run the same seeded simulation and only
   exchange 9-bit input masks per frame; each side refuses to advance frame N
   until it has both players' masks for N. That keeps them in perfect sync
   without ever sending world state.

   The simulation was already deterministic (seeded RNG, fixed 60 Hz step), and
   replays already proved masks are enough to reproduce a run — this reuses
   exactly that machinery.
   =========================================================================== */

var LAN = {
  active: false,
  role: null,          /* 'host' | 'client' */
  port: 8081,
  frame: 0,
  seed: 0,
  conn: null,
  status: 'idle',
  peerMasks: {},
  myMasks: {},
  outq: [],
  batch: 4,            /* send one message per 4 frames instead of per frame */
  delay: 12,           /* frames of input delay (~200 ms): absorbs the round trip */
  id: 'p' + Math.floor(Math.random() * 1e9),
  waitT: 0,
  stalls: 0,
  steps: 0,
  sentFrame: -1,
  started: false,

  available: function () { return typeof Lan !== 'undefined' && !!Lan.client; },

  portFromUrl: function () {
    var m = /[?&]lanport=(\d+)/.exec(location.search || '');
    return m ? parseInt(m[1], 10) : 8081;
  },

  connect: function (role) {
    if (!this.available()) { this.status = 'LAN NEEDS THE HOST SERVER'; return false; }
    if (this.conn) return true;
    this.role = role;
    this.port = this.portFromUrl();
    this.status = role === 'host' ? 'WAITING FOR PLAYER 2' : 'CONNECTING...';
    var self = this;
    try {
      this.conn = Lan.client({
        url: Lan.hostUrl(this.port),
        onOpen: function () {
          self.status = role === 'host' ? 'WAITING FOR PLAYER 2' : 'CONNECTED, ASKING TO JOIN';
          if (role === 'client') self.send({ t: 'join' });
        },
        onMessage: function (m) { self.onMessage(m); },
        onError: function () { self.status = 'CONNECTION LOST'; }
      });
    } catch (e) {
      this.status = 'CANNOT REACH THE HOST';
      return false;
    }
    return true;
  },

  send: function (msg) {
    if (!this.conn) return;
    msg.from = this.id;
    try { this.conn.send(msg); } catch (e) {}
  },

  onMessage: function (m) {
    if (!m || !m.t) return;
    /* the room broadcasts to everyone, including the sender — without this the
       client reads its own input back as the other player's */
    if (m.from && m.from === this.id) return;
    if (m.t === 'join' && this.role === 'host') {
      this.seed = ((Date.now() ^ 0x5f3759df) >>> 0);
      this.send({ t: 'start', seed: this.seed });
      this.begin(this.seed);
    } else if (m.t === 'start' && this.role === 'client') {
      this.begin(m.seed >>> 0);
    } else if (m.t === 'in') {
      if (m.arr) { for (var i = 0; i < m.arr.length; i++) this.peerMasks[m.arr[i][0]] = m.arr[i][1]; }
      else this.peerMasks[m.f] = m.m;
    } else if (m.t === 'bye') {
      this.status = 'PLAYER 2 LEFT';
      this.stop();
    }
  },

  begin: function (seed) {
    this.active = true;
    this.started = true;
    this.frame = 0;
    this.seed = seed;
    this.myMasks = {};
    this.peerMasks = {};
    this.sentFrame = -1;
    this.waitT = 0; this.stalls = 0; this.steps = 0;
    this.outq = [];
    /* Prime the delay line so the first frames have neutral input rather than
       stalling while the buffer fills. This must come AFTER the two maps are
       reset — resetting them afterwards was what kept the session on frame 0. */
    for (var i = 0; i < this.delay; i++) { this.myMasks[i] = 0; this.peerMasks[i] = 0; }
    this.status = 'PLAYING';
    Snd.setMuted(false);
    Game.startGame(true, seed);
    /* a cutscene needs both players to press in sync, which lockstep cannot
       guarantee — a LAN run skips the story and starts on the field */
    Game.story = null;
    Game.state = 'playing';
    Game.lanSession = true;
  },

  stop: function () {
    this.active = false;
    this.started = false;
    Game.lanSession = false;
    if (this.conn) { try { this.conn.close(); } catch (e) {} }
    this.conn = null;
  },

  /* Called once per fixed step. Returns true when the frame may advance.
     Input is delayed by `delay` frames: what you press now is applied a few
     frames later, which gives the network that many frames to deliver it. That
     is the difference between playing and stuttering — without it every single
     frame waits on a round trip. */
  step: function () {
    var f = this.frame;

    /* refresh the live keyboard/touch/gamepad state first */
    Input.frame();

    var live = this.role === 'host' ? maskOf(Input.cur) : maskOf(Input.cur2);
    var ahead = f + this.delay;
    if (this.myMasks[ahead] === undefined) {
      this.myMasks[ahead] = live;
      this.outq.push([ahead, live]);
      /* One POST per frame is what cost the most: on a 2-core box it dragged a
         30 fps session to 6. The delay line means a small batch adds no input
         latency, so flush every few frames instead. */
      if (this.outq.length >= this.batch) {
        this.send({ t: 'in', arr: this.outq });
        this.outq = [];
      }
    }

    var mine = this.myMasks[f];
    var theirs = this.peerMasks[f];
    if (mine === undefined || theirs === undefined) {
      this.waitT++; this.stalls++;
      if (this.waitT > 600) this.status = 'WAITING FOR PLAYER 2';
      return false;
    }
    delete this.myMasks[f];
    delete this.peerMasks[f];
    this.waitT = 0;

    var m1 = this.role === 'host' ? mine : theirs;
    var m2 = this.role === 'host' ? theirs : mine;

    Input.prev = Input.cur;
    Input.cur = actionsFromMask(m1 & 511);
    Input.prev2 = Input.cur2;
    Input.cur2 = actionsFromMask(m2 & 511);

    this.frame++; this.steps++;
    return true;
  }
};
