<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>EON COMMANDO — a run-and-gun in one HTML file</title>
<meta name="description" content="EON COMMANDO is a retro run-and-gun platformer: three eras, five weapons, boss fights and chiptune audio in one self-contained HTML file. No dependencies, works offline.">
<meta property="og:title" content="EON COMMANDO">
<meta property="og:description" content="A retro run-and-gun platformer in one self-contained HTML file.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305070d'/%3E%3Cpath d='M8 2l5 4v4l-5 4-5-4V6z' fill='%23ffb545'/%3E%3Crect x='6' y='7' width='4' height='2' fill='%2305070d'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#05070d; --panel:#0b1220; --line:#1d2b3f;
    --amber:#ffb545; --cyan:#54e0ff; --dim:#7f8fa6;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; height:100%; background:var(--ink); color:#cfd8e3;
    font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow:hidden; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:none; overscroll-behavior:none;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #0d1726 0%, #05070d 62%, #03040a 100%);
  }
  #stage{position:relative; line-height:0; filter:drop-shadow(0 0 42px rgba(84,224,255,.13))}
  canvas{
    display:block; image-rendering:pixelated; image-rendering:crisp-edges;
    background:#070a12; border:1px solid var(--line); border-radius:3px;
    box-shadow:0 0 0 1px #04060b, 0 18px 60px rgba(0,0,0,.75);
  }
  /* on-screen controls — shown only for touch devices */
  #pads{display:none}
  body.touch #pads{display:block}
  .pad{position:fixed; bottom:max(14px,env(safe-area-inset-bottom)); display:grid; gap:8px; z-index:5}
  #padL{left:max(14px,env(safe-area-inset-left)); grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,58px)}
  #padL [data-k="up"]{grid-area:1/2}
  #padL [data-k="left"]{grid-area:2/1}
  #padL [data-k="down"]{grid-area:2/2}
  #padL [data-k="right"]{grid-area:2/3}
  #padR{right:max(14px,env(safe-area-inset-right)); grid-template-columns:repeat(2,62px); grid-template-rows:62px}
  .pad button{
    width:100%; height:100%; padding:0; color:#cfd8e3; font:16px ui-monospace,monospace;
    background:rgba(19,28,40,.82); border:1px solid #26394f; border-radius:14px;
    backdrop-filter:blur(2px); transition:background .06s, transform .06s;
  }
  .pad button:active, .pad button.on{background:rgba(84,224,255,.28); border-color:var(--cyan); transform:scale(.96)}
  #padR button{background:rgba(40,26,10,.82); border-color:#4a3a1c; font-weight:700; color:var(--amber)}
  #padR button:active, #padR button.on{background:rgba(255,181,69,.3); border-color:var(--amber)}
  #btnPause{
    position:fixed; top:max(12px,env(safe-area-inset-top)); right:max(12px,env(safe-area-inset-right));
    width:42px; height:42px; padding:0; z-index:6; color:#cfd8e3; font-size:13px;
    background:rgba(19,28,40,.82); border:1px solid #26394f; border-radius:12px; display:none;
  }
  body.touch #btnPause{display:block}
  #hint{
    position:fixed; left:0; right:0; bottom:6px; text-align:center; font-size:11px;
    color:#3f4d61; letter-spacing:.08em; pointer-events:none;
  }
  body.touch #hint{display:none}
  body.shot #hint, body.shot #pads, body.shot #btnPause{display:none!important}
  body.shot{background:#000}
  body.shot canvas{border:0;border-radius:0;box-shadow:none}
  body.shot #stage{filter:none}
  @media (max-height:520px){ #hint{display:none} }
</style>
</head>
<body>

<div id="stage"><canvas id="c" width="480" height="270" aria-label="Eon Commando — game screen"></canvas></div>

<div id="pads">
  <div class="pad" id="padL">
    <button data-k="up" aria-label="Aim up">▲</button>
    <button data-k="left" aria-label="Move left">◀</button>
    <button data-k="down" aria-label="Duck">▼</button>
    <button data-k="right" aria-label="Move right">▶</button>
  </div>
  <div class="pad" id="padR">
    <button data-k="fire" aria-label="Fire">B</button>
    <button data-k="jump" aria-label="Jump">A</button>
  </div>
</div>
<button id="btnPause" aria-label="Pause">❙❙</button>
<div id="hint">ARROWS / WASD move &middot; SPACE jump &middot; Z fire &middot; P pause &middot; M mute</div>

<script>

/* ===== 10_core.js ===== */
/* ===========================================================================
   EON COMMANDO — 10 core
   Constants, maths, storage, small helpers. No dependencies.
   =========================================================================== */
'use strict';

var W = 480, H = 270;              // logical viewport — W widens with the window
var W_MIN = 480, W_MAX = 640;      // 16:9 floor, 21:9 ceiling (desktop range)
var ARENA_W = 480;                 // boss arenas keep a fixed 16:9 footprint
var GROUND_Y = 232;                // world y of the ground surface

/* pick the logical width from the real aspect ratio, clamped to the range */
function viewWidthFor(px_w, px_h) {
  var aspect = px_w / Math.max(1, px_h);
  return clamp(Math.round(H * aspect), W_MIN, W_MAX);
}
var FPS = 60, STEP = 1 / FPS;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(a, b) { if (b === undefined) { b = a; a = 0; } return a + Math.random() * (b - a); }
function rndi(a, b) { return Math.floor(rnd(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function chance(p) { return Math.random() < p; }
function approach(v, target, step) {
  if (v < target) return Math.min(v + step, target);
  if (v > target) return Math.max(v - step, target);
  return target;
}
function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function overlap(a, b, pad) {
  pad = pad || 0;
  return a.x + pad < b.x + b.w && a.x + a.w - pad > b.x &&
         a.y + pad < b.y + b.h && a.y + a.h - pad > b.y;
}

/* ---- persistence: never throw in private mode / file:// ------------------ */
var Store = {
  key: 'eon-commando-v1',
  read: function () {
    try { return JSON.parse(localStorage.getItem(this.key) || '{}') || {}; }
    catch (e) { return {}; }
  },
  write: function (obj) {
    try { localStorage.setItem(this.key, JSON.stringify(obj)); } catch (e) {}
  },
  get: function (k, dflt) { var o = this.read(); return (k in o) ? o[k] : dflt; },
  set: function (k, v) { var o = this.read(); o[k] = v; this.write(o); }
};

/* ---- colour helpers ----------------------------------------------------- */
function rgba(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function shade(hex, f) {
  var n = parseInt(hex.slice(1), 16);
  var r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255);
  var g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255);
  var b = clamp(Math.round((n & 255) * f), 0, 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* ---- debug / test hooks ------------------------------------------------- */
var PARAMS = (function () {
  var out = {}, q = (location.search || '').replace(/^\?/, '').split('&');
  for (var i = 0; i < q.length; i++) {
    if (!q[i]) continue;
    var kv = q[i].split('=');
    out[decodeURIComponent(kv[0])] = kv.length > 1 ? decodeURIComponent(kv[1]) : '1';
  }
  return out;
})();

/* ===== 20_audio.js ===== */
/* ===========================================================================
   EON COMMANDO — 20 audio
   A tiny chiptune engine: two-pulse leads, a triangle bass and a noise kit.
   Everything is synthesised at runtime — the game ships zero audio files.
   =========================================================================== */

var Snd = {
  ctx: null, master: null, musicBus: null, sfxBus: null,
  muted: false, started: false,
  track: null, step: 0, nextTime: 0, timer: null, stepDur: 0.125,

  init: function () {
    if (this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
    } catch (e) { return; }
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.55;
    this.master.connect(this.ctx.destination);
    this.sfxBus = this.ctx.createGain();
    this.sfxBus.gain.value = 0.85;
    this.sfxBus.connect(this.master);
    this.musicBus = this.ctx.createGain();
    this.musicBus.gain.value = 0.42;
    this.musicBus.connect(this.master);
    this.started = true;
  },

  resume: function () {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') {
      try { this.ctx.resume(); } catch (e) {}
    }
  },

  setMuted: function (m) {
    this.muted = !!m;
    if (this.master) this.master.gain.value = m ? 0 : 0.55;
  },

  /* ---- primitives -------------------------------------------------------- */
  blip: function (o) {
    if (!this.ctx || this.muted) return;
    var t0 = this.ctx.currentTime + (o.delay || 0);
    var dur = o.dur || 0.08;
    var osc = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.freq || 440, t0);
    if (o.slide) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.freq * o.slide), t0 + dur);
    }
    var vol = (o.vol === undefined ? 0.2 : o.vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(o.bus || this.sfxBus);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  },

  noise: function (o) {
    if (!this.ctx || this.muted) return;
    var t0 = this.ctx.currentTime + (o.delay || 0);
    var dur = o.dur || 0.1;
    var len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    var src = this.ctx.createBufferSource();
    src.buffer = buf;
    var filt = this.ctx.createBiquadFilter();
    filt.type = o.filter || 'bandpass';
    filt.frequency.setValueAtTime(o.freq || 1200, t0);
    if (o.sweep) filt.frequency.exponentialRampToValueAtTime(Math.max(60, o.freq * o.sweep), t0 + dur);
    filt.Q.value = o.q === undefined ? 0.9 : o.q;
    var g = this.ctx.createGain();
    var vol = (o.vol === undefined ? 0.2 : o.vol);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filt); filt.connect(g); g.connect(o.bus || this.sfxBus);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  },

  /* ---- named effects ----------------------------------------------------- */
  sfx: function (name) {
    if (!this.started) return;
    var B = this.blip.bind(this), N = this.noise.bind(this);
    switch (name) {
      case 'rifle':
        B({ freq: 720, slide: 0.45, dur: 0.06, type: 'square', vol: 0.14 });
        N({ freq: 2600, dur: 0.05, vol: 0.09, filter: 'highpass' });
        break;
      case 'machine':
        B({ freq: 880, slide: 0.5, dur: 0.04, type: 'square', vol: 0.1 });
        break;
      case 'spread':
        B({ freq: 520, slide: 0.35, dur: 0.09, type: 'sawtooth', vol: 0.13 });
        N({ freq: 1500, dur: 0.08, vol: 0.1 });
        break;
      case 'laser':
        B({ freq: 1500, slide: 0.25, dur: 0.12, type: 'sawtooth', vol: 0.12 });
        B({ freq: 2100, slide: 0.3, dur: 0.09, type: 'square', vol: 0.06, delay: 0.01 });
        break;
      case 'flame':
        N({ freq: 900, sweep: 0.4, dur: 0.12, vol: 0.11, filter: 'lowpass', q: 1.2 });
        break;
      case 'enemyShot':
        B({ freq: 300, slide: 0.6, dur: 0.08, type: 'square', vol: 0.07 });
        break;
      case 'jump':
        B({ freq: 300, slide: 2.2, dur: 0.11, type: 'square', vol: 0.12 });
        break;
      case 'land':
        N({ freq: 420, dur: 0.06, vol: 0.08, filter: 'lowpass' });
        break;
      case 'hit':
        N({ freq: 1800, dur: 0.05, vol: 0.14, filter: 'bandpass', q: 2 });
        B({ freq: 240, slide: 0.6, dur: 0.05, type: 'square', vol: 0.07 });
        break;
      case 'hurt':
        B({ freq: 200, slide: 0.3, dur: 0.28, type: 'sawtooth', vol: 0.2 });
        N({ freq: 700, sweep: 0.3, dur: 0.3, vol: 0.16 });
        break;
      case 'explode':
        N({ freq: 1200, sweep: 0.12, dur: 0.42, vol: 0.26, filter: 'lowpass', q: 0.6 });
        B({ freq: 130, slide: 0.25, dur: 0.3, type: 'square', vol: 0.12 });
        break;
      case 'bigExplode':
        N({ freq: 1600, sweep: 0.08, dur: 0.9, vol: 0.32, filter: 'lowpass', q: 0.5 });
        B({ freq: 90, slide: 0.2, dur: 0.7, type: 'sawtooth', vol: 0.18 });
        break;
      case 'pickup':
        B({ freq: 660, dur: 0.06, type: 'square', vol: 0.13 });
        B({ freq: 990, dur: 0.09, type: 'square', vol: 0.13, delay: 0.06 });
        B({ freq: 1320, dur: 0.1, type: 'square', vol: 0.1, delay: 0.12 });
        break;
      case 'health':
        B({ freq: 520, dur: 0.07, type: 'triangle', vol: 0.16 });
        B({ freq: 780, dur: 0.12, type: 'triangle', vol: 0.14, delay: 0.07 });
        break;
      case 'coin':
        B({ freq: 1180, dur: 0.05, type: 'square', vol: 0.09 });
        B({ freq: 1560, dur: 0.07, type: 'square', vol: 0.07, delay: 0.05 });
        break;
      case 'select':
        B({ freq: 880, dur: 0.04, type: 'square', vol: 0.12 });
        break;
      case 'start':
        B({ freq: 440, dur: 0.08, type: 'square', vol: 0.16 });
        B({ freq: 660, dur: 0.08, type: 'square', vol: 0.16, delay: 0.08 });
        B({ freq: 880, dur: 0.16, type: 'square', vol: 0.16, delay: 0.16 });
        break;
      case 'death':
        B({ freq: 420, slide: 0.12, dur: 0.7, type: 'sawtooth', vol: 0.22 });
        N({ freq: 900, sweep: 0.1, dur: 0.7, vol: 0.16 });
        break;
      case 'stageClear':
        [523, 659, 784, 1046].forEach(function (f, i) {
          B({ freq: f, dur: 0.14, type: 'square', vol: 0.15, delay: i * 0.11 });
        });
        break;
      case 'gameOver':
        [392, 330, 262, 196].forEach(function (f, i) {
          B({ freq: f, dur: 0.3, type: 'triangle', vol: 0.18, delay: i * 0.22 });
        });
        break;
      case 'bossWarn':
        B({ freq: 180, dur: 0.25, type: 'sawtooth', vol: 0.2 });
        B({ freq: 180, dur: 0.25, type: 'sawtooth', vol: 0.2, delay: 0.35 });
        break;
      case 'bossHit':
        N({ freq: 500, sweep: 0.5, dur: 0.12, vol: 0.18, filter: 'bandpass', q: 1.5 });
        B({ freq: 160, slide: 0.7, dur: 0.1, type: 'square', vol: 0.1 });
        break;
    }
  },

  /* ---- music ------------------------------------------------------------- */
  playMusic: function (track) {
    this.init();
    if (!this.ctx) return;
    if (this.track === track) return;
    this.track = track;
    this.step = 0;
    this.stepDur = 60 / track.bpm / 4;              // 16th notes
    this.nextTime = this.ctx.currentTime + 0.08;
    if (this.timer) return;
    var self = this;
    this.timer = setInterval(function () { self.schedule(); }, 40);
  },

  stopMusic: function () {
    this.track = null;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },

  schedule: function () {
    if (!this.ctx || !this.track) return;
    var lookahead = this.ctx.currentTime + 0.25;
    var guard = 0;
    while (this.nextTime < lookahead && guard++ < 64) {
      this.playStep(this.step, this.nextTime);
      this.nextTime += this.stepDur;
      this.step = (this.step + 1) % 16;
    }
  },

  midi: function (n) { return 440 * Math.pow(2, (n - 69) / 12); },

  playStep: function (step, time) {
    var tr = this.track;
    if (!tr || this.muted) return;
    var delay = Math.max(0, time - this.ctx.currentTime);

    var bass = tr.bass[step];
    if (bass !== null && bass !== undefined) {
      this.blip({ freq: this.midi(tr.root + bass), dur: this.stepDur * 1.7,
                  type: 'triangle', vol: 0.3, delay: delay, bus: this.musicBus });
    }
    var lead = tr.lead[step];
    if (lead !== null && lead !== undefined) {
      this.blip({ freq: this.midi(tr.root + 24 + lead), dur: this.stepDur * 1.1,
                  type: 'square', vol: 0.1, delay: delay, bus: this.musicBus });
    }
    var drum = tr.drums.charAt(step);
    if (drum === 'k') {
      this.noise({ freq: 140, dur: 0.1, vol: 0.22, filter: 'lowpass', delay: delay, bus: this.musicBus });
    } else if (drum === 's') {
      this.noise({ freq: 2000, dur: 0.09, vol: 0.13, filter: 'highpass', delay: delay, bus: this.musicBus });
    } else if (drum === 'h') {
      this.noise({ freq: 7000, dur: 0.03, vol: 0.05, filter: 'highpass', delay: delay, bus: this.musicBus });
    }
  }
};

/* ---- tracks ------------------------------------------------------------- */
var TRACKS = {
  title: {
    bpm: 96, root: 45,
    bass: [0, null, null, null, 0, null, -2, null, -4, null, null, null, -5, null, null, null],
    lead: [null, 12, null, 15, null, 12, null, 10, null, 7, null, 10, null, 12, null, null],
    drums: 'k.......s.......'
  },
  stage1: {
    bpm: 132, root: 45,
    bass: [0, 0, null, 0, 7, null, 0, null, 3, null, 3, null, 5, null, 7, null],
    lead: [12, null, 15, null, 19, null, 15, null, 12, null, 10, null, 12, null, 15, null],
    drums: 'k..h.s..k.kh.s.h'
  },
  stage2: {
    bpm: 124, root: 43,
    bass: [0, null, 0, null, -2, null, 3, null, 5, null, 3, null, 0, null, -2, null],
    lead: [null, 12, 14, null, 15, null, 14, 12, null, 10, 12, null, 14, null, null, 12],
    drums: 'k...s..hk...s.hh'
  },
  stage3: {
    bpm: 144, root: 41,
    bass: [0, 0, 12, 0, 0, 0, 10, 0, 0, 0, 8, 0, 7, 7, 6, 6],
    lead: [19, null, 18, null, 15, null, 18, null, 19, null, 22, null, 19, null, 15, null],
    drums: 'k.hks.hkk.hks.hk'
  },
  boss: {
    bpm: 152, root: 40,
    bass: [0, 0, 0, 0, 1, 1, 0, 0, -2, -2, -2, -2, 3, 3, 1, 1],
    lead: [12, 13, 12, 10, 12, 15, 12, 10, 12, 13, 12, 10, 7, 8, 10, 12],
    drums: 'k.hks.hkk.hks.hk'
  }
};

/* ===== 30_input.js ===== */
/* ===========================================================================
   EON COMMANDO — 30 input
   One action set, three sources: keyboard, touch pads, gamepad.
   =========================================================================== */

var Input = {
  keys: {},          // physical keys currently down
  touch: {},         // on-screen buttons currently down
  pad: {},           // gamepad-derived actions
  cur: {},           // merged actions this frame
  prev: {},          // merged actions last frame
  anyKey: false,

  MAP: {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    Space: 'jump', KeyX: 'jump', KeyK: 'jump',
    KeyZ: 'fire', KeyJ: 'fire', ControlLeft: 'fire', ControlRight: 'fire',
    Enter: 'start', NumpadEnter: 'start',
    KeyP: 'pause', Escape: 'pause',
    KeyM: 'mute',
    KeyR: 'restart'
  },

  ACTIONS: ['left', 'right', 'up', 'down', 'jump', 'fire', 'start', 'pause', 'mute', 'restart'],

  init: function () {
    var self = this;

    window.addEventListener('keydown', function (e) {
      var a = self.MAP[e.code];
      if (a) {
        self.keys[a] = true;
        self.anyKey = true;
        if (e.code === 'Space' || e.code.indexOf('Arrow') === 0 || e.code === 'Enter') e.preventDefault();
      }
      Snd.resume();
    }, { passive: false });

    window.addEventListener('keyup', function (e) {
      var a = self.MAP[e.code];
      if (a) self.keys[a] = false;
    });

    window.addEventListener('blur', function () {
      self.keys = {};
      self.touch = {};
    });

    /* on-screen pads -------------------------------------------------------- */
    var buttons = document.querySelectorAll('[data-k]');
    for (var i = 0; i < buttons.length; i++) {
      (function (btn) {
        var action = btn.getAttribute('data-k');
        var down = function (e) {
          e.preventDefault();
          self.touch[action] = true;
          btn.classList.add('on');
          Snd.resume();
        };
        var up = function (e) {
          if (e) e.preventDefault();
          self.touch[action] = false;
          btn.classList.remove('on');
        };
        btn.addEventListener('pointerdown', down);
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointercancel', up);
        btn.addEventListener('pointerleave', up);
        btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      })(buttons[i]);
    }

    var pauseBtn = document.getElementById('btnPause');
    if (pauseBtn) {
      pauseBtn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        self.touch.pause = true;
        Snd.resume();
        setTimeout(function () { self.touch.pause = false; }, 120);
      });
    }

    /* touch capability detection ------------------------------------------- */
    var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ||
                  window.matchMedia('(pointer: coarse)').matches;
    if (isTouch) document.body.classList.add('touch');

    window.addEventListener('pointerdown', function () { Snd.resume(); }, { passive: true });
  },

  frame: function () {
    this.prev = this.cur;
    var cur = {};
    for (var i = 0; i < this.ACTIONS.length; i++) {
      var a = this.ACTIONS[i];
      cur[a] = !!(this.keys[a] || this.touch[a] || this.pad[a]);
    }
    this.cur = cur;
    this.pollGamepad();
  },

  pollGamepad: function () {
    if (!navigator.getGamepads) return;
    var pads = navigator.getGamepads();
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i];
      if (!p) continue;
      var b = p.buttons, ax = p.axes;
      this.pad.left = (b[14] && b[14].pressed) || ax[0] < -0.4;
      this.pad.right = (b[15] && b[15].pressed) || ax[0] > 0.4;
      this.pad.up = (b[12] && b[12].pressed) || ax[1] < -0.4;
      this.pad.down = (b[13] && b[13].pressed) || ax[1] > 0.4;
      this.pad.jump = !!(b[0] && b[0].pressed);
      this.pad.fire = !!((b[2] && b[2].pressed) || (b[1] && b[1].pressed));
      this.pad.start = !!((b[9] && b[9].pressed) || (b[8] && b[8].pressed));
      this.pad.pause = !!(b[9] && b[9].pressed);
      return;
    }
  },

  held: function (a) { return !!this.cur[a]; },
  pressed: function (a) { return !!this.cur[a] && !this.prev[a]; },
  released: function (a) { return !this.cur[a] && !!this.prev[a]; },
  axis: function () { return (this.held('right') ? 1 : 0) - (this.held('left') ? 1 : 0); }
};

/* ---- canvas scaling ------------------------------------------------------
   Keep the 480x270 buffer crisp: scale by a whole number where possible.   */
function fitCanvas() {
  var cv = document.getElementById('c');
  if (!cv) return;

  /* logical width follows the window's aspect ratio (16:9 -> 21:9) */
  var w = viewWidthFor(window.innerWidth, window.innerHeight);
  if (w !== W) {
    W = w;
    cv.width = W;
    cv.height = H;
    var g2 = cv.getContext('2d');
    g2.imageSmoothingEnabled = false;
    if (typeof Game !== 'undefined' && Game.stage) {
      Game.camX = clamp(Game.camX, 0, Game.stage.length - W);
    }
  }

  var availW = window.innerWidth;
  var availH = window.innerHeight;
  if (PARAMS.shot) {
    var sc0 = Math.min(availW / W, availH / H);
    cv.style.width = Math.round(W * sc0) + 'px';
    cv.style.height = Math.round(H * sc0) + 'px';
    return;
  }

  var pad = document.body.classList.contains('touch') ? 4 : 24;
  availW -= pad;
  availH -= document.body.classList.contains('touch') ? 4 : 60;
  var scale = Math.min(availW / W, availH / H);
  var snapped = Math.floor(scale);
  if (snapped >= 1 && snapped / scale > 0.9) scale = snapped;
  cv.style.width = Math.round(W * scale) + 'px';
  cv.style.height = Math.round(H * scale) + 'px';
}

/* ===== 40_art.js ===== */
/* ===========================================================================
   EON COMMANDO — 40 art
   Pixel-pure, but drawn with curves: rounded caps, arcs, ellipses and bezier
   limbs instead of stacked rectangles. Everything is still on the 480x270
   grid, still asset-free, still drawn at runtime.
   =========================================================================== */

function px(g, x, y, w, h, c) {
  g.fillStyle = c;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

/* ---- curved primitives (pixel-scale friendly) --------------------------- */
function rr(g, x, y, w, h, r, c) {
  r = Math.min(r, w / 2, h / 2);
  g.fillStyle = c;
  g.beginPath();
  if (g.roundRect) {
    g.roundRect(x, y, w, h, r);
  } else {
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
  }
  g.closePath();
  g.fill();
}

function el(g, cx, cy, rx, ry, c) {
  g.fillStyle = c;
  g.beginPath();
  g.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, 6.2832);
  g.fill();
}

function circ(g, cx, cy, r, c) {
  g.fillStyle = c;
  g.beginPath();
  g.arc(cx, cy, Math.max(0.5, r), 0, 6.2832);
  g.fill();
}

/* a limb: a stroked line with round caps reads as a capsule */
function limb(g, x1, y1, x2, y2, thick, c) {
  g.strokeStyle = c;
  g.lineWidth = thick;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(x1, y1);
  g.lineTo(x2, y2);
  g.stroke();
}

function curve(g, pts, thick, c) {
  g.strokeStyle = c;
  g.lineWidth = thick;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length - 1; i += 2) {
    g.quadraticCurveTo(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
  }
  g.stroke();
}

/* soft radial glow, used for cores, muzzles and pickups */
function glow(g, cx, cy, r, c, alpha) {
  var grd = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, r));
  grd.addColorStop(0, rgba(c, alpha === undefined ? 0.55 : alpha));
  grd.addColorStop(1, rgba(c, 0));
  g.fillStyle = grd;
  g.fillRect(cx - r, cy - r, r * 2, r * 2);
}

var FONT = (function () {
  var out = {};
  for (var ch in FONT_SRC) out[ch] = FONT_SRC[ch].split('/');
  return out;
})();

function textWidth(str, scale) {
  scale = scale || 1;
  return (str.length * 6 - 1) * scale;
}

function drawText(g, str, x, y, scale, color, align, shadow) {
  scale = scale || 1;
  str = String(str).toUpperCase();
  var w = textWidth(str, scale);
  if (align === 'center') x -= w / 2;
  else if (align === 'right') x -= w;
  x = Math.round(x); y = Math.round(y);
  if (shadow) drawText(g, str, x + scale, y + scale, scale, shadow, 'left', null);
  g.fillStyle = color || '#fff';
  for (var i = 0; i < str.length; i++) {
    var glyph = FONT[str.charAt(i)] || FONT['?'];
    var gx = x + i * 6 * scale;
    for (var r = 0; r < 7; r++) {
      var row = glyph[r];
      for (var c = 0; c < 5; c++) {
        if (row.charAt(c) === '#') g.fillRect(gx + c * scale, y + r * scale, scale, scale);
      }
    }
  }
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---- the commando ------------------------------------------------------- */
function drawPlayer(g, p) {
  var x = Math.round(p.x), y = Math.round(p.y);
  var f = p.facing >= 0 ? 1 : -1;
  var duck = p.ducking && p.onGround;
  var hurt = p.hurtFlash > 0 && (Math.floor(p.hurtFlash / 3) % 2 === 0);
  var OL = SUIT.outline;
  function C(c) { return hurt ? '#ffffff' : c; }

  var suit = C(SUIT.suit), suitLit = C(SUIT.suitLit), suitDark = C(SUIT.suitDark);
  var armour = C(SUIT.armour), armourLit = C(SUIT.armourLit), armourDark = C(SUIT.armourDark);
  var boot = C(SUIT.boot), visor = C(SUIT.visor), visorLit = C(SUIT.visorLit);

  /* draw in local space, mirrored by the transform — curves stay symmetrical */
  g.save();
  g.translate(f > 0 ? x : x + 12, y);
  g.scale(f, 1);

  if (duck) {
    /* crouched: low, coiled, still reads as a soldier */
    limb(g, 3, 12, 2, 13, 4, suitDark);
    limb(g, 9, 12, 10, 13, 4, suitDark);
    rr(g, 1, 6, 10, 6, 2.5, armour);
    rr(g, 1, 6, 10, 2, 1.5, armourLit);
    rr(g, 0.5, 9, 3, 3, 1.2, suit);
    circ(g, 6, 3.4, 3.4, suit);
    rr(g, 4, 1.6, 6, 3.4, 1.6, suit);
    rr(g, 4.4, 1.8, 5.2, 1.2, 0.6, suitLit);
    rr(g, 5.5, 2.6, 4, 1.6, 0.8, visor);
    px(g, 6.5, 2.6, 2, 0.9, visorLit);
    rr(g, 0.6, 12, 4.4, 2, 0.8, boot);
    rr(g, 7, 12, 4.4, 2, 0.8, boot);
  } else {
    /* legs — capsule thighs and shins with a real run cycle */
    var swing = p.onGround ? Math.sin(p.runPhase * Math.PI * 2) : 0.55;
    var lift = p.onGround ? Math.max(0, Math.cos(p.runPhase * Math.PI * 2)) : 0;
    var backX = 5 - swing * 2.2, frontX = 7 + swing * 2.2;
    var backLift = Math.max(0, -swing) * 2.4, frontLift = Math.max(0, swing) * 2.4;

    limb(g, 5, 15, backX, 20 - backLift, 3.2, suitDark);
    limb(g, 7, 15, frontX, 20 - frontLift, 3.2, suit);
    rr(g, backX - 2, 19 - backLift, 4.2, 2.2, 0.9, boot);
    rr(g, frontX - 1.4, 19 - frontLift, 4.6, 2.2, 0.9, boot);

    /* backpack */
    rr(g, 0.2, 9, 2.2, 5.4, 1, suitDark);

    /* torso */
    rr(g, 1.4, 8, 9.2, 7.4, 2.6, armour);
    rr(g, 1.4, 8, 9.2, 2.6, 1.6, armourLit);
    rr(g, 3.4, 11.4, 5.4, 1.4, 0.7, suit);
    rr(g, 1.6, 13.4, 8.8, 1.2, 0.6, armourDark);

    /* shoulder pad */
    rr(g, 1, 8, 3.4, 3.2, 1.5, armour);
    px(g, 1.8, 8.6, 1.8, 0.9, armourLit);

    /* neck + helmet */
    rr(g, 4.2, 6.2, 3.6, 2, 0.9, suitDark);
    circ(g, 6, 3.6, 3.5, suit);
    rr(g, 3.2, 1.2, 6.2, 4.4, 2, suit);
    rr(g, 3.8, 1.4, 5, 1.2, 0.6, suitLit);
    /* crest */
    rr(g, 5.4, 0.2, 2.4, 1.4, 0.7, armour);

    /* visor, angled with the aim */
    var vis = clamp(p.aimAngle, -1.1, 1.1);
    g.save();
    g.translate(6.4, 3.4);
    g.rotate(vis * 0.22);
    rr(g, -1.4, -1.1, 5, 2.2, 1.1, visor);
    px(g, 0.2, -0.9, 2.2, 0.8, visorLit);
    g.restore();
  }
  g.restore();

  /* arm + weapon in world space, because the aim angle already has facing in it */
  var shoulderX = f > 0 ? x + 8 : x + 4;
  var shoulderY = y + (duck ? 8 : 10.5);
  var handX = shoulderX + Math.cos(p.aimAngle) * 5.5;
  var handY = shoulderY + Math.sin(p.aimAngle) * 5.5;
  limb(g, shoulderX, shoulderY, handX, handY, 2.6, hurt ? '#ffffff' : SUIT.suit);

  g.save();
  g.translate(handX, handY);
  g.rotate(p.aimAngle);
  rr(g, -1, -1.4, 8.4, 2.8, 1.2, SUIT.outline);
  rr(g, -0.4, -0.9, 7.4, 1.8, 0.8, hurt ? '#ffffff' : SUIT.gun);
  px(g, -0.4, -0.9, 7, 0.7, hurt ? '#ffffff' : '#d6e2ec');
  rr(g, 3.4, -1.8, 4.4, 3.4, 1.2, SUIT.outline);
  rr(g, 3.8, -1.3, 3.4, 2.4, 0.9, SUIT.gunDark);
  if (p.muzzle > 0) {
    glow(g, 9, 0, 7, '#ffb545', 0.55);
    rr(g, 8, -1.6, 4, 3.2, 1.4, '#ffe9a8');
    rr(g, 9.4, -0.9, 3, 1.8, 0.9, '#fff8e0');
  }
  g.restore();
}

function drawRunner(g, e) {

  function C(c) { return flash ? '#ffffff' : c; }
  var x = Math.round(e.x), y = Math.round(e.y);

  g.translate(-7, -15);

  /* hind legs */
  limb(g, 5, 11, 3.6, 14 + s2 * 0.4, 2.2, C(P.bodyDark));
  limb(g, 9, 11, 10.4, 14 - s2 * 0.4, 2.2, C(P.bodyDark));

  /* streamlined body */
  el(g, 7, 7.6, 5.6, 3.6, C(P.body));
  el(g, 6.2, 6.4, 4.4, 2.2, C(P.bodyLit));
  /* head */
  el(g, 11, 5.4, 3, 2.6, C(P.body));
  el(g, 11.6, 4.6, 2, 1.4, C(P.bodyLit));
  rr(g, 12.2, 4.6, 2.6, 1.6, 0.8, '#ffd257');
  px(g, 13.4, 4.8, 1.2, 0.8, '#fff6d0');
  /* claws */
  limb(g, 13, 6.6, 15, 7.4, 1.2, C(P.bodyDark));
  g.restore();
}

function drawDrone(g, e) {
  var P = palFor(e);
  var flash = e.flash > 0 && (Math.floor(e.flash / 2) % 2 === 0);
  function C(c) { return flash ? '#ffffff' : c; }
  var x = Math.round(e.x), y = Math.round(e.y);
  var bob = Math.sin(e.age * 0.12) * 1.4;
  var cx = x + 8, cy = y + 5 + bob;
  var s = e.scale || 1;

  glow(g, cx, cy, 13, C(P.eye), 0.16);

  g.save();
  g.translate(cx, cy);
  g.scale(s, s);

  /* rotor arms */
  limb(g, -9, -2, -4, -1, 1.2, C(P.metal));
  limb(g, 9, -2, 4, -1, 1.2, C(P.metal));
  var spin = Math.floor(e.age / 3) % 2 === 0 ? 4.4 : 2.6;
  el(g, -9, -2.6, spin, 0.9, '#8fa4b8');
  el(g, 9, -2.6, spin, 0.9, '#8fa4b8');

  /* hull */
  el(g, 0, 0, 8, 4.6, C(P.metal));
  el(g, 0, -1.2, 6.4, 2.6, C(P.metalLit));
  rr(g, -3, -4.4, 6, 2.4, 1.2, C(P.metal));

  /* eye */
  circ(g, 0, 0.8, 2.4, C(P.eye));
  circ(g, -0.4, 0.2, 1.1, C(P.eyeLit));
  g.restore();
}

function drawTurret(g, e) {
  var P = palFor(e);
  var flash = e.flash > 0 && (Math.floor(e.flash / 2) % 2 === 0);
  function C(c) { return flash ? '#ffffff' : c; }
  var x = Math.round(e.x), y = Math.round(e.y);
  var cx = x + 8, base = y + 14;

  /* base */
  el(g, cx, base, 8, 2.6, C(P.bodyDark));
  rr(g, x + 1, base - 5, 14, 5, 2.2, C(P.metal));
  rr(g, x + 1, base - 5, 14, 1.4, 0.7, C(P.metalLit));

  /* dome */
  circ(g, cx, y + 6.4, 5.2, C(P.metal));
  rr(g, cx - 5.2, y + 4, 10.4, 4, 2, C(P.metal));
  el(g, cx, y + 4.4, 4, 1.4, C(P.metalLit));

  /* eye */
  circ(g, cx, y + 6, 1.8, C(P.eye));
  circ(g, cx - 0.3, y + 5.6, 0.8, C(P.eyeLit));

  /* barrel */
  g.save();
  g.translate(cx, y + 7);
  g.rotate(e.aimAngle || 0);
  rr(g, 0, -1.6, 11, 3.2, 1.4, C(P.metal));
  rr(g, 0, -1, 10, 1.2, 0.6, C(P.metalLit));
  rr(g, 9, -1.9, 3, 3.8, 1.2, C(P.bodyDark));
  g.restore();
}

function drawJumper(g, e) {
  var P = palFor(e);
  var flash = e.flash > 0 && (Math.floor(e.flash / 2) % 2 === 0);
  function C(c) { return flash ? '#ffffff' : c; }
  var x = Math.round(e.x), y = Math.round(e.y);
  var f = e.facing >= 0 ? 1 : -1;
  var squash = e.onGround ? 1 : 0;
  var s = e.scale || 1;

  g.save();
  g.translate(x + 7, y + e.h);
  g.scale(f * s, s);
  g.translate(-7, -12);

  /* legs, coiled when grounded */
  limb(g, 5, 8, 2.6, 11 + squash, 2.2, C(P.bodyDark));
  limb(g, 9, 8, 11.4, 11 + squash, 2.2, C(P.bodyDark));

  /* body */
  el(g, 7, 6.4 - squash * 0.6, 6, 3.4 - squash * 0.4, C(P.body));
  el(g, 6.2, 5.4 - squash * 0.6, 4.6, 2, C(P.bodyLit));

  /* eyes */
  circ(g, 9.6, 4.6, 1.5, C(P.eye));
  px(g, 10.1, 4.2, 0.8, 0.8, C(P.eyeLit));
  circ(g, 5.4, 4.8, 1.2, C(P.eye));
  g.restore();
}

/* ---- pickups ------------------------------------------------------------ */
function drawCapsule(g, c) {
  var x = Math.round(c.x), y = Math.round(c.y);
  var bob = Math.sin(c.age * 0.1) * 2;
  y += bob;
  var col = c.kind === 'health' ? '#54ffa8' : (c.kind === 'coin' ? '#ffd257' : '#54e0ff');

  glow(g, x + 7, y + 7, 15, col, 0.22);
  rr(g, x - 0.5, y - 0.5, 15, 15, 5, 'rgba(8,14,22,0.85)');
  rr(g, x + 0.5, y + 0.5, 13, 13, 4.4, col);
  rr(g, x + 2, y + 2, 10, 3.4, 1.6, 'rgba(255,255,255,0.75)');

  if (c.kind === 'health') {
    rr(g, x + 6, y + 4, 2.4, 6.4, 1, '#08301c');
    rr(g, x + 4, y + 6, 6.4, 2.4, 1, '#08301c');
  } else if (c.kind === 'coin') {
    circ(g, x + 7, y + 7, 3.2, '#7a5400');
    circ(g, x + 7, y + 7, 2.2, '#fff0b8');
  } else {
    drawText(g, c.label || 'W', x + 4.4, y + 3.6, 1, '#062231');
  }
}

/* ---- bosses ------------------------------------------------------------- */
function drawWarden(g, b) {
  var flash = b.flash > 0 && (Math.floor(b.flash / 2) % 2 === 0);
  function C(c) { return flash ? '#ffffff' : c; }
  var x = Math.round(b.x), y = Math.round(b.y);
  var w = b.w, h = b.h;
  var step = Math.sin(b.age * 0.08) * 3;
  var plate = C('#4a5568'), plateLit = C('#7c8a9e'), plateDark = C('#2c3444');
  var accent = C('#c0392b');

  /* legs — rounded joints, heavy stance */
  limb(g, x + 16, y + h - 30 + step, x + 15, y + h - 4 + step, 11, plateDark);
  limb(g, x + w - 16, y + h - 30 - step, x + w - 15, y + h - 4 - step, 11, plateDark);
  rr(g, x + 6, y + h - 8 + step, 19, 7, 3, plate);
  rr(g, x + w - 25, y + h - 8 - step, 19, 7, 3, plate);

  /* hips + torso */
  rr(g, x + 6, y + 24, w - 12, h - 46, 9, plate);
  rr(g, x + 6, y + 24, w - 12, 8, 4, plateLit);
  rr(g, x + 11, y + 34, w - 22, 9, 4, plateDark);
  rr(g, x + 11, y + 50, w - 22, 4, 2, accent);

  /* shoulder cannons */
  rr(g, x - 6, y + 26, 15, 15, 5, plateLit);
  circ(g, x - 7, y + 33, 3.4, plateDark);
  rr(g, x + w - 9, y + 26, 15, 15, 5, plateLit);
  circ(g, x + w + 7, y + 33, 3.4, plateDark);

  /* head */
  rr(g, x + w / 2 - 12, y + 5, 24, 19, 7, plateLit);
  rr(g, x + w / 2 - 12, y + 5, 24, 6, 3, C('#a9b6c6'));
  rr(g, x + w / 2 - 8, y + 12, 16, 7, 3, '#0a0e16');
  rr(g, x + w / 2 - 7, y + 13, 14, 5, 2.4, accent);
  rr(g, x + w / 2 - 4, y + 14, 8, 3, 1.4, C('#ffe9a8'));
  limb(g, x + w / 2 - 14, y + 2, x + w / 2 - 14, y + 8, 2.4, plateDark);
  limb(g, x + w / 2 + 14, y + 2, x + w / 2 + 14, y + 8, 2.4, plateDark);

  /* core */
  var coreY = y + h - 42, cx = x + w / 2;
  circ(g, cx, coreY + 8, 11, '#0a0e16');
  glow(g, cx, coreY + 8, 20, b.phase === 2 ? '#ff5c3c' : '#ffb545', 0.5);
  circ(g, cx, coreY + 8, 7.4, b.phase === 2 ? '#ff5c3c' : '#ffb545');
  circ(g, cx, coreY + 8, 4, '#fff3c4');
}

function drawWraith(g, b) {
  var flash = b.flash > 0 && (Math.floor(b.flash / 2) % 2 === 0);
  function C(c) { return flash ? '#ffffff' : c; }
  var x = Math.round(b.x), y = Math.round(b.y);
  var w = b.w, h = b.h;
  var flap = Math.sin(b.age * 0.14) * 6;
  var shell = C('#2b6f8f'), shellLit = C('#7fe3ff'), dark = '#08131c';
  var cx = x + w / 2, cy = y + h / 2;

  /* wings — bezier membranes */
  g.save();
  g.fillStyle = shell;
  g.beginPath();
  g.moveTo(cx - 12, cy - 2);
  g.quadraticCurveTo(cx - 34, cy - 16 + flap, cx - 46, cy - 2 + flap);
  g.quadraticCurveTo(cx - 30, cy + 2 + flap, cx - 12, cy + 8);
  g.closePath();
  g.fill();
  g.beginPath();
  g.moveTo(cx + 12, cy - 2);
  g.quadraticCurveTo(cx + 34, cy - 16 - flap, cx + 46, cy - 2 - flap);
  g.quadraticCurveTo(cx + 30, cy + 2 - flap, cx + 12, cy + 8);
  g.closePath();
  g.fill();
  g.restore();
  limb(g, cx - 14, cy - 1, cx - 42, cy - 4 + flap, 1.6, shellLit);
  limb(g, cx + 14, cy - 1, cx + 42, cy - 4 - flap, 1.6, shellLit);

  /* body */
  el(g, cx, cy, w / 2 - 6, h / 2 - 6, dark);
  el(g, cx, cy, w / 2 - 8, h / 2 - 8, shell);
  el(g, cx, cy - 6, w / 2 - 12, 4, shellLit);

  /* crystal core */
  glow(g, cx, cy + 4, 24, b.phase === 2 ? '#ff5c3c' : '#bff4ff', 0.45);
  circ(g, cx, cy + 4, 8, dark);
  circ(g, cx, cy + 4, 6, b.phase === 2 ? '#ff5c3c' : '#bff4ff');
  circ(g, cx, cy + 4, 2.6, '#ffffff');

  /* eyes */
  circ(g, cx - 13, cy - 8, 2.4, dark);
  circ(g, cx + 13, cy - 8, 2.4, dark);
  circ(g, cx - 13, cy - 8, 1.3, '#ff4d6d');
  circ(g, cx + 13, cy - 8, 1.3, '#ff4d6d');
}

function drawHeart(g, b) {
  var flash = b.flash > 0 && (Math.floor(b.flash / 2) % 2 === 0);
  function C(c) { return flash ? '#ffffff' : c; }
  var x = Math.round(b.x), y = Math.round(b.y);
  var cx = x + b.w / 2, cy = y + b.h / 2;
  var spin = b.age * 0.04;
  var pulse = 1 + Math.sin(b.age * 0.16) * 0.08;

  /* orbiting nodes */
  for (var i = 0; i < 3; i++) {
    var a = spin + i * Math.PI * 2 / 3;
    var ox = cx + Math.cos(a) * (b.w / 2 - 5);
    var oy = cy + Math.sin(a) * (b.h / 4);
    circ(g, ox, oy, 4.4, '#0a0e16');
    circ(g, ox, oy, 3.4, C('#c9a227'));
    circ(g, ox, oy, 1.6, '#ffe9a8');
  }

  /* shell */
  circ(g, cx, cy, 26, '#0a0e16');
  circ(g, cx, cy, 24, C('#3a1030'));
  el(g, cx, cy - 12, 20, 8, C('#6b1d4f'));

  /* the heart */
  glow(g, cx, cy, 34, b.phase === 2 ? '#ff3b2f' : '#ff2d95', 0.5);
  circ(g, cx, cy, 15 * pulse, b.phase === 2 ? '#ff5c3c' : '#ff2d95');
  circ(g, cx, cy, 9 * pulse, '#ffd0e4');
  circ(g, cx, cy, 4.4 * pulse, '#ffffff');
}
