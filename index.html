    if (b.debrisT === undefined) b.debrisT = 320;
    if (b.debrisT-- <= 0) {
      var target = nearestPlayer(b.x + b.w / 2, b.y) || p;
      spawnDebris(target.x + target.w / 2, b.phase === 2 ? 5 : 3, 0);
      Snd.sfx('bossWarn');
      Game.shake = Math.max(Game.shake, 4);
      b.debrisT = b.phase === 2 ? 210 : 300;
    }

    if (b.shootT-- <= 0) {
      var n = b.phase === 2 ? 5 : 3;
      var ox = b.x + b.w / 2, oy = b.y + 34;
      var base = Math.atan2((p.y + p.h / 2) - oy, pcx - ox);
      for (var i = 0; i < n; i++) {
        var a = base + (i - (n - 1) / 2) * 0.17;
        spawnBullet({
          x: ox, y: oy, vx: Math.cos(a) * 2.9, vy: Math.sin(a) * 2.9,
          dmg: 1, friendly: false, color: '#ff7a45', glow: '#ffd9a8',
          w: 5, h: 5, life: 200, angle: a
        });
      }
      Snd.sfx('enemyShot');
      b.shootT = b.phase === 2 ? 62 : 96;
    }
    if (b.specialT-- <= 0) {
      /* ground shockwave */
      for (var s = 0; s < 2; s++) {
        var dirS = s === 0 ? -1 : 1;
        spawnBullet({
          x: b.x + b.w / 2, y: GROUND_Y - 6, vx: dirS * 3.4, vy: 0,
          dmg: 1, friendly: false, color: '#ffb545', glow: '#fff3c4',
          w: 8, h: 8, life: 200, angle: 0
        });
      }
      Game.shake = 8;
      Snd.sfx('explode');
      b.specialT = b.phase === 2 ? 150 : 230;
    }
  }

  if (b.kind === 'wraith') {
    b.x = clamp(b.x + Math.cos(b.age * 0.013) * 0.9, leftBound, rightBound);
    b.y = GROUND_Y - b.h - 62 + Math.sin(b.age * 0.035) * 18;

    if (b.shootT-- <= 0) {
      var ox2 = b.x + b.w / 2, oy2 = b.y + b.h - 4;
      var base2 = Math.atan2((p.y + p.h / 2) - oy2, pcx - ox2);
      for (var j = 0; j < (b.phase === 2 ? 3 : 2); j++) {
        spawnBullet({
          x: ox2, y: oy2, vx: Math.cos(base2 + j * 0.18 - 0.09) * 3.1,
          vy: Math.sin(base2 + j * 0.18 - 0.09) * 3.1,
          dmg: 1, friendly: false, color: '#7fe3ff', glow: '#e6fbff',
          w: 5, h: 5, life: 220, angle: base2
        });
      }
      Snd.sfx('enemyShot');
      b.shootT = b.phase === 2 ? 58 : 84;
    }
    if (b.specialT-- <= 0) {
      for (var k = 0; k < 7; k++) {
        var aa = Math.PI / 2 + (k - 3) * 0.22;
        spawnBullet({
          x: b.x + b.w / 2, y: b.y + b.h, vx: Math.cos(aa) * 2.2, vy: Math.sin(aa) * 2.2,
          dmg: 1, friendly: false, color: '#bff4ff', glow: '#ffffff',
          w: 4, h: 6, life: 240, angle: aa
        });
      }
      if (b.phase === 2) {
        spawnEnemy({ t: 'drone', x: b.x, y: b.y + 20 });
        spawnEnemy({ t: 'drone', x: b.x + b.w, y: b.y + 20 });
      }
      Snd.sfx('spread');
      b.specialT = b.phase === 2 ? 180 : 260;
    }

    /* summon darts on their own clock */
    if (b.summonT === undefined) b.summonT = 260;
    if (b.summonT-- <= 0) {
      spawnEnemy({ t: 'swarm', x: b.x + 10, y: b.y + 10 });
      spawnEnemy({ t: 'swarm', x: b.x + b.w - 10, y: b.y + 10 });
      Snd.sfx('bossWarn');
      b.summonT = b.phase === 2 ? 170 : 280;
    }
  }

  if (b.kind === 'heart') {
    b.x = arenaStart + ARENA_W / 2 - b.w / 2;
    b.y = GROUND_Y - b.h - 56 + Math.sin(b.age * 0.03) * 8;

    if (b.shootT-- <= 0) {
      var arms = b.phase === 2 ? 6 : 4;
      b.angle += 0.42;
      for (var m = 0; m < arms; m++) {
        var ang = b.angle + m * (Math.PI * 2 / arms);
        spawnBullet({
          x: b.x + b.w / 2, y: b.y + b.h / 2,
          vx: Math.cos(ang) * 2.5, vy: Math.sin(ang) * 2.5,
          dmg: 1, friendly: false, color: '#ff2d95', glow: '#ffd0e4',
          w: 5, h: 5, life: 260, angle: ang
        });
      }
      Snd.sfx('enemyShot');
      b.shootT = b.phase === 2 ? 40 : 56;
    }
    if (b.specialT-- <= 0) {
      /* aimed volley at the player */
      var ox3 = b.x + b.w / 2, oy3 = b.y + b.h / 2;
      var base3 = Math.atan2((p.y + p.h / 2) - oy3, pcx - ox3);
      for (var q = -2; q <= 2; q++) {
        spawnBullet({
          x: ox3, y: oy3, vx: Math.cos(base3 + q * 0.12) * 3.6,
          vy: Math.sin(base3 + q * 0.12) * 3.6,
          dmg: 1, friendly: false, color: '#ffb545', glow: '#fff3c4',
          w: 5, h: 5, life: 240, angle: base3
        });
      }
      if (b.phase === 2) spawnEnemy({ t: 'runner', x: arenaStart + 40, y: GROUND_Y - 15 });
      Snd.sfx('spread');
      b.specialT = b.phase === 2 ? 140 : 210;
    }

    /* rotating beams on their own clock */
    if (b.beamT === undefined) b.beamT = 300;
    if (b.beamT-- <= 0) {
      spawnBeam(b, b.phase === 2 ? 2 : 1);
      Snd.sfx('bossWarn');
      b.beamT = b.phase === 2 ? 300 : 380;
    }
  }

  /* ---------------------------------------------------------------- relay */
  if (b.kind === 'relay') {
    var rArena = Game.stage.arenaStart;
    b.x = rArena + ARENA_W / 2 - b.w / 2;
    b.y = GROUND_Y - b.h;
    var rp = nearestPlayer(b.x + b.w / 2, b.y) || Game.player;
    var rex = b.x + b.w / 2, rey = b.y + 17;
    b.angle = Math.atan2((rp.y + rp.h / 2) - rey, (rp.x + rp.w / 2) - rex);

    if (b.shootT-- <= 0) {
      var rn = b.phase === 2 ? 5 : 3;
      for (var ri = 0; ri < rn; ri++) {
        var ra = b.angle + (ri - (rn - 1) / 2) * 0.16;
        spawnBullet({
          x: rex, y: rey, vx: Math.cos(ra) * 3.2, vy: Math.sin(ra) * 3.2,
          dmg: 1, friendly: false, color: scheme().hostile, glow: scheme().hostileGlow,
          w: 5, h: 5, life: 200, angle: ra
        });
      }
      Snd.sfx('enemyShot');
      b.shootT = b.phase === 2 ? 58 : 86;
    }

    /* the mast sweeps a beam across the floor */
    if (b.specialT-- <= 0) {
      spawnBeamAt(rex, rey, Math.PI / 2 - 0.85, 0.017, 62, 140, 320, 4);
      if (b.phase === 2) spawnBeamAt(rex, rey, Math.PI / 2 + 0.85, -0.017, 62, 140, 320, 4);
      Snd.sfx('bossWarn');
      b.specialT = b.phase === 2 ? 250 : 330;
    }

    /* it is a relay: it calls for backup */
    if (b.summonT === undefined) b.summonT = 320;
    if (b.summonT-- <= 0) {
      spawnEnemy({ t: 'shielder', x: rArena + 40, y: GROUND_Y - 18 });
      spawnEnemy({ t: 'shielder', x: rArena + ARENA_W - 66, y: GROUND_Y - 18 });
      Snd.sfx('bossWarn');
      b.summonT = b.phase === 2 ? 250 : 350;
    }
  }

  /* ---------------------------------------------------------------- orbit */
  if (b.kind === 'orbit') {
    var oArena = Game.stage.arenaStart;
    var ocx = oArena + ARENA_W / 2, ocy = GROUND_Y - 96;
    var orad = b.phase === 2 ? 118 : 152;
    b.x = ocx + Math.cos(b.age * 0.014) * orad - b.w / 2;
    b.y = ocy + Math.sin(b.age * 0.014) * orad * 0.42 - b.h / 2;

    if (b.shootT-- <= 0) {
      var oarms = b.phase === 2 ? 8 : 6;
      b.angle += 0.4;
      for (var oi = 0; oi < oarms; oi++) {
        var oa = b.angle + oi * (Math.PI * 2 / oarms);
        spawnBullet({
          x: b.x + b.w / 2, y: b.y + b.h / 2,
          vx: Math.cos(oa) * 2.6, vy: Math.sin(oa) * 2.6,
          dmg: 1, friendly: false, color: '#8a7bff', glow: '#e6e9ff',
          w: 5, h: 5, life: 260, angle: oa
        });
      }
      Snd.sfx('enemyShot');
      b.shootT = b.phase === 2 ? 56 : 78;
    }

    /* drops mines where you are standing */
    if (b.specialT-- <= 0) {
      var op = nearestPlayer(b.x + b.w / 2, b.y) || Game.player;
      spawnDebris(op.x + op.w / 2, b.phase === 2 ? 4 : 2, 0);
      Snd.sfx('bossWarn');
      b.specialT = b.phase === 2 ? 240 : 320;
    }
  }

  /* ---------------------------------------------------------------- clock */
  if (b.kind === 'clock') {
    var cArena = Game.stage.arenaStart;
    b.x = cArena + ARENA_W / 2 - b.w / 2;
    b.y = GROUND_Y - b.h - 44;
    b.angle += b.phase === 2 ? 0.030 : 0.020;
    b.angle2 -= b.phase === 2 ? 0.044 : 0.028;

    var ccx = b.x + b.w / 2, ccy = b.y + b.h / 2;
    var cr = b.w / 2;

    if (b.shootT-- <= 0) {
      var hands = [b.angle, b.angle2];
      for (var hi2 = 0; hi2 < hands.length; hi2++) {
        var ha = hands[hi2];
        var hl = (hi2 === 0 ? cr - 10 : cr - 20);
        spawnBullet({
          x: ccx + Math.cos(ha) * hl, y: ccy + Math.sin(ha) * hl,
          vx: Math.cos(ha) * 3.4, vy: Math.sin(ha) * 3.4,
          dmg: 1, friendly: false, color: '#ffd257', glow: '#fff3c4',
          w: 5, h: 5, life: 240, angle: ha
        });
      }
      Snd.sfx('enemyShot');
      b.shootT = b.phase === 2 ? 32 : 46;
    }

    if (b.specialT-- <= 0) {
      var cp2b = nearestPlayer(ccx, ccy) || Game.player;
      spawnDebris(cp2b.x + cp2b.w / 2, 3, 0);
      Snd.sfx('bossWarn');
      b.specialT = 280;
    }
  }

  /* contact damage */
  for (var bi = 0; bi < Game.players.length; bi++) {
    var bp = Game.players[bi];
    if (bp && !bp.dead && !bp.downed &&
        aabb(b, { x: bp.x + 1, y: bp.y + 1, w: bp.w - 2, h: bp.h - 2 })) {
      playerHurt(bp, 1);
    }
  }
}

function drawBoss(g, b) {
  if (b.kind === 'warden') drawWarden(g, b);
  else if (b.kind === 'wraith') drawWraith(g, b);
  else if (b.kind === 'relay') drawRelay(g, b);
  else if (b.kind === 'orbit') drawOrbit(g, b);
  else if (b.kind === 'clock') drawClock(g, b);
  else drawHeart(g, b);
}

/* ===== 70_game.js ===== */
/* ===========================================================================
   EON COMMANDO — 70 game
   State machine, stage flow, camera, spawning, scoring, save.
   =========================================================================== */

var Game = {
  state: 'title',
  stageIndex: 0,
  stage: null,
  bg: null,
  player: null,
  players: [],
  coop: false,
  enemies: [],
  bullets: [],
  particles: [],
  pickups: [],
  grenades: [],
  ghosts: [],
  hazards: [],
  hitStop: 0,
  settingsIndex: 0,
  remapPlayer: 'p1',
  remapIndex: 0,
  REMAP_ACTIONS: ['left', 'right', 'up', 'down', 'jump', 'fire', 'dash', 'melee', 'grenade'],
  pauseIndex: 0,
  hitRows: [],
  titleIndex: 0,
  mode: 'campaign',
  wave: 0, waveTimer: 0, waveActive: false, scoreMul: 1,
  power: 0, combo: 0, comboT: 0, fury: 0,
  perks: [], perkChoices: [], perkIndex: 0,
  dmgMul: 1, cdMul: 1, powerMul: 1, dashMul: 1, takenMul: 1,
  story: null, storyAfter: null, storyIndex: 0, storyChars: 0, storyT: 0,
  creditsY: 0, creditsT: 0,
  lastEntry: null,
  floaters: [],
  pending: [],
  boss: null,
  gate: null,
  camX: 0,
  score: 0,
  lives: 3,
  hiScore: 0,
  shake: 0,
  flash: 0,
  time: 0,
  frames: 0,
  stateTimer: 0,
  banner: null,
  arenaLocked: false,
  bossTriggered: false,
  stageTime: 0,
  lastRun: null,
  errors: [],

  init: function () {
    this.hiScore = Store.get('hiScore', 0) || 0;
    this.state = 'title';
    this.stateTimer = 0;
    this.stage = STAGES[0];
    this.bg = makeBackground(STAGES[0]);
    this.camX = 0;
    this.time = 0;
  },

  startGame: function (coop, forcedSeed) {
    this.coop = !!coop;
    this.dailyRun = false;
    this.perks = [];
    this.recalcPerks();
    if (this.mode !== 'endless') this.mode = 'campaign';
    var d = diff();
    this.score = 0;
    this.lives = d.lives;
    this.stageIndex = 0;
    /* a fixed ?seed= or a replay makes a run reproducible; otherwise pick one */
    if (forcedSeed !== undefined && forcedSeed !== null) this.seed = forcedSeed >>> 0;
    else if (PARAMS.seed) this.seed = parseInt(PARAMS.seed, 10) >>> 0;
    else this.seed = ((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0);
    RNG.seed(this.seed);
    if (!this.replayMode) Rec.start(this.seed, this.coop);
    Stats.bump('runs');
    this.stateTimer = 0;
    Snd.resume();
    Snd.sfx('start');
    this.loadStage(0);
    this.state = 'playing';
    if (this.stage.storyIn && this.stage.storyIn.length) this.startStory(this.stage.storyIn, 'play');
  },

  loadStage: function (i) {
    this.stageIndex = i;
    this.stage = STAGES[i];
    this.bg = makeBackground(this.stage);
    setWeather(this.stage.id);
    this.enemies = [];
    this.bullets = [];
    this.particles = [];
    this.pickups = [];
    this.floaters = [];
    this.boss = null;
    this.gate = null;
    this.camX = 0;
    this.arenaLocked = false;
    this.bossTriggered = false;
    this.stageTime = 0;
    this.shake = 0;
    this.flash = 0;

    this.spawnPlayers();
    this.grenades = [];
    this.ghosts = [];
    this.hazards = [];
    this.hitStop = 0;

    this.pending = this.stage.enemies.slice().sort(function (a, b) { return a.x - b.x; });
    for (var k = 0; k < this.stage.pickups.length; k++) {
      var pk = this.stage.pickups[k];
      spawnPickup({
        kind: pk.kind, w: pk.w, x: pk.x, y: pk.y,
        label: pk.w ? WEAPONS[pk.w].name.charAt(0) : 'W'
      });
    }
    this.banner = { text: 'ERA ' + (i + 1), sub: this.stage.name, life: 130, color: this.stage.accent };
    Snd.playMusic(TRACKS[this.stage.music]);
  },

  spawnPlayers: function () {
    var d = diff();

    /* Perks are applied here, not in makePlayer: this function overwrites
       maxHp and grenades from the difficulty table, so anything set earlier
       would be clobbered. */
    function withPerks(p) {
      p.invuln = 60;
      p.maxHp = d.hp;
      p.hp = d.hp;
      p.grenades = 3;
      p.maxGrenades = 3;
      if (Game.perkHas('vitality')) { p.maxHp += 1; p.hp = p.maxHp; }
      if (Game.perkHas('scavenger')) {
        p.maxGrenades += 1;
        p.grenades = Math.min(p.maxGrenades, p.grenades + 2);
      }
      return p;
    }

    var p1 = withPerks(makePlayer(48, GROUND_Y - 22));
    this.players = [p1];
    if (this.coop) {
      var p2 = withPerks(makePlayer(72, GROUND_Y - 22));
      p2.ctl = Input.ctl2;
      p2.facing = 1;
      this.players.push(p2);
    }
    this.player = p1;
  },

  checkpointX: function () {
    if (this.arenaLocked) return this.stage.arenaStart + 40;
    var cps = this.stage.checkpoints || [48];
    var best = cps[0];
    var px = this.player ? this.player.x : 0;
    for (var i = 0; i < cps.length; i++) if (px >= cps[i]) best = cps[i];
    return best;
  },

  respawn: function () {
    var x = this.checkpointX();
    this.spawnPlayers();
    var i;
    for (i = 0; i < this.players.length; i++) {
      var q = this.players[i];
      q.x = x + i * 24;
      q.y = GROUND_Y - 22;
      q.invuln = 110;
      q.weapon = 'rifle';
      q.grenades = 2;
    }
    this.grenades = [];
    if (this.arenaLocked) {
      this.bullets = this.bullets.filter(function (b) { return b.friendly; });
    }
    Snd.playMusic(TRACKS[this.stage.music]);
  },

  triggerBoss: function () {
    this.bossTriggered = true;
    this.arenaLocked = true;
    this.gate = { x: this.stage.arenaStart - 4, y: 0, w: 4, h: GROUND_Y + 60 };
    this.boss = makeBoss(this.stage.boss);
    this.hazards = [];
    this.banner = { text: 'WARNING', sub: this.boss.name, life: 150, color: '#ff4d6d' };
    this.flash = 0.4;
    Snd.sfx('bossWarn');
    Snd.playMusic(TRACKS.boss);
  },

  onBossDead: function () {
    if (this.mode === 'endless') {
      this.waveActive = false;
      this.waveTimer = 140;
      this.banner = { text: 'WAVE CLEAR', sub: 'KEEP GOING', life: 90, color: '#54ffa8' };
      return;
    }
    var bonus = 1500 + this.player.hp * 250 + this.lives * 500;
    this.lastRun = {
      stage: this.stage.name,
      bonus: bonus,
      hp: this.player.hp,
      lives: this.lives
    };
    this.score += bonus;
    Snd.sfx('stageClear');
    Snd.stopMusic();

    var lastStage = this.stageIndex >= STAGES.length - 1;
    if (this.stage.storyOut && this.stage.storyOut.length) {
      this.startStory(this.stage.storyOut, lastStage ? 'victory' : 'perk');
    } else {
      this.state = 'stageclear';
      this.stateTimer = 0;
    }
  },

  gameOver: function () {
    this.state = 'gameover';
    this.stateTimer = 0;
    Snd.sfx('gameOver');
    Snd.stopMusic();
    this.saveHi();
    this.recordRun('GAME OVER');
  },

  /* play back a recorded run: the sim is deterministic, so only inputs replay */
  /* ---- endless: waves in one arena, no traversal ---- */
  startEndless: function (coop) {
    this.mode = 'endless';
    this.startGame(coop, undefined);
    this.mode = 'endless';
    this.wave = 0;
    this.waveActive = false;
    this.waveTimer = 150;
    this.scoreMul = 1;
    this.pending = [];
    this.enemies = [];
    this.boss = null;

    /* lock the camera to the arena and shut the gate */
    var arena = this.stage.arenaStart;
    this.arenaLocked = true;
    this.bossTriggered = true;
    this.gate = { x: arena - 4, y: 0, w: 4, h: GROUND_Y + 60 };
    this.camX = clamp(arena + ARENA_W / 2 - W / 2, 0, Math.max(0, this.stage.length - W));
    for (var ei = 0; ei < this.players.length; ei++) {
      this.players[ei].x = arena + ARENA_W / 2 - 40 + ei * 26;
      this.players[ei].y = GROUND_Y - 22;
      this.players[ei].invuln = 90;
    }
    this.banner = { text: 'ENDLESS', sub: 'SURVIVE THE WAVES', life: 120, color: '#ff2d95' };
    Snd.playMusic(TRACKS.boss);
  },

  endlessSpawnWave: function () {
    this.wave++;
    this.waveActive = true;
    this.scoreMul = 1 + (this.wave - 1) * 0.15;

    var arena = this.stage.arenaStart;
    var left = arena + 30, right = arena + ARENA_W - 50;
    var count = Math.min(10, 2 + Math.floor(this.wave * 0.8));
    var pool = ['grunt', 'runner'];
    if (this.wave >= 2) pool.push('drone');
    if (this.wave >= 3) pool.push('jumper', 'sniper');
    if (this.wave >= 4) pool.push('swarm', 'shielder');
    if (this.wave >= 6) pool.push('turret', 'brute');

    var i;
    for (i = 0; i < count; i++) {
      var t = RNG.sPick(pool);
      var def = ENEMIES[t];
      var x = (i % 2 === 0) ? left + RNG.sr(0, 40) : right - RNG.sr(0, 40);
      var y = def.gravity ? GROUND_Y - def.h : GROUND_Y - 90 - RNG.sr(0, 40);
      spawnEnemy({ t: t, x: x, y: y });
    }

    /* a boss every fifth wave, on top of the crowd */
    if (this.wave % 5 === 0) {
      var kinds = ['warden', 'wraith', 'heart'];
      this.boss = makeBoss(kinds[Math.floor(this.wave / 5 - 1) % 3]);
      this.boss.introT = 60;
      this.banner = { text: 'WAVE ' + this.wave, sub: this.boss.name, life: 110, color: '#ff4d6d' };
      Snd.sfx('bossWarn');
    } else {
      this.banner = { text: 'WAVE ' + this.wave, sub: count + ' HOSTILES', life: 90, color: this.stage.accent };
      Snd.sfx('bossWarn');
    }
  },

  updateEndless: function () {
    if (!this.waveActive) {
      this.waveTimer--;
      if (this.waveTimer <= 0) this.endlessSpawnWave();
      return;
    }
    if (this.enemies.length === 0 && !this.boss) {
      this.waveActive = false;
      this.waveTimer = 130;
      var bonus = Math.round(250 * this.wave * this.scoreMul);
      this.score += bonus;
      floatText(this.player.x + 6, this.player.y - 12, '+' + bonus, '#ffd257');
      if (this.player) this.player.grenades = Math.min(this.player.maxGrenades, this.player.grenades + 1);
    }
  },

  startReplay: function (rec) {
    if (!rec) return false;
    this.replayMode = true;
    this.replayMasks = Rec.expand(rec);
    this.replayFrame = 0;
    Rec.recording = false;
    this.startGame(rec.coop, rec.seed);
    this.replayMode = true;
    this.state = 'playing';
    Snd.sfx('start');
    return true;
  },

  stopReplay: function () {
    this.replayMode = false;
    this.replayMasks = null;
    this.state = 'title';
    this.stateTimer = 0;
    Snd.stopMusic();
  },

  recordRun: function (result) {
    this.lastEntry = {
      score: this.score,
      stage: this.stage ? this.stage.name : '—',
      result: result,
      date: new Date().toISOString().slice(0, 10)
    };
    Scores.add(this.lastEntry);
    if (!this.replayMode) {
      var rec = Rec.stop();
      if (rec && rec.total > 30) Rec.save(rec);
    }
    Stats.bump('best', 0);
    var st = Stats.get();
    if (this.score > (st.best || 0)) Stats.bump('best', this.score - (st.best || 0));
    Stats.bump('time', Math.round(this.frames / 60));
  },

  victoryToCredits: function () {
    this.startCredits();
  },

  victory: function () {
    this.state = 'victory';
    this.stateTimer = 0;
    Snd.sfx('stageClear');
    Snd.stopMusic();
    this.saveHi();
    this.recordRun('EON SECURED');
  },

  saveHi: function () {
    if (this.score > this.hiScore) {
      this.hiScore = this.score;
      Store.set('hiScore', this.hiScore);
    }
  },

  /* ---- per-frame ------------------------------------------------------- */
  update: function () {
    this.time++;
    this.frames++;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - 0.55);
    if (this.flash > 0) this.flash = Math.max(0, this.flash - 0.045);

    if (this.banner) {
      this.banner.life--;
      if (this.banner.life <= 0) this.banner = null;
    }

    if (Input.pressed('mute')) {
      Snd.setMuted(!Snd.muted);
      Store.set('muted', Snd.muted);
    }

    /* a finished replay goes back to the title on any start press */
    if (this.replayMode && (this.state === 'gameover' || this.state === 'victory')) {
      this.stateTimer++;
      if (this.stateTimer > 40 && (Input.pressed('start') || Input.pressed('restart') ||
                                   Input.pressed('pause') || Input.pressed('fire'))) {
        this.stopReplay();
      }
      return;
    }

    switch (this.state) {
      case 'title':
        this.updateTitle();
        break;
      case 'playing':
        this.updatePlaying();
        break;
      case 'paused':
        this.updatePause();
        break;
      case 'settings':
        this.updateSettings();
        break;
      case 'remap':
        this.updateRemap();
        break;
      case 'perk':
        this.updatePerk();
        break;
      case 'lan':
        this.updateLanScreen();
        break;
      case 'pads':
        if (Input.pressed('pause') || Input.pressed('start')) closePadEditor();
        break;
      case 'story':
        this.updateStory();
        break;
      case 'credits':
        this.updateCredits();
        break;
      case 'stageclear':
        this.updateStageClear();
        break;
      case 'gameover':
      case 'victory':
        this.stateTimer++;
        this.updateParticles();
        if (this.stateTimer > 60 && (Input.pressed('start') || Input.pressed('restart') ||
                                     Input.pressed('fire') || Input.pressed('jump'))) {
          this.startCredits();
        }
        break;
    }
  },

  titleRows: function () {
    var rows = [
      { id: 'campaign', label: 'CAMPAIGN' },
      { id: 'endless', label: 'ENDLESS' },
      { id: 'daily', label: 'DAILY RUN' }
    ];
    if (Rec.has()) rows.push({ id: 'replay', label: 'WATCH LAST RUN' });
    rows.push({ id: 'coop', label: 'TWO PLAYERS: ' + (this.coop ? 'ON' : 'OFF') });
    if (LAN.available()) rows.push({ id: 'lan', label: 'LAN CO-OP' });
    return rows;
  },

  activateTitleRow: function (i) {
    var rows = this.titleRows();
    if (!rows[i]) return;
    var id = rows[i].id;
    Snd.sfx('select');
    if (id === 'campaign') this.startGame(this.coop);
    else if (id === 'endless') this.startEndless(this.coop);
    else if (id === 'daily') { this.startGame(this.coop, Daily.seed()); this.dailyRun = true; }
    else if (id === 'replay') this.startReplay(Rec.load());
    else if (id === 'coop') { this.coop = !this.coop; this.titleIndex = i; }
    else if (id === 'lan') { this.state = 'lan'; this.stateTimer = 0; }
  },

  updateTitle: function () {
    if (!Snd.track) Snd.playMusic(TRACKS.title);
    this.stateTimer++;
    var n = this.titleRows().length;
    if (Input.pressed('up')) { this.titleIndex = (this.titleIndex + n - 1) % n; Snd.sfx('select'); }
    if (Input.pressed('down')) { this.titleIndex = (this.titleIndex + 1) % n; Snd.sfx('select'); }
    if (Input.pressed('start')) { this.activateTitleRow(this.titleIndex); return; }
    /* shortcuts that still work for muscle memory */
    if (Input.pressed('start2')) { this.startGame(true); return; }
    if (Input.pressed('daily')) { this.startGame(this.coop, Daily.seed()); this.dailyRun = true; return; }
    if (Input.pressed('replay') && Rec.has()) { this.startReplay(Rec.load()); return; }
  },

  /* ---- the power gauge ------------------------------------------------ */
  canUnleash: function () { return this.power >= 100 && this.fury <= 0 && !this.replayMode; },

  unleash: function () {
    if (!this.canUnleash()) return false;
    this.power = 0;
    this.combo = 0;
    this.comboT = 0;
    this.fury = 110;
    this.flash = 1;
    this.shake = Math.max(this.shake, 9);
    Snd.sfx('bossWarn');

    var i;
    /* wipe enemy fire and stagger everything on screen */
    for (i = 0; i < this.bullets.length; i++) {
      if (!this.bullets[i].friendly) { burst(this.bullets[i].x, this.bullets[i].y, 4, scheme().hostileGlow); this.bullets[i].dead = true; }
    }
    for (i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (!e.dead) { damageEnemy(e, 25, (e.x < (this.player.x)) ? 1 : -1); }
    }
    if (this.boss && !this.boss.dead) damageBoss(this.boss, 40);
    for (i = 0; i < this.players.length; i++) this.players[i].invuln = Math.max(this.players[i].invuln, 110);
    floatText(this.player.x + 6, this.player.y - 16, 'UNLEASHED', '#ffd257');
    return true;
  },

  /* ---- story beats ---------------------------------------------------- */
  startStory: function (lines, after) {
    if (!lines || !lines.length) { this.story = null; this.state = after === 'credits' ? 'credits' : (after || 'playing'); return; }
    this.story = lines.slice();
    this.storyAfter = after || 'playing';
    this.storyIndex = 0;
    this.storyChars = 0;
    this.storyT = 0;
    this.state = 'story';
  },

  storyAdvance: function () {
    var line = this.story && this.story[this.storyIndex];
    if (!line) { this.finishStory(); return; }
    if (this.storyChars < line.text.length) { this.storyChars = line.text.length; return; }
    this.storyIndex++;
    this.storyChars = 0;
    if (this.storyIndex >= this.story.length) this.finishStory();
  },

  finishStory: function () {
    var after = this.storyAfter;
    this.story = null;
    if (after === 'credits') { this.startCredits(); return; }
    if (after === 'victory') { this.state = 'victory'; this.stateTimer = 0; return; }
    if (after === 'perk') { this.startPerk(); return; }
    if (after === 'stageclear') { this.state = 'stageclear'; this.stateTimer = 0; return; }
    this.state = 'playing';
  },

  updateStory: function () {
    this.storyT++;
    var line = this.story && this.story[this.storyIndex];
    if (line) this.storyChars = Math.min(line.text.length, this.storyChars + 1.1);
    if (Input.pressed('start') || Input.pressed('jump') || Input.pressed('fire') ||
        Input.pressed('pause') || Input.pressed('power')) {
      this.storyAdvance();
    }
  },

  startCredits: function () {
    this.state = 'credits';
    this.creditsY = 0;
    this.creditsT = 0;
    Snd.playMusic(TRACKS.title);
  },

  updateCredits: function () {
    this.creditsT++;
    this.creditsY += 0.42;
    if (this.creditsT > 90 && (Input.pressed('start') || Input.pressed('jump') || Input.pressed('fire'))) {
      this.state = 'title'; this.stateTimer = 0; Snd.stopMusic();
    }
  },


  /* ---- perks ----------------------------------------------------------- */
  perkHas: function (id) { return this.perks.indexOf(id) >= 0; },

  recalcPerks: function () {
    var i, has = {};
    for (i = 0; i < this.perks.length; i++) has[this.perks[i]] = true;
    this.dmgMul = has.overcharge ? 1.25 : 1;
    this.cdMul = has.rapid ? 0.8 : 1;
    this.powerMul = has.momentum ? 1.35 : 1;
    this.dashMul = has.phantom ? 0.65 : 1;
    this.takenMul = has.aegis ? 0.8 : 1;
  },

  updateLanScreen: function () {
    if (Input.pressed('pause')) { LAN.stop(); this.state = 'title'; return; }
    if (!LAN.conn) {
      if (Input.pressed('jump') || Input.pressed('left')) LAN.connect('host');
      else if (Input.pressed('fire') || Input.pressed('right')) LAN.connect('client');
    }
    if (LAN.active) this.state = 'playing';
  },

  startPerk: function () {
    var pool = PERKS.filter(function (pk) { return !Game.perkHas(pk.id); });
    if (!pool.length) { this.advanceFromPerk(); return; }
    var picks = [];
    var bag = pool.slice();
    while (picks.length < 3 && bag.length) {
      picks.push(bag.splice(Math.floor(RNG.sr(0, bag.length - 1)), 1)[0]);
    }
    this.perkChoices = picks;
    this.perkIndex = 0;
    this.state = 'perk';
    this.stateTimer = 0;
    Snd.sfx('select');
  },

  takePerk: function (id) {
    if (this.perks.indexOf(id) >= 0) return;
    this.perks.push(id);
    this.recalcPerks();

    /* the ones with an immediate, visible effect */
    if (id === 'vitality') {
      for (var i = 0; i < this.players.length; i++) {
        this.players[i].maxHp += 1;
        this.players[i].hp = this.players[i].maxHp;
      }
    }
    if (id === 'scavenger') {
      for (var j = 0; j < this.players.length; j++) {
        this.players[j].maxGrenades += 1;
        this.players[j].grenades = Math.min(this.players[j].maxGrenades, this.players[j].grenades + 2);
      }
    }
    if (id === 'reserve') this.lives += 1;

    Snd.sfx('stageClear');
    floatText(this.player.x + 6, this.player.y - 14, PERKS.filter(function (k) { return k.id === id; })[0].name, '#ffd257');
    this.advanceFromPerk();
  },

  advanceFromPerk: function () {
    if (this.stageIndex + 1 < STAGES.length) {
      this.stageIndex++;
      this.loadStage(this.stageIndex);
      this.state = 'playing';
      if (this.stage.storyIn && this.stage.storyIn.length) this.startStory(this.stage.storyIn, 'play');
    } else {
      this.victory();
    }
  },

  updatePerk: function () {
    var n = this.perkChoices.length;
    if (!n) { this.advanceFromPerk(); return; }
    if (Input.pressed('left')) { this.perkIndex = (this.perkIndex + n - 1) % n; Snd.sfx('select'); }
    if (Input.pressed('right')) { this.perkIndex = (this.perkIndex + 1) % n; Snd.sfx('select'); }
    if (Input.pressed('start') || Input.pressed('jump') || Input.pressed('fire')) {
      this.takePerk(this.perkChoices[this.perkIndex].id);
    }
  },

  pauseRows: function () {
    return [
      { id: 'resume', label: 'RESUME' },
      { id: 'settings', label: 'SETTINGS' },
      { id: 'controls', label: 'CONTROLS' },
      { id: 'restart', label: 'RESTART RUN' },
      { id: 'quit', label: 'QUIT TO TITLE' }
    ];
  },

  activatePauseRow: function (i) {
    var rows = this.pauseRows();
    if (!rows[i]) return;
    var id = rows[i].id;
    Snd.sfx('select');
    if (id === 'resume') this.state = 'playing';
    else if (id === 'settings') { this.state = 'settings'; this.settingsIndex = 0; }
    else if (id === 'controls') { this.state = 'remap'; this.remapIndex = 0; }
    else if (id === 'restart') { this.startGame(this.coop); }
    else if (id === 'quit') { this.state = 'title'; this.stateTimer = 0; Snd.stopMusic(); }
  },

  updatePause: function () {
    var n = this.pauseRows().length;
    if (Input.pressed('up')) { this.pauseIndex = (this.pauseIndex + n - 1) % n; Snd.sfx('select'); }
    if (Input.pressed('down')) { this.pauseIndex = (this.pauseIndex + 1) % n; Snd.sfx('select'); }
    if (Input.pressed('start')) { this.activatePauseRow(this.pauseIndex); return; }
    if (Input.pressed('settings')) { this.state = 'settings'; this.settingsIndex = 0; Snd.sfx('select'); return; }
    if (Input.pressed('pause')) { this.state = 'playing'; Snd.sfx('select'); }
  },

  /* a tap in logical canvas coordinates, dispatched by the current screen */
  tap: function (mx, my) {
    var i, r;
    if (this.state === 'title') {
      for (i = 0; i < this.hitRows.length; i++) {
        r = this.hitRows[i];
        if (my >= r.y0 && my <= r.y1) { this.titleIndex = r.i; this.activateTitleRow(r.i); return; }
      }
      return;
    }
    if (this.state === 'paused') {
      for (i = 0; i < this.hitRows.length; i++) {
        r = this.hitRows[i];
        if (my >= r.y0 && my <= r.y1) { this.pauseIndex = r.i; this.activatePauseRow(r.i); return; }
      }
      return;
    }
    if (this.state === 'settings') {
      for (i = 0; i < this.hitRows.length; i++) {
        r = this.hitRows[i];
        if (my >= r.y0 && my <= r.y1) {
          this.settingsIndex = r.i;
          if (r.i === 8) { this.state = 'remap'; this.remapIndex = 0; Snd.sfx('select'); return; }
          if (r.i === 9) { openPadEditor(); return; }
          /* tap the right half to increase, the left half to decrease */
          var dir = (mx > W / 2) ? 1 : -1;
          this.nudgeSetting(r.i, dir);
          return;
        }
      }
      return;
    }
    if (this.state === 'remap') {
      for (i = 0; i < this.hitRows.length; i++) {
        r = this.hitRows[i];
        if (my >= r.y0 && my <= r.y1) { this.remapIndex = r.i; Snd.sfx('select'); return; }
      }
      if (my < this.hitRows.length ? false : false) return;
      /* tapping the header switches player */
      if (my > 36 && my < 52) {
        this.remapPlayer = this.remapPlayer === 'p1' ? 'p2' : 'p1';
        Snd.sfx('select');
      }
      return;
    }
    if (this.state === 'lan') {
      for (i = 0; i < this.hitRows.length; i++) {
        r = this.hitRows[i];
        if (my >= r.y0 && my <= r.y1 && mx >= r.x0 && mx <= r.x1) {
          LAN.connect(r.i === 0 ? 'host' : 'client');
          return;
        }
      }
      return;
    }
    if (this.state === 'perk') {
      for (i = 0; i < this.hitRows.length; i++) {
        r = this.hitRows[i];
        if (my >= r.y0 && my <= r.y1 && mx >= r.x0 && mx <= r.x1) { this.takePerk(this.perkChoices[r.i].id); return; }
      }
      return;
    }
    if (this.state === 'story') { this.storyAdvance(); return; }
    if (this.state === 'credits') {
      if (this.creditsT > 90) { this.state = 'title'; this.stateTimer = 0; Snd.stopMusic(); }
      return;
    }
    if (this.state === 'gameover' || this.state === 'victory') {
      this.stateTimer = 999;
      this.startGame(this.coop);
      return;
    }
    if (this.state === 'stageclear') return;
  },

  /* shared by keyboard and tap so the two cannot drift apart */
  nudgeSetting: function (i, dir) {
    if (i === 0) SET.difficulty = clamp(SET.difficulty + dir, 0, 2);
    else if (i === 1) SET.palette = clamp(SET.palette + dir, 0, 2);
    else if (i === 2) SET.reduceMotion = SET.reduceMotion ? 0 : 1;
    else if (i === 3) SET.flash = clamp(Math.round((SET.flash + dir * 0.25) * 100) / 100, 0, 1);
    else if (i === 4) SET.hudScale = clamp(Math.round((SET.hudScale + dir * 0.15) * 100) / 100, 0.85, 1.3);
    else if (i === 5) SET.music = clamp(Math.round((SET.music + dir * 0.2) * 100) / 100, 0, 1);
    else if (i === 6) SET.sfx = clamp(Math.round((SET.sfx + dir * 0.2) * 100) / 100, 0, 1);
    else if (i === 7) { SET.autoFire = SET.autoFire ? 0 : 1; if (typeof applyAutoLayout === 'function') applyAutoLayout(); }
    saveSettings();
    Snd.applyVolumes();
    Snd.sfx('coin');
  },

  updateRemap: function () {
    var n = this.REMAP_ACTIONS.length;
    if (Input.listening) return;   /* a key press is being captured */

    if (Input.pressed('up')) { this.remapIndex = (this.remapIndex + n - 1) % n; Snd.sfx('select'); }
    if (Input.pressed('down')) { this.remapIndex = (this.remapIndex + 1) % n; Snd.sfx('select'); }
    if (Input.pressed('left') || Input.pressed('right')) {
      this.remapPlayer = this.remapPlayer === 'p1' ? 'p2' : 'p1';
      Snd.sfx('select');
    }
    if (Input.pressed('start')) {
      Input.listening = { player: this.remapPlayer, action: this.REMAP_ACTIONS[this.remapIndex] };
      Snd.sfx('select');
    }
    if (Input.pressed('restart')) {
      Input.resetBindings(this.remapPlayer);
      Snd.sfx('coin');
    }
    if (Input.pressed('pause')) {
      this.state = 'settings';
      Snd.sfx('select');
    }
  },

  updateSettings: function () {
    var rows = 10;
    if (Input.pressed('up')) { this.settingsIndex = (this.settingsIndex + rows - 1) % rows; Snd.sfx('select'); }
    if (Input.pressed('down')) { this.settingsIndex = (this.settingsIndex + 1) % rows; Snd.sfx('select'); }
    var dir = (Input.pressed('right') ? 1 : 0) - (Input.pressed('left') ? 1 : 0);
    if (dir) {
      var i = this.settingsIndex;
      if (i === 0) SET.difficulty = clamp(SET.difficulty + dir, 0, 2);
      else if (i === 1) SET.palette = clamp(SET.palette + dir, 0, 2);
      else if (i === 2) SET.reduceMotion = SET.reduceMotion ? 0 : 1;
      else if (i === 3) SET.flash = clamp(Math.round((SET.flash + dir * 0.25) * 100) / 100, 0, 1);
      else if (i === 4) SET.hudScale = clamp(Math.round((SET.hudScale + dir * 0.15) * 100) / 100, 0.85, 1.3);
      else if (i === 5) SET.music = clamp(Math.round((SET.music + dir * 0.2) * 100) / 100, 0, 1);
      else if (i === 6) SET.sfx = clamp(Math.round((SET.sfx + dir * 0.2) * 100) / 100, 0, 1);
      else if (i === 7) { SET.autoFire = SET.autoFire ? 0 : 1; if (typeof applyAutoLayout === 'function') applyAutoLayout(); }
      saveSettings();
      Snd.applyVolumes();
      Snd.sfx('coin');
    }
    if (this.settingsIndex === 8 && Input.pressed('start')) {
      this.state = 'remap';
      this.remapIndex = 0;
      Snd.sfx('select');
      return;
    }
    if (this.settingsIndex === 9 && Input.pressed('start')) {
      openPadEditor();
      return;
    }
    if (Input.pressed('pause') || Input.pressed('start') || Input.pressed('settings')) {
      this.state = 'paused';
      Snd.sfx('select');
    }
  },

  updatePlaying: function () {
    this.stageTime++;

    var p = this.player;

    updateWeather();

    /* the gauge and the combo decay */
    if (this.comboT > 0) { this.comboT--; if (this.comboT === 0) this.combo = 0; }
    if (this.fury > 0) this.fury--;
    if (Input.pressed('power')) this.unleash();

    /* Hit-stop freezes the world for a few frames so impacts land — but the
       commando keeps running, otherwise a press during the freeze is swallowed. */
    var frozen = this.hitStop > 0;
    if (frozen) this.hitStop--;

    if (Input.pressed('pause')) {
      this.state = 'paused';
      Snd.sfx('select');
      return;
    }

    var pi;
    for (pi = 0; pi < this.players.length; pi++) playerUpdate(this.players[pi]);

    /* co-op revive: stand near a downed partner to bring them back */
    for (pi = 0; pi < this.players.length; pi++) {
      var dp = this.players[pi];
      if (!dp.downed) continue;
      dp.downTimer--;
      var helper = null, hi;
      for (hi = 0; hi < this.players.length; hi++) {
        var other = this.players[hi];
        if (other === dp || other.dead || other.downed) continue;
        if (dist2(other.x, other.y, dp.x, dp.y) < 26 * 26) { helper = other; break; }
      }
      if (helper) {
        dp.reviveT++;
        if (dp.reviveT > 55) {
          dp.downed = false;
          dp.hp = 1;
          dp.invuln = 100;
          dp.reviveT = 0;
          floatText(dp.x, dp.y - 8, 'REVIVED', '#54ffa8');
          Snd.sfx('health');
        }
      } else {
        dp.reviveT = Math.max(0, dp.reviveT - 2);
      }
      if (dp.downTimer <= 0) {
        dp.downed = false;
        dp.dead = true;
        dp.deadTimer = 0;
        Snd.sfx('death');
      }
    }

    /* spawn enemies as the camera approaches */
    while (this.pending.length && this.pending[0].x < this.camX + W + 80) {
      spawnEnemy(this.pending.shift());
    }

    var i;
    if (!frozen) {
      for (i = 0; i < this.enemies.length; i++) if (!this.enemies[i].dead) enemyUpdate(this.enemies[i]);
      for (i = 0; i < this.bullets.length; i++) if (!this.bullets[i].dead) bulletUpdate(this.bullets[i]);
    }
    this.updateParticles();
    for (i = 0; i < this.pickups.length; i++) if (!this.pickups[i].dead) pickupUpdate(this.pickups[i]);
    if (!frozen) {
      for (i = 0; i < this.grenades.length; i++) if (!this.grenades[i].dead) grenadeUpdate(this.grenades[i]);
      for (i = 0; i < this.hazards.length; i++) if (!this.hazards[i].dead) hazardUpdate(this.hazards[i]);
    }
    for (i = this.ghosts.length - 1; i >= 0; i--) {
      this.ghosts[i].life--;
      if (this.ghosts[i].life <= 0) this.ghosts.splice(i, 1);
    }

    for (i = this.floaters.length - 1; i >= 0; i--) {
      var f = this.floaters[i];
      f.y -= 0.45;
      f.life--;
      if (f.life <= 0) this.floaters.splice(i, 1);
    }

    if (!frozen) {
      if (this.boss && !this.boss.dead) bossUpdate(this.boss);
      else if (this.boss && this.boss.dead) bossUpdate(this.boss);
    }

    if (this.mode === 'endless') {
      this.updateEndless();
    } else if (!this.bossTriggered && p.x + p.w / 2 > this.stage.arenaStart + 70) {
      /* boss trigger */
      this.triggerBoss();
    }

    /* camera — frames every live player */
    var target;
    if (this.arenaLocked) {
      /* centre the fixed-width arena, letting a wide screen see the walls */
      target = this.stage.arenaStart + ARENA_W / 2 - W / 2;
    } else {
      var sumX = 0, n = 0, ci;
      for (ci = 0; ci < this.players.length; ci++) {
        var cp2 = this.players[ci];
        if (cp2.dead) continue;
        sumX += cp2.x + cp2.w / 2;
        n++;
      }
      var midX = n ? sumX / n : (p.x + p.w / 2);
      target = midX - W * 0.42;
    }
    target = clamp(target, 0, this.stage.length - W);
    this.camX = lerp(this.camX, target, 0.14);
    if (Math.abs(this.camX - target) < 0.4) this.camX = target;

    /* keep co-op partners from walking off the shared screen */
    if (this.players.length > 1) {
      for (var li = 0; li < this.players.length; li++) {
        var lp = this.players[li];
        if (lp.dead || lp.downed) continue;
        /* soft leash: push back toward the view, never teleport */
        var lo = this.camX + 6, hiX = this.camX + W - lp.w - 6;
        if (lp.x < lo) { lp.x = Math.min(lo, lp.x + 3); if (lp.vx < 0) lp.vx = 0; }
        else if (lp.x > hiX) { lp.x = Math.max(hiX, lp.x - 3); if (lp.vx > 0) lp.vx = 0; }
      }
    }

    /* death handling — a life is lost only when nobody is left standing */
    var live = 0, downed = 0, settled = true, di;
    for (di = 0; di < this.players.length; di++) {
      var qp = this.players[di];
      if (!qp.dead && !qp.downed) live++;
      if (qp.downed) downed++;
      if (!(qp.dead && qp.deadTimer > 90)) settled = false;
    }
    if (live === 0 && downed === 0 && settled) {
      this.lives--;
      if (this.lives < 0) {
        this.gameOver();
      } else {
        this.respawn();
      }
    }

    /* housekeeping */
    this.enemies = this.enemies.filter(function (e) { return !e.dead; });
    this.bullets = this.bullets.filter(function (b) { return !b.dead; });
    this.particles = this.particles.filter(function (pt) { return !pt.dead; });
    this.pickups = this.pickups.filter(function (c) { return !c.dead; });
    this.grenades = this.grenades.filter(function (n) { return !n.dead; });
    this.hazards = this.hazards.filter(function (hz) { return !hz.dead; });
  },

  updateParticles: function () {
    for (var i = 0; i < this.particles.length; i++) {
      if (!this.particles[i].dead) particleUpdate(this.particles[i]);
    }
    this.particles = this.particles.filter(function (pt) { return !pt.dead; });
  },

  updateStageClear: function () {
    this.stateTimer++;
    this.updateParticles();
    if (this.stateTimer > 160) {
      if (this.stageIndex + 1 < STAGES.length) {
        this.stageIndex++;
        this.loadStage(this.stageIndex);
        this.state = 'playing';
        if (this.stage.storyIn && this.stage.storyIn.length) this.startStory(this.stage.storyIn, 'play');
      } else {
        this.victory();
      }
    }
  },

  /* ---- input from the page --------------------------------------------- */
  pressStart: function () {
    if (this.state === 'title' || this.state === 'gameover' || this.state === 'victory') {
      if (this.state !== 'title') this.stateTimer = 999;
      this.startGame();
    } else if (this.state === 'paused') {
      this.state = 'playing';
    }
  }
};

/* ===== 80_render.js ===== */
/* ===========================================================================
   EON COMMANDO — 80 render
   Parallax eras, the world, the HUD and every screen.
   =========================================================================== */

function makeBackground(stage) {
  var rng = mulberry32(stage.seed);
  var span = stage.length + 1600;
  var startX = -800;
  var i, x;

  var stars = [];
  for (i = 0; i < 120; i++) {
    stars.push({ x: rng() * span, y: rng() * 118, s: rng() > 0.86 ? 2 : 1, tw: rng() * 6.28 });
  }

  function ridge(amp, base, step) {
    var pts = [];
    for (var xx = -W; xx < span; xx += step) {
      pts.push({
        x: xx,
        y: base + Math.sin(xx * 0.004) * amp * 0.6 +
           Math.sin(xx * 0.011) * amp * 0.28 + rng() * amp * 0.4
      });
    }
    return pts;
  }

  var clouds = [];
  for (i = 0; i < 12; i++) {
    clouds.push({
      x: rng() * span, y: 16 + rng() * 86,
      w: 70 + rng() * 160, h: 5 + rng() * 9, a: 0.04 + rng() * 0.07
    });
  }

  var mid = [];
  x = startX;
  while (x < span) {
    var w = 20 + rng() * 40;
    var h = 30 + rng() * 92;
    var wins = [];
    for (var wy = 8; wy < h - 6; wy += 9) {
      for (var wx = 4; wx < w - 4; wx += 8) {
        if (rng() > 0.55) wins.push({ x: wx, y: wy });
      }
    }
    mid.push({ x: x, w: w, h: h, wins: wins, lit: rng() > 0.25 });
    x += w + 14 + rng() * 46;
  }

  var near = [];
  x = startX;
  while (x < span) {
    near.push({ x: x, w: 30 + rng() * 60, h: 12 + rng() * 34 });
    x += 70 + rng() * 110;
  }

  var fore = [];
  x = startX;
  while (x < span) {
    fore.push({ x: x, w: 34 + rng() * 70, h: 6 + rng() * 16 });
    x += 130 + rng() * 190;
  }

  var motes = [];
  for (i = 0; i < 60; i++) {
    motes.push({
      x: rng() * span, y: rng() * (GROUND_Y - 20),
      s: rng() > 0.85 ? 2 : 1, ph: rng() * 6.28, sp: 0.3 + rng() * 0.9
    });
  }

  var speckles = [];
  for (i = 0; i < 1100; i++) {
    var sx = rng() * stage.length;
    speckles.push({
      x: sx, y: GROUND_Y + 2 + rng() * (H - GROUND_Y),
      s: rng() > 0.7 ? 2 : 1, d: rng() > 0.5
    });
  }

  var props = [];
  for (i = 0; i < 52; i++) {
    props.push({ x: rng() * stage.length, h: 6 + rng() * 22, w: 3 + rng() * 6, kind: rng() > 0.62 ? 1 : 0 });
  }

  return {
    span: span, stars: stars, clouds: clouds,
    ridgeFar: ridge(30, 58, 46), ridgeMid: ridge(22, 100, 38),
    mid: mid, near: near, fore: fore,
    motes: motes, speckles: speckles, props: props,
    disc: { x: W * (0.24 + rng() * 0.5), y: 62 + rng() * 22, r: 22 + rng() * 12 },
    colFar: shade(stage.sky[2], 0.55),
    colMid: shade(stage.sky[2], 0.4)
  };
}

function drawSky(g, stage, bg, camX, time, noFill) {
  if (!noFill) {
    var grad = g.createLinearGradient(0, 0, 0, GROUND_Y + 20);
    grad.addColorStop(0, stage.sky[0]);
    grad.addColorStop(0.55, stage.sky[1]);
    grad.addColorStop(1, stage.sky[2]);
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
  }

  /* celestial body */
  if (bg && bg.disc) {
    var dx = bg.disc.x - camX * 0.04, dy = bg.disc.y, dr = bg.disc.r;
    var halo = g.createRadialGradient(dx, dy, dr * 0.4, dx, dy, dr * 3.4);
    halo.addColorStop(0, rgba(stage.accent, 0.30));
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = halo;
    g.fillRect(dx - dr * 3.4, dy - dr * 3.4, dr * 6.8, dr * 6.8);
    g.fillStyle = rgba(stage.accent, 0.75);
    g.beginPath();
    g.arc(dx, dy, dr, 0, 6.2832);
    g.fill();
    g.fillStyle = rgba('#ffffff', 0.28);
    g.beginPath();
    g.arc(dx - dr * 0.2, dy - dr * 0.2, dr * 0.7, 0, 6.2832);
    g.fill();
  }

  /* stars */
  if (bg && bg.stars) {
    for (var i = 0; i < bg.stars.length; i++) {
      var st = bg.stars[i];
      var sx = st.x - camX * 0.05;
      if (sx < -4 || sx > W + 4) continue;
      var tw = 0.35 + Math.abs(Math.sin(time * 0.02 + st.tw)) * 0.55;
      g.fillStyle = rgba('#ffffff', tw * 0.8);
      g.fillRect(sx, st.y, st.s, st.s);
    }
  }

  /* cloud bands */
  if (bg && bg.clouds) {
    for (var c = 0; c < bg.clouds.length; c++) {
      var cl = bg.clouds[c];
      var span = bg.span;
      var cx2 = cl.x - camX * 0.1 - (time * 0.06) % span;
      if (cx2 < -cl.w) cx2 += span;
      if (cx2 > W + cl.w) continue;
      g.globalAlpha = clamp(cl.a * 1.7, 0, 0.16);
      el(g, cx2 + cl.w / 2, cl.y + cl.h / 2, cl.w / 2, cl.h / 2, stage.accent);
      el(g, cx2 + cl.w * 0.35, cl.y + cl.h * 0.4, cl.w * 0.28, cl.h * 0.42, stage.accent);
      g.globalAlpha = 1;
    }
  }

  /* horizon glow */
  var rg = g.createRadialGradient(W * 0.5, GROUND_Y - 6, 4, W * 0.5, GROUND_Y - 6, 200);
  rg.addColorStop(0, rgba(stage.accent, 0.20));
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, W, H);
}

function drawBackground(g, stage, bg, camX, time) {
  var i, o, sx;

  function ridgeLine(pts, factor, color) {
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(-20, H);
    for (var j = 0; j < pts.length; j++) {
      var sxj = pts[j].x - camX * factor;
      if (sxj < -120 || sxj > W + 120) continue;
      g.lineTo(sxj, pts[j].y);
    }
    g.lineTo(W + 20, H);
    g.closePath();
    g.fill();
  }

  ridgeLine(bg.ridgeFar, 0.10, bg.colFar);
  ridgeLine(bg.ridgeMid, 0.18, bg.colMid);

  /* mid skyline */
  for (i = 0; i < bg.mid.length; i++) {
    o = bg.mid[i];
    sx = o.x - camX * 0.34;
    if (sx + o.w < -20 || sx > W + 20) continue;
    var top = GROUND_Y - o.h;
    g.fillStyle = stage.mid;
    g.fillRect(sx, top, o.w, o.h + 40);
    g.fillStyle = rgba('#ffffff', 0.03);
    g.fillRect(sx, top, 2, o.h + 40);
    if (o.lit) {
      g.fillStyle = rgba(stage.accent, 0.55);
      for (var k = 0; k < o.wins.length; k++) {
        g.fillRect(sx + o.wins[k].x, top + o.wins[k].y, 2, 2);
      }
    }
  }

  /* near silhouettes */
  g.fillStyle = stage.near;
  for (i = 0; i < bg.near.length; i++) {
    o = bg.near[i];
    sx = o.x - camX * 0.58;
    if (sx + o.w < -20 || sx > W + 20) continue;
    g.fillRect(sx, GROUND_Y - o.h, o.w, o.h + 30);
    g.fillRect(sx + o.w * 0.25, GROUND_Y - o.h - 6, o.w * 0.5, 6);
  }

  /* drifting motes */
  for (i = 0; i < bg.motes.length; i++) {
    o = bg.motes[i];
    sx = o.x - camX * 0.75 - (time * o.sp * 0.25) % (W + 60);
    if (sx < -20) sx += W + 60;
    var sy = o.y + Math.sin(time * 0.02 + o.ph) * 6;
    g.fillStyle = rgba(stage.accent, 0.35 + Math.sin(time * 0.05 + o.ph) * 0.25);
    g.fillRect(sx, sy, o.s, o.s);
  }
}

/* Ground is static per stage: bake it into 1024px chunks once, then blit.
   Saves ~1100 speckle rects and every prop, every frame. */
var GroundCache = { chunks: [], stage: null, key: '' };

function bakeGroundChunks(stage, bg) {
  var key = stage.id + ':' + W;
  if (GroundCache.key === key) return;
  GroundCache.key = key;
  GroundCache.stage = stage;
  GroundCache.chunks = [];

  var CHUNK = 1024;
  var total = Math.ceil(stage.length / CHUNK);
  var HEAD = 36;                    /* headroom for props that rise above the ground */
  var h = H - GROUND_Y + HEAD;

  for (var ci = 0; ci < total; ci++) {
    var x0 = ci * CHUNK;
    var cv = document.createElement('canvas');
    cv.width = CHUNK;
    cv.height = h;
    var cg = cv.getContext('2d');

    /* segments overlapping this chunk */
    for (var i = 0; i < stage.groundSegs.length; i++) {
      var seg = stage.groundSegs[i];
      var sx = seg[0] - x0, sw = seg[1];
      if (sx + sw < 0 || sx > CHUNK) continue;
      /* gradient must map GROUND_Y..H, i.e. the chunk's HEAD..h band */
      var grad = cg.createLinearGradient(0, HEAD, 0, h);
      grad.addColorStop(0, stage.ground);
      grad.addColorStop(1, stage.groundDark);
      cg.fillStyle = grad;
      cg.fillRect(sx, HEAD, sw, h - HEAD);
      /* rim light first, exactly as the live path draws it */
      rr(cg, sx, HEAD, sw, 4, 2, stage.groundLit);
      rr(cg, sx, HEAD, sw, 2, 1, rgba(stage.accent, 0.5));
      cg.fillStyle = 'rgba(0,0,0,0.18)';
      cg.fillRect(sx, HEAD + 9, sw, 1);
      cg.fillRect(sx, HEAD + 20, sw, 1);
      cg.fillStyle = 'rgba(0,0,0,0.6)';
      cg.fillRect(sx, HEAD, 2, h - HEAD);
      cg.fillRect(sx + sw - 2, HEAD, 2, h - HEAD);
    }

    /* speckles in this chunk */
    for (var sp2 = 0; sp2 < bg.speckles.length; sp2++) {
      var sk = bg.speckles[sp2];
      var px2 = sk.x - x0;
      if (px2 < -4 || px2 > CHUNK + 4) continue;
      cg.fillStyle = sk.d ? rgba(stage.groundLit, 0.45) : 'rgba(0,0,0,0.3)';
      cg.fillRect(px2, sk.y - GROUND_Y + HEAD, sk.s, sk.s);
    }

    /* props standing on the ground in this chunk */
    for (var pr = 0; pr < bg.props.length; pr++) {
      var pp = bg.props[pr];
      var ppx = pp.x - x0;
      if (ppx < -14 || ppx > CHUNK + 14) continue;
      if (pp.kind === 0) {
        cg.fillStyle = stage.groundDark;
        cg.fillRect(ppx, HEAD - pp.h, pp.w, pp.h);
        cg.fillStyle = rgba(stage.accent, 0.65);
        cg.fillRect(ppx, HEAD - pp.h, pp.w, 2);
      } else {
        cg.fillStyle = rgba(stage.accent, 0.85);
        cg.beginPath();
        cg.moveTo(ppx, HEAD + 1);
        cg.lineTo(ppx + pp.w / 2, HEAD - pp.h);
        cg.lineTo(ppx + pp.w, HEAD + 1);
        cg.closePath();
        cg.fill();
        cg.fillStyle = rgba('#ffffff', 0.35);
        cg.fillRect(ppx + pp.w / 2 - 1, HEAD - pp.h + 3, 1, pp.h * 0.5);
      }
    }

    GroundCache.chunks.push(cv);
  }
}

function drawGround(g, stage, bg, camX) {
  if (PARAMS.legacyground) { drawGroundLegacy(g, stage, bg, camX); return; }
  bakeGroundChunks(stage, bg);
  var CHUNK = 1024;
  var first = Math.max(0, Math.floor(camX / CHUNK));
  var last = Math.min(GroundCache.chunks.length - 1, Math.floor((camX + W) / CHUNK));
  for (var ci = first; ci <= last; ci++) {
    var cv = GroundCache.chunks[ci];
    if (cv) g.drawImage(cv, Math.round(ci * CHUNK - camX), GROUND_Y - 36);
  }
  return;
}

function drawGroundLegacy(g, stage, bg, camX) {
  var i, seg, sx, sw;
  var segs = stage.groundSegs;
  for (i = 0; i < segs.length; i++) {
    seg = segs[i];
    sx = seg[0] - camX;
    sw = seg[1];
    if (sx + sw < -20 || sx > W + 20) continue;

    var grad = g.createLinearGradient(0, GROUND_Y, 0, H);
    grad.addColorStop(0, stage.ground);
    grad.addColorStop(1, stage.groundDark);
    g.fillStyle = grad;
    g.fillRect(sx, GROUND_Y, sw, H - GROUND_Y);

    rr(g, sx, GROUND_Y, sw, 4, 2, stage.groundLit);
    rr(g, sx, GROUND_Y, sw, 2, 1, rgba(stage.accent, 0.5));

    g.fillStyle = 'rgba(0,0,0,0.18)';
    g.fillRect(sx, GROUND_Y + 9, sw, 1);
    g.fillRect(sx, GROUND_Y + 20, sw, 1);

    g.fillStyle = 'rgba(0,0,0,0.6)';
    g.fillRect(sx, GROUND_Y, 2, H - GROUND_Y);
    g.fillRect(sx + sw - 2, GROUND_Y, 2, H - GROUND_Y);
  }

  for (i = 0; i < bg.speckles.length; i++) {
    var sp = bg.speckles[i];
    sx = sp.x - camX;
    if (sx < -4 || sx > W + 4) continue;
    g.fillStyle = sp.d ? rgba(stage.groundLit, 0.45) : 'rgba(0,0,0,0.3)';
    g.fillRect(sx, sp.y, sp.s, sp.s);
  }

  for (i = 0; i < bg.props.length; i++) {
    var pr = bg.props[i];
    sx = pr.x - camX;
    if (sx < -14 || sx > W + 14) continue;
    if (pr.kind === 0) {
      g.fillStyle = stage.groundDark;
      g.fillRect(sx, GROUND_Y - pr.h, pr.w, pr.h);
      g.fillStyle = rgba(stage.accent, 0.65);
      g.fillRect(sx, GROUND_Y - pr.h, pr.w, 2);
    } else {
      g.fillStyle = rgba(stage.accent, 0.85);
      g.beginPath();
      g.moveTo(sx, GROUND_Y + 1);
      g.lineTo(sx + pr.w / 2, GROUND_Y - pr.h);
      g.lineTo(sx + pr.w, GROUND_Y + 1);
      g.closePath();
      g.fill();
      g.fillStyle = rgba('#ffffff', 0.35);
      g.fillRect(sx + pr.w / 2 - 1, GROUND_Y - pr.h + 3, 1, pr.h * 0.5);
    }
  }
}

/* silhouettes drawn in front of the action for depth */
function drawForeground(g, stage, bg, camX) {
  g.fillStyle = 'rgba(0,0,0,0.82)';
  for (var i = 0; i < bg.fore.length; i++) {
    var o = bg.fore[i];
    var sx = o.x - camX * 1.22;
    if (sx + o.w < -30 || sx > W + 30) continue;
    var base = H + 2;
    g.beginPath();
    g.moveTo(sx, base);
    g.lineTo(sx + o.w * 0.22, H - o.h);
    g.lineTo(sx + o.w * 0.42, H - o.h * 0.55);
    g.lineTo(sx + o.w * 0.66, H - o.h * 0.9);
    g.lineTo(sx + o.w, base);
    g.closePath();
    g.fill();
  }
  /* rubble along the bottom edge */
  g.fillStyle = 'rgba(0,0,0,0.55)';
  for (var j = 0; j < bg.props.length; j++) {
    var p = bg.props[j];
    var px2 = p.x * 1.05 - camX * 1.35;
    if (px2 < -20 || px2 > W + 20) continue;
    g.fillRect(px2, H - 4, p.w + 6, 6);
  }
}

function drawPlatforms(g, stage, camX) {
  var plats = stage.platforms;
  for (var i = 0; i < plats.length; i++) {
    var p = plats[i];
    var sx = p.x - camX;
    if (sx + p.w < -20 || sx > W + 20) continue;
    rr(g, sx, p.y + 2.5, p.w, 8, 3, 'rgba(0,0,0,0.38)');
    rr(g, sx, p.y, p.w, 8, 3, stage.ground);
    rr(g, sx, p.y, p.w, 2.6, 1.3, stage.groundLit);
    rr(g, sx + 3, p.y + 4.4, p.w - 6, 1.4, 0.7, rgba(stage.accent, 0.4));
  }
}

function drawParticles(g, camX) {
  for (var i = 0; i < Game.particles.length; i++) {
    var pt = Game.particles[i];
    var a = clamp(pt.life / pt.maxLife, 0, 1);
    g.globalAlpha = pt.smoke ? a * 0.45 : a;
    g.fillStyle = pt.color;
    g.fillRect(Math.round(pt.x - camX), Math.round(pt.y), pt.size, pt.size);
  }
  g.globalAlpha = 1;
}

/* ---- weather ------------------------------------------------------------
   Screen-space particles per era. Cheap: a handful of rects a frame, and the
   whole thing reads as place. */
var Weather = { parts: [], kind: null, wind: 0, flash: 0, t: 0 };

var WEATHER_KINDS = {
  1: { kind: 'ember',  n: 70,  color: '#ff9a5a', glow: '#ffd257', vy: -0.35, wind: 0.10, sway: 0.9 },
  2: { kind: 'snow',   n: 90,  color: '#dff2ff', glow: '#ffffff', vy: 0.55,  wind: 0.14, sway: 1.1 },
  3: { kind: 'motes',  n: 60,  color: '#c08bff', glow: '#ffd0e4', vy: -0.12, wind: 0.20, sway: 0.7 },
  4: { kind: 'rain',   n: 110, color: '#9fe8d6', glow: '#d8fff4', vy: 5.2,   wind: 1.5,  sway: 0.15 },
  5: { kind: 'debris', n: 55,  color: '#a9b6ff', glow: '#e6e9ff', vy: 0.9,   wind: 2.6,  sway: 0.5 },
  6: { kind: 'ash',    n: 80,  color: '#e8c987', glow: '#fff3c4', vy: 0.30,  wind: 0.12, sway: 0.8 }
};

function setWeather(stageId) {
  var cfg = WEATHER_KINDS[stageId] || WEATHER_KINDS[1];
  Weather.kind = cfg.kind;
  Weather.wind = cfg.wind;
  Weather.parts = [];
  Weather.flash = 0;
  Weather.t = 0;
  for (var i = 0; i < cfg.n; i++) {
    Weather.parts.push({
      x: RNG.fr(0, W + 80) - 40,
      y: RNG.fr(0, H + 40) - 20,
      v: cfg.vy * RNG.fr(0.6, 1.5),
      s: cfg.kind === 'rain' ? 1 : (RNG.fr() > 0.75 ? 2 : 1),
      ph: RNG.fr(0, Math.PI * 2),
      a: RNG.fr(0.25, 0.85)
    });
  }
  Weather.cfg = cfg;
}

function updateWeather() {
  if (!Weather.cfg) return;
  var cfg = Weather.cfg;
  Weather.t++;
  var i, p;
  for (i = 0; i < Weather.parts.length; i++) {
    p = Weather.parts[i];
    p.y += p.v;
    p.x += cfg.wind + Math.sin(Weather.t * 0.02 + p.ph) * cfg.sway * 0.4;
    if (p.y < -12) { p.y = H + 8; p.x = RNG.fr(0, W + 80) - 40; }
    if (p.y > H + 12) { p.y = -8; p.x = RNG.fr(0, W + 80) - 40; }
    if (p.x < -14) p.x = W + 8;
    if (p.x > W + 14) p.x = -8;
  }
  /* a rare storm flash, for the rain eras only */
  if (Weather.kind === 'rain') {
    if (RNG.fChance && RNG.fChance(0.0025)) { Weather.flash = 8; Snd.sfx('hit'); }
    if (Weather.flash > 0) Weather.flash--;
  }
}

function drawWeather(g) {
  if (!Weather.cfg) return;
  var cfg = Weather.cfg, i, p;

  if (Weather.flash > 0) {
    g.fillStyle = 'rgba(200,240,255,' + (Weather.flash / 8 * 0.18) + ')';
    g.fillRect(0, 0, W, H);
  }

  if (Weather.kind === 'rain') {
    g.strokeStyle = rgba(cfg.color, 0.55);
    g.lineWidth = 1;
    g.beginPath();
    for (i = 0; i < Weather.parts.length; i++) {
      p = Weather.parts[i];
      g.moveTo(p.x, p.y);
      g.lineTo(p.x - cfg.wind * 1.6, p.y - 7);
    }
    g.stroke();
    return;
  }

  for (i = 0; i < Weather.parts.length; i++) {
    p = Weather.parts[i];
    g.globalAlpha = p.a * (Weather.kind === 'ember' ? (0.55 + Math.sin(Weather.t * 0.08 + p.ph) * 0.45) : 1);
    g.fillStyle = cfg.color;
    if (Weather.kind === 'debris') g.fillRect(p.x, p.y, p.s + 3, 1);
    else if (Weather.kind === 'snow') g.fillRect(p.x, p.y, p.s, p.s);
    else g.fillRect(p.x, p.y, p.s, p.s);
  }
  g.globalAlpha = 1;
}

/* ---- arena hazards ------------------------------------------------------ */
function drawHazards(g, camX) {
  var i, hz;
  for (i = 0; i < Game.hazards.length; i++) {
    hz = Game.hazards[i];
    var sx = hz.x - camX;

    if (hz.kind === 'debris') {
      if (hz.telegraph > 0) {
        /* ground shadow tells you exactly where it will land */
        var t = 1 - hz.telegraph / 60;
        g.globalAlpha = 0.25 + t * 0.5;
        el(g, sx, GROUND_Y + 1, 10, 3, scheme().hostile);
        g.globalAlpha = 0.5 + Math.sin(Game.time * 0.5) * 0.3;
        g.fillStyle = scheme().hostile;
        g.fillRect(sx - 0.5, GROUND_Y - 90, 1, 86);
        g.globalAlpha = 1;
      } else {
        el(g, sx, GROUND_Y + 1, 7, 2, 'rgba(0,0,0,0.45)');
        g.save();
        g.translate(sx, hz.y);
        g.rotate(hz.y * 0.06);
        rr(g, -hz.w / 2, -hz.h / 2, hz.w, hz.h, 3, '#3a2a2a');
        rr(g, -hz.w / 2 + 1, -hz.h / 2 + 1, hz.w - 2, 3, 1.5, '#6d4a3a');
        g.restore();
      }
      continue;
    }

    if (hz.kind === 'beam') {
      var cx = hz.cx - camX, cy = hz.cy;
      var ex = cx + Math.cos(hz.angle) * hz.len;
      var ey = cy + Math.sin(hz.angle) * hz.len;
      if (hz.telegraph > 0) {
        g.globalAlpha = 0.28 + Math.sin(Game.time * 0.4) * 0.18;
        g.strokeStyle = scheme().hostile;
        g.lineWidth = 1.5;
        g.setLineDash([5, 5]);
        g.beginPath(); g.moveTo(cx, cy); g.lineTo(ex, ey); g.stroke();
        g.setLineDash([]);
        g.globalAlpha = 1;
      } else {
        g.globalAlpha = 0.35;
        g.strokeStyle = scheme().hostileGlow;
        g.lineWidth = hz.w + 5;
        g.lineCap = 'round';
        g.beginPath(); g.moveTo(cx, cy); g.lineTo(ex, ey); g.stroke();
        g.globalAlpha = 1;
        g.strokeStyle = scheme().hostile;
        g.lineWidth = hz.w;
        g.beginPath(); g.moveTo(cx, cy); g.lineTo(ex, ey); g.stroke();
        g.strokeStyle = '#ffffff';
        g.lineWidth = Math.max(1, hz.w * 0.35);
        g.beginPath(); g.moveTo(cx, cy); g.lineTo(ex, ey); g.stroke();
      }
    }
  }
}

function drawBullets(g, camX) {
  var i, b, x, y;
  /* trails first so cores always sit on top */
  g.lineCap = 'round';
  for (i = 0; i < Game.bullets.length; i++) {
    b = Game.bullets[i];
    x = b.x - camX; y = b.y;
    var tl = b.friendly ? 5 : 6.5;
    g.globalAlpha = b.friendly ? 0.30 : 0.42;
    g.strokeStyle = b.color;
    g.lineWidth = Math.max(1.4, b.w * 0.55);
    g.beginPath();
    g.moveTo(x - b.vx * tl * 0.16, y - b.vy * tl * 0.16);
    g.lineTo(x, y);
    g.stroke();
  }
  g.globalAlpha = 1;

  for (i = 0; i < Game.bullets.length; i++) {
    b = Game.bullets[i];
    x = Math.round(b.x - camX); y = Math.round(b.y);
    /* dark rim so a bullet never vanishes against a bright wall */
    g.globalAlpha = 0.5;
    g.fillStyle = '#05070d';
    g.fillRect(x - b.w / 2 - 1.5, y - b.h / 2 - 1.5, b.w + 3, b.h + 3);
    g.globalAlpha = 0.4;
    g.fillStyle = b.glow;
    g.fillRect(x - b.w / 2 - 1, y - b.h / 2 - 1, b.w + 2, b.h + 2);
    g.globalAlpha = 1;
    g.fillStyle = b.color;
    g.fillRect(x - b.w / 2, y - b.h / 2, b.w, b.h);
    g.fillStyle = '#ffffff';
    g.fillRect(x - b.w / 4, y - b.h / 4, Math.max(1, b.w / 2), Math.max(1, b.h / 2));
  }
}

/* small arrows at the screen edge for enemies you cannot see yet */
function drawThreatArrows(g, camX) {
  var shown = 0;
  for (var i = 0; i < Game.enemies.length && shown < 4; i++) {
    var e = Game.enemies[i];
    var sx = e.x - camX + e.w / 2;
    if (sx > -30 && sx < W + 30) continue;
    if (Math.abs(sx - W / 2) > W * 1.2) continue;
    var side = sx < 0 ? -1 : 1;
    var ax = side < 0 ? 6 : W - 6;
    var ay = clamp(e.y - camX * 0 + e.h / 2, 40, H - 30);
    var col = e.elite ? '#ffe08a' : '#ff4d6d';
    g.globalAlpha = 0.55 + Math.sin(Game.time * 0.15) * 0.2;
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(ax + side * 5, ay);
    g.lineTo(ax - side * 3, ay - 4);
    g.lineTo(ax - side * 3, ay + 4);
    g.closePath();
    g.fill();
    g.globalAlpha = 1;
    shown++;
  }
}

function drawWorld(g) {
  var stage = Game.stage, camX = Game.camX;
  var bg = Game.bg;
  drawSky(g, stage, bg, camX, Game.time, VIEW_H !== H);
  g.globalAlpha = Game.boss ? 0.82 : 1;
  drawBackground(g, stage, bg, camX, Game.time);
  g.globalAlpha = 1;
  drawGround(g, stage, bg, camX);
  drawPlatforms(g, stage, camX);

  var i;
  /* contact shadows */
  g.fillStyle = 'rgba(0,0,0,0.35)';
  for (i = 0; i < Game.enemies.length; i++) {
    var en = Game.enemies[i];
    if (en.y + en.h > GROUND_Y - 4) {
      g.beginPath();
      g.ellipse(en.x - camX + en.w / 2, GROUND_Y + 1, en.w * 0.5, 2, 0, 0, 6.2832);
      g.fill();
    }
  }
  var pl = Game.player;
  if (pl && pl.onGround) {
    g.beginPath();
    g.ellipse(pl.x - camX + pl.w / 2, pl.y + pl.h + 1, pl.w * 0.55, 2, 0, 0, 6.2832);
    g.fill();
  }

  for (i = 0; i < Game.pickups.length; i++) drawCapsule(g, Game.pickups[i]);

  for (i = 0; i < Game.enemies.length; i++) {
    var e = Game.enemies[i];
    var ex = e.x - camX;
    if (ex < -40 || ex > W + 40) continue;
    g.save();
    g.translate(-camX, 0);
    if (e.t === 'grunt') drawGrunt(g, e);
    else if (e.t === 'runner') drawRunner(g, e);
    else if (e.t === 'drone') drawDrone(g, e);
    else if (e.t === 'turret') drawTurret(g, e);
    else if (e.t === 'jumper') drawJumper(g, e);
    else if (e.t === 'sniper') drawSniper(g, e);
    else if (e.t === 'swarm') drawSwarm(g, e);
    else if (e.t === 'brute') drawBrute(g, e);
    else if (e.t === 'shielder') drawShielder(g, e);
    g.restore();
  }

  if (Game.boss) {
    g.save();
    g.translate(-camX, 0);
    drawBoss(g, Game.boss);
    g.restore();
  }

  var p = Game.player;
  var plist = (Game.players && Game.players.length) ? Game.players : (p ? [p] : []);
  for (var pj = 0; pj < plist.length; pj++) {
    var pp = plist[pj];
    if (!pp || (pp.dead && Math.floor(pp.deadTimer / 4) % 2 === 1)) continue;
    g.save();
    g.translate(-camX, 0);
    if (pp.downed) {
      /* downed: greyed out, pulsing, with a revive ring */
      g.globalAlpha = 0.55 + Math.sin(Game.time * 0.2) * 0.15;
      drawPlayer(g, pp);
      g.globalAlpha = 1;
      var prx = pp.x + pp.w / 2 - camX, pry = pp.y - 10;
      g.strokeStyle = 'rgba(84,255,168,0.8)';
      g.lineWidth = 2;
      g.beginPath();
      g.arc(prx, pry, 7, -1.57, -1.57 + 6.2832 * clamp(pp.reviveT / 55, 0, 1));
      g.stroke();
      drawText(g, 'DOWN', prx, pry - 12, 1, '#ff4d6d', 'center', 'rgba(0,0,0,0.8)');
    } else {
      if (pp.invuln > 0 && !pp.dead && Math.floor(pp.invuln / 4) % 2 === 1) g.globalAlpha = 0.45;
      drawPlayer(g, pp);
      g.globalAlpha = 1;
    }
    g.restore();
  }

  /* dash afterimages */
  for (i = 0; i < Game.ghosts.length; i++) drawDashGhost(g, Game.ghosts[i], camX);

  g.save();
  g.translate(-camX, 0);
  for (i = 0; i < Game.grenades.length; i++) drawGrenade(g, Game.grenades[i]);
  g.restore();

  for (var mi = 0; mi < plist.length; mi++) {
    if (plist[mi] && plist[mi].meleeT > 0) drawMeleeArc(g, plist[mi], camX);
  }

  drawWeather(g);
  drawHazards(g, camX);
  drawBullets(g, camX);
  drawParticles(g, camX);
  drawThreatArrows(g, camX);
  drawForeground(g, stage, bg, camX);

  /* floating score text */
  for (i = 0; i < Game.floaters.length; i++) {
    var f = Game.floaters[i];
    g.globalAlpha = clamp(f.life / 30, 0, 1);
    drawText(g, f.text, f.x - camX, f.y, 1, f.color, 'center', 'rgba(0,0,0,0.7)');
    g.globalAlpha = 1;
  }
}

/* ---- HUD ---------------------------------------------------------------- */
function drawHeartIcon(g, x, y, full, tint) {
  var c = full ? (tint || '#ff4d6d') : '#31161f';
  var c2 = full ? (tint ? '#d8f8ff' : '#ffd0d8') : '#20101a';
  px(g, x + 1, y, 2, 1, c); px(g, x + 4, y, 2, 1, c);
  px(g, x, y + 1, 7, 2, c);
  px(g, x + 1, y + 3, 5, 1, c);
  px(g, x + 2, y + 4, 3, 1, c);
  px(g, x + 3, y + 5, 1, 1, c);
  px(g, x + 1, y + 1, 1, 1, c2);
}

var HUDS = { score: '', hi: '', lives: '', weapon: '' };

function drawHUD(g) {
  var p = Game.player;
  var stage = Game.stage;
  var k = clamp(SET.hudScale || 1, 0.85, 1.3);

  /* top bar */
  var grad = g.createLinearGradient(0, 0, 0, 26 * k);
  grad.addColorStop(0, 'rgba(3,5,10,0.82)');
  grad.addColorStop(1, 'rgba(3,5,10,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, 26 * k);

  var i;
  /* left cluster */
  g.save();
  g.scale(k, k);
  for (i = 0; i < p.maxHp; i++) drawHeartIcon(g, 7 + i * 10, 6, i < p.hp);
  drawText(g, 'X' + Math.max(0, Game.lives), 7, 16, 1, '#9fb2c6');
  px(g, 21, 15, 7, 2, '#0b0f18');
  px(g, 22, 15, 5, 4, '#3f6b8c');
  px(g, 23, 17, 3, 1, '#ffb545');
  px(g, 21, 19, 7, 2, '#2c4a63');
  /* grenade pips */
  for (i = 0; i < p.maxGrenades; i++) {
    px(g, 34 + i * 6, 16, 4, 4, i < p.grenades ? '#9ef0ff' : '#20303f');
  }
  g.restore();

  /* player two's hearts, tinted, under player one's */
  if (Game.coop && Game.players[1]) {
    var p2h = Game.players[1];
    g.save();
    g.scale(k, k);
    for (i = 0; i < p2h.maxHp; i++) drawHeartIcon(g, 7 + i * 10, 27, i < p2h.hp, '#54e0ff');
    drawText(g, 'P2', 7 + p2h.maxHp * 10 + 3, 28, 1, p2h.downed ? '#ff4d6d' : '#54e0ff');
    g.restore();
  }

  /* right cluster, anchored to the far edge */
  g.save();
  g.translate(W, 0);
  g.scale(k, k);
  var sc = 'SCORE ' + String(Game.score).padStart(7, '0');
  var hi = 'HI ' + String(Math.max(Game.hiScore, Game.score)).padStart(7, '0');
  if (sc !== HUDS.score) { HUDS.score = sc; HUDS.scoreW = textWidth(sc, 1); }
  if (hi !== HUDS.hi) { HUDS.hi = hi; }
  drawText(g, HUDS.score, -7, 6, 1, '#ffffff', 'right', 'rgba(0,0,0,0.7)');
  drawText(g, HUDS.hi, -7, 16, 1, rgba(stage.accent, 0.9), 'right', 'rgba(0,0,0,0.7)');
  g.restore();

  /* weapon chip */
  var w = WEAPONS[p.weapon];
  g.save();
  g.scale(k, k);
  var chipW = textWidth(w.name, 1) + 14;
  px(g, 6, H / k - 18, chipW, 12, 'rgba(3,5,10,0.7)');
  px(g, 6, H / k - 18, 2, 12, w.color);
  drawText(g, w.name, 12, H / k - 15, 1, w.color);
  if (SET.autoFire) {
    var ax = 12 + textWidth(w.name, 1) + 4;
    drawText(g, 'AUTO', ax, H / k - 15, 1, p.autoAiming ? '#54ffa8' : '#3f5d6b');
  }
  g.restore();

  /* boss bar */
  var b = Game.boss;
  if (b && !b.dead) {
    var bw = 250, bx = (W - bw) / 2, by = 30;
    drawText(g, b.name, W / 2, by - 9, 1, '#ff4d6d', 'center', 'rgba(0,0,0,0.8)');
    px(g, bx - 1, by - 1, bw + 2, 8, 'rgba(0,0,0,0.7)');
    px(g, bx, by, bw, 6, '#2a0d16');
    var frac = clamp(b.hp / b.maxHp, 0, 1);
    px(g, bx, by, bw * frac, 6, b.phase === 2 ? '#ff5c3c' : '#ff2d95');
    px(g, bx, by, bw * frac, 2, '#ffd0e4');
    for (var t = 1; t < 10; t++) px(g, bx + (bw / 10) * t, by, 1, 6, 'rgba(0,0,0,0.4)');
  }

  /* power gauge + combo */
  if (Game.state === 'playing') {
    g.save();
    g.scale(k, k);
    var gy = 52;
    var gw = 62;
    px(g, 7, gy, gw, 4, '#12202e');
    var fill = Math.round(gw * clamp(Game.power, 0, 100) / 100);
    px(g, 7, gy, fill, 4, Game.power >= 100 ? '#ffd257' : '#54e0ff');
    px(g, 7, gy, gw, 1, 'rgba(255,255,255,0.18)');
    if (Game.power >= 100) {
      if (Math.floor(Game.time / 12) % 2 === 0) drawText(g, 'UNLEASH ' + (SET.autoFire ? '' : 'E'), 7, gy + 7, 1, '#ffd257');
    } else {
      drawText(g, 'POWER', 7, gy + 7, 1, '#3f5d6b');
    }
    if (Game.combo > 1) {
      drawText(g, 'x' + Game.combo, 7 + gw + 6, gy - 1, 1, Game.comboT > 40 ? '#ffb545' : '#7f8fa6');
    }
    g.restore();
  }

  /* endless wave readout */
  if (Game.mode === 'endless') {
    g.save();
    g.scale(k, k);
    drawText(g, 'WAVE ' + Math.max(1, Game.wave) + (Game.waveActive ? '' : '  NEXT...'),
             7, 38, 1, '#ff2d95');
    drawText(g, 'x' + (Game.scoreMul || 1).toFixed(2), 7, 47, 1, '#ffd257');
    g.restore();
  }

  /* replay watermark */
  if (Game.replayMode) {
    var on = Math.floor(Game.time / 40) % 2 === 0;
    g.globalAlpha = on ? 0.9 : 0.55;
    drawText(g, 'REPLAY', W - 8, H - 16, 1, '#ff2d95', 'right', 'rgba(0,0,0,0.8)');
    g.globalAlpha = 1;
  }

  /* banner */
  if (Game.banner) {
    var bn = Game.banner;
    var life = bn.life;
    var alpha = life > 110 ? (130 - life) / 20 : clamp(life / 30, 0, 1);
    g.globalAlpha = clamp(alpha, 0, 1);
    drawFit(g, bn.text, 96, 3, bn.color || '#ffffff', 'rgba(0,0,0,0.85)', W - 16);
    drawText(g, bn.sub, W / 2, 124, 1, '#cfd8e3', 'center', 'rgba(0,0,0,0.85)');
    g.globalAlpha = 1;
  }
}

/* ---- screens ------------------------------------------------------------ */
function dim(g, a) {
  g.fillStyle = 'rgba(3,5,10,' + a + ')';
  g.fillRect(0, 0, W, H);
}

function drawTitle(g) {
  var t = PARAMS.shot ? 12 : Game.stateTimer;
  Game.hitRows = [];
  /* drifting background of era one */
  Game.camX = (t * 0.35) % (STAGES[0].length - W);
  drawSky(g, STAGES[0], Game.bg, Game.camX, t);
  drawBackground(g, STAGES[0], Game.bg, Game.camX, t);
  drawGround(g, STAGES[0], Game.bg, Game.camX);
  dim(g, 0.55);

  /* title */
  var bob = Math.sin(t * 0.03) * 2;
  g.globalAlpha = 0.25;
  drawFit(g, 'EON', 42 + bob, 5, '#ff5c3c', null, W - 14);
  drawFit(g, 'COMMANDO', 82 + bob, 5, '#ff5c3c', null, W - 14);
  g.globalAlpha = 1;
  drawFit(g, 'EON', 40 + bob, 5, '#ffd257', '#3a1f24', W - 14);
  drawFit(g, 'COMMANDO', 80 + bob, 5, '#ffb545', '#3a1f24', W - 14);

  drawText(g, narrow ? 'THREE ERAS. NO MERCY.' : 'THREE ERAS. ONE COMMANDO. NO MERCY.',
           W / 2, 122, 1, '#9fb2c6', 'center');

  /* mode menu — tappable, and arrow-key navigable */
  var rows = Game.titleRows();
  var step = narrow ? 19 : 17;
  var y = narrow ? 138 : 140;
  for (var ri = 0; ri < rows.length; ri++) {
    var sel = ri === Game.titleIndex;
    if (sel) px(g, W / 2 - 74, y - 5, 148, step - 3, 'rgba(84,224,255,0.14)');
    drawText(g, (sel ? '> ' : '') + rows[ri].label, W / 2, y, 1,
             sel ? '#ffffff' : '#9fb2c6', 'center');
    Game.hitRows.push({ y0: y - 6, y1: y + 9, i: ri });
    y += step;
  }

  /* blinking prompt */
  var narrow = W < 380;
  if (SET.autoFire) drawText(g, 'AUTO-FIRE ON', W / 2, 116, 1, '#54ffa8', 'center');
  drawText(g, (Game.dailyRun ? 'DAILY RUN ' + Daily.label() + '  ·  ' : 'DIFFICULTY ') +
              (Game.dailyRun ? DIFFICULTY[clamp(SET.difficulty, 0, 2)].name : DIFFICULTY[clamp(SET.difficulty, 0, 2)].name),
           W / 2, 216, 1, '#54e0ff', 'center');

  drawText(g, 'HI SCORE ' + String(Game.hiScore).padStart(7, '0'), W / 2, 232, 1, '#ffd257', 'center');
  var runs = Scores.all().slice(0, 3);
  for (var li = 0; li < runs.length; li++) {
    drawText(g, (li + 1) + '. ' + String(runs[li].score).padStart(7, '0') + '  ' + (runs[li].result || ''),
             W / 2, 242 + li * 9, 1, '#54637a', 'center');
  }
  drawText(g, narrow ? ('V' + VERSION + '  ·  ONE FILE')
                     : ('V' + VERSION + '  ·  ONE HTML FILE  ·  ZERO DEPENDENCIES'),
           W / 2, 250, 1, '#3f4d61', 'center');
}

function drawPause(g) {
  dim(g, 0.78);
  drawFit(g, 'PAUSED', 22, 3, '#54e0ff', 'rgba(0,0,0,0.85)', W - 16);
  var rows = Game.pauseRows();
  Game.hitRows = [];
  var narrow = W < 380;
  var step = narrow ? 25 : 18;
  var band = narrow ? 11 : 6;
  var y = narrow ? 60 : 64, i;
  for (i = 0; i < rows.length; i++) {
    var sel = i === Game.pauseIndex;
    if (sel) px(g, narrow ? 20 : 40, y - band, W - (narrow ? 40 : 80), band * 2, 'rgba(84,224,255,0.16)');
    drawText(g, rows[i].label, W / 2, y, 1, sel ? '#ffffff' : '#9fb2c6', 'center');
    Game.hitRows.push({ y0: y - band, y1: y + band, i: i });
    y += step;

}

function drawSettings(g) {
  dim(g, 0.82);
  Game.hitRows = [];
  drawText(g, 'SETTINGS', W / 2, 26, 3, '#54e0ff', 'center', 'rgba(0,0,0,0.85)');
  var rows = [
    ['DIFFICULTY', DIFFICULTY[clamp(SET.difficulty, 0, 2)].name],

  ];

  } else {
    drawText(g, 'UP / DOWN TO CHOOSE   LEFT / RIGHT TO CHANGE', W / 2, H - 34, 1, '#54637a', 'center');
