<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>EON COMMANDO — a run-and-gun in one HTML file</title>
<meta name="description" content="EON COMMANDO is a retro run-and-gun platformer: three eras, five weapons, boss fights and chiptune audio in one self-contained HTML file. No dependencies, works offline.">
<meta property="og:title" content="EON COMMANDO">
<meta property="og:description" content="A retro run-and-gun platformer in one self-contained HTML file.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305070d'/%3E%3Cpath d='M8 2l5 4v4l-5 4-5-4V6z' fill='%23ffb545'/%3E%3Crect x='6' y='7' width='4' height='2' fill='%2305070d'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#05070d; --panel:#0b1220; --line:#1d2b3f;
    --amber:#ffb545; --cyan:#54e0ff; --dim:#7f8fa6;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; height:100%; background:var(--ink); color:#cfd8e3;
    font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow:hidden; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:none; overscroll-behavior:none;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, #0d1726 0%, #05070d 62%, #03040a 100%);
  }
  /* the canvas owns the whole viewport — no page furniture, no letterbox gaps */
  #stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center}
  canvas{
    display:block; image-rendering:pixelated; image-rendering:crisp-edges;
    background:#070a12; border:0; border-radius:0; box-shadow:none;
  }
  /* portrait phones: square play area at the top, thumbs below, no dead margins */
  body.portrait #stage{align-items:flex-start; padding-top:max(3vh,env(safe-area-inset-top))}
  body.touch.portrait canvas{border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 0 1px #1b2839}
  /* a soft glow behind the thumb area so the lower half reads as part of the game */
  body.touch.portrait::after{
    content:''; position:fixed; left:0; right:0; bottom:0; height:44%;
    background:radial-gradient(ellipse 70% 90% at 50% 110%, rgba(84,224,255,.10), transparent 70%);
    pointer-events:none; z-index:1;
  }
  body.touch.portrait #rotate{top:62%; bottom:auto}
  #rotate{
    display:none; position:fixed; left:0; right:0; bottom:36%;
    text-align:center; font-size:11px; letter-spacing:.14em; color:#3f4d61;
    pointer-events:none;
  }
  body.touch.portrait #rotate{display:block}
  /* on-screen controls — shown only for touch devices */
  #pads{display:none}
  body.touch #pads{display:block}
  .pad{position:fixed; bottom:max(14px,env(safe-area-inset-bottom)); display:grid; gap:8px; z-index:5}
  #padL{left:max(14px,env(safe-area-inset-left)); grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,58px)}
  #padL [data-k="up"]{grid-area:1/2}
  #padL [data-k="left"]{grid-area:2/1}
  #padL [data-k="down"]{grid-area:2/2}
  #padL [data-k="right"]{grid-area:2/3}
  #padR{right:max(14px,env(safe-area-inset-right)); grid-template-columns:repeat(3,54px); grid-template-rows:54px 62px;
        justify-items:end; align-items:end}
  #padR [data-k="fire"]{grid-area:2/2}
  #padR [data-k="jump"]{grid-area:2/3}
  #padR [data-k="melee"]{grid-area:1/1}
  #padR [data-k="dash"]{grid-area:1/2}
  #padR [data-k="grenade"]{grid-area:1/3}
  #padR [data-k="power"]{grid-area:2/2}
  #padR button.sm{font-size:12px; opacity:.82}
  .pad button{
    width:100%; height:100%; padding:0; color:#cfd8e3; font:16px ui-monospace,monospace;
    background:rgba(19,28,40,.82); border:1px solid #26394f; border-radius:14px;
    backdrop-filter:blur(2px); transition:background .06s, transform .06s;
  }
  .pad button:active, .pad button.on{background:rgba(84,224,255,.28); border-color:var(--cyan); transform:scale(.96)}
  #padR button{background:rgba(40,26,10,.82); border-color:#4a3a1c; font-weight:700; color:var(--amber)}
  #padR button:active, #padR button.on{background:rgba(255,181,69,.3); border-color:var(--amber)}
  #btnPause{
    position:fixed; bottom:calc(max(14px,env(safe-area-inset-bottom)) + 8px); left:50%;
    transform:translateX(-50%); width:46px; height:34px; padding:0; z-index:6;
    color:#cfd8e3; font-size:12px; background:rgba(19,28,40,.7);
    border:1px solid #26394f; border-radius:10px; display:none;
  }
  body.touch.portrait #btnPause{bottom:auto; top:calc(max(10px,env(safe-area-inset-top)) + 4px)}
  body.touch #btnPause{display:block}
  #hint{
    position:fixed; left:0; right:0; bottom:6px; text-align:center; font-size:11px;
    color:#3f4d61; letter-spacing:.08em; pointer-events:none; z-index:4;
    animation:hintFade 1s ease 9s forwards;
  }
  @keyframes hintFade{to{opacity:0}}
  body.touch #hint{display:none}
  body.shot #hint, body.shot #pads, body.shot #btnPause{display:none!important}
  body.shot{background:#000}
  body.shot canvas{border:0;border-radius:0;box-shadow:none}
  body.shot #stage{filter:none}
  @media (max-height:520px){ #hint{display:none} }

  /* ---- auto-fire touch layout -------------------------------------------
     With the gun firing itself, up/down stop being aim controls: up becomes
     jump, down becomes duck, and the fire button has no job. */
  body.auto #padR [data-k="fire"]{ display:none }
  /* jump lives on A; keeping a second jump button duplicated the action */
  body.auto #padL [data-k="up"]{ display:none }
  body.auto #padL [data-k="left"]{ grid-area:2/1 }
  body.auto #padL [data-k="down"]{ grid-area:2/2; background:rgba(255,181,69,.16); border-color:#7a5a2a }
  body.auto #padL [data-k="right"]{ grid-area:2/3 }
  body.auto #padL [data-k="down"]{ background:rgba(255,181,69,.16); border-color:#7a5a2a }
  #padR [data-k="power"]{ display:none; background:rgba(255,210,87,.20); border-color:#8a6a22; color:#ffd257; font-size:15px }
  body.auto #padR [data-k="power"].ready{ display:block; animation:pulse 1.1s ease-in-out infinite }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 7px rgba(255,210,87,.16) } }

  /* ---- pad layout editor ------------------------------------------------ */
  #padEditor{ position:fixed; inset:0; z-index:30; display:none; pointer-events:none }
  body.editing #padEditor{ display:block }
  #padEditor .pe-bar{
    position:absolute; top:0; left:0; right:0; display:flex; gap:8px; align-items:center;
    padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:rgba(5,7,13,.94); border-bottom:1px solid #1b2839; pointer-events:auto;
  }
  #padEditor .pe-bar span{ flex:1; font-size:9px; letter-spacing:.18em; color:#7f8fa6; line-height:1.3 }
  #padEditor button{
    background:rgba(19,28,40,.9); color:#cfd8e3; border:1px solid #26394f; border-radius:8px;
    font:inherit; font-size:12px; padding:8px 10px; min-width:38px; cursor:pointer;
  }
  #padEditor button:active{ background:rgba(84,224,255,.2); border-color:#2f6f8f }
  body.editing #padL, body.editing #padR{
    outline:2px dashed rgba(84,224,255,.55); outline-offset:8px; border-radius:10px;
    touch-action:none; z-index:31;
  }
  body.editing #touch{ background:rgba(5,7,13,.55) }
</style>
</head>
<body>

<div id="stage"><canvas id="c" width="480" height="270" aria-label="Eon Commando — game screen"></canvas></div>

<div id="pads">
  <div class="pad" id="padL">
    <button data-k="up" aria-label="Aim up">▲</button>
    <button data-k="left" aria-label="Move left">◀</button>
    <button data-k="down" aria-label="Duck">▼</button>
    <button data-k="right" aria-label="Move right">▶</button>
  </div>
  <div class="pad" id="padR">
    <button data-k="grenade" class="sm" aria-label="Grenade">G</button>
    <button data-k="dash" class="sm" aria-label="Dash">&#187;</button>
    <button data-k="melee" class="sm" aria-label="Melee">M</button>
    <button data-k="fire" id="btnFire" aria-label="Fire">B</button>
    <button data-k="jump" aria-label="Jump">A</button>
    <button data-k="power" id="btnPower" aria-label="Unleash">&#9889;</button>
  </div>
</div>
<div id="padEditor" aria-hidden="true">
  <div class="pe-bar">
    <span>DRAG THE PADS WHERE YOUR THUMBS ARE</span>
    <button id="peSmall" type="button">&minus;</button>
    <button id="peBig" type="button">+</button>
    <button id="peReset" type="button">RESET</button>
    <button id="peDone" type="button">DONE</button>
  </div>
</div>
<button id="btnPause" aria-label="Pause">❙❙</button>
<div id="hint">ARROWS / WASD move &middot; SPACE jump &middot; Z fire &middot; SHIFT dash &middot; V melee &middot; G grenade &middot; P pause</div>
<div id="rotate">&#8635; ROTATE FOR A WIDER VIEW</div>

<script>

/* ===== 05_lankit.js ===== */
/* lan-kit.js — the browser client for a drsamonline LAN room. Zero dependencies.
 *
 * Talks to a lan-host over Server-Sent Events (server -> client) and POST
 * (client -> server). Works on a LAN with no internet and no accounts.
 *
 *   const c = Lan.client({ url: Lan.hostUrl(8080),
 *                          onOpen:   h => console.log("joined", h.room),
 *                          onMessage: m => console.log("got", m) });
 *   c.send({ from: "me", text: "hello room" });
 *
 * PolyForm Noncommercial 1.0.0. (c) 2026 Dr Sohil Momin.
 */
(function (root) {
  "use strict";
  var Lan = { version: "0.1.0" };

  function base(url) { return String(url || "").replace(/\/+$/, ""); }
  function safeParse(s) { try { return JSON.parse(s); } catch (e) { return s; } }

  Lan.client = function (opts) {
    opts = opts || {};
    var url = base(opts.url || "");
    var es = new EventSource(url + "/events");
    es.addEventListener("hello", function (e) { if (opts.onOpen) opts.onOpen(safeParse(e.data)); });
    es.addEventListener("message", function (e) { if (opts.onMessage) opts.onMessage(safeParse(e.data)); });
    es.onerror = function (e) { if (opts.onError) opts.onError(e); };
    return {
      url: url,
      send: function (msg) {
        return fetch(url + "/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(msg)
        }).then(function (r) { return r.json(); });
      },
      close: function () { try { es.close(); } catch (e) {} }
    };
  };

  /* A short, unambiguous room code (no 0/O/1/I/L). */
  Lan.roomCode = function (n) {
    n = n || 4;
    var A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", s = "";
    for (var i = 0; i < n; i++) s += A[Math.floor(Math.random() * A.length)];
    return s;
  };

  /* The host URL for this device on the current LAN. */
  Lan.hostUrl = function (port) {
    return "http://" + location.hostname + ":" + (port || 8080);
  };

  root.Lan = Lan;
})(typeof globalThis !== "undefined" ? globalThis : this);

/* ===== 10_core.js ===== */
/* ===========================================================================
   EON COMMANDO — 10 core
   Constants, maths, storage, small helpers. No dependencies.
   =========================================================================== */
'use strict';

var VERSION = '3.0.0';
var DPR = 1;                       // device pixel ratio, capped at 2
var W = 480, H = 270;              // world view: W widens with the window
var VIEW_H = 270;                  // logical canvas height (portrait gets taller)
var Y0 = 0;                        // where the world band starts inside the canvas
var W_MIN = 480, W_MAX = 640;      // 16:9 floor, 21:9 ceiling (desktop range)
var ARENA_W = 480;                 // boss arenas keep a fixed 16:9 footprint
var GROUND_Y = 232;                // world y of the ground surface

/* Pick the logical width from the real aspect ratio.
   Landscape keeps a 16:9 floor and widens to 21:9. Portrait switches to a
   square view — a 16:9 band on a phone held upright is only a quarter of the
   screen, and the sprites end up tiny. */
function viewWidthFor(px_w, px_h) {
  var aspect = px_w / Math.max(1, px_h);
  if (aspect < 1) return clamp(Math.round(H * aspect), 220, 360);
  return clamp(Math.round(H * aspect), W_MIN, W_MAX);
}
var FPS = 60, STEP = 1 / FPS;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
function lerp(a, b, t) { return a + (b - a) * t; }
/* cosmetic randomness routes through the seeded fx stream, so a run is
   reproducible end to end — needed for replays, seeds and screenshot diffs */
function rnd(a, b) { if (b === undefined) { b = a; a = 0; } return a + RNG.f() * (b - a); }
function rndi(a, b) { return Math.floor(rnd(a, b + 1)); }
function pick(arr) { return arr[Math.floor(RNG.f() * arr.length)]; }
function chance(p) { return RNG.f() < p; }
function approach(v, target, step) {
  if (v < target) return Math.min(v + step, target);
  if (v > target) return Math.max(v - step, target);
  return target;
}
function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function overlap(a, b, pad) {
  pad = pad || 0;
  return a.x + pad < b.x + b.w && a.x + a.w - pad > b.x &&
         a.y + pad < b.y + b.h && a.y + a.h - pad > b.y;
}

/* ---- persistence: never throw in private mode / file:// ------------------ */
var Store = {
  key: 'eon-commando-v1',
  read: function () {
    try { return JSON.parse(localStorage.getItem(this.key) || '{}') || {}; }
    catch (e) { return {}; }
  },
  write: function (obj) {
    try { localStorage.setItem(this.key, JSON.stringify(obj)); } catch (e) {}
  },
  get: function (k, dflt) { var o = this.read(); return (k in o) ? o[k] : dflt; },
  set: function (k, v) { var o = this.read(); o[k] = v; this.write(o); }
};

/* ---- colour helpers ----------------------------------------------------- */
function rgba(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function shade(hex, f) {
  var n = parseInt(hex.slice(1), 16);
  var r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255);
  var g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255);
  var b = clamp(Math.round((n & 255) * f), 0, 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

/* ---- debug / test hooks ------------------------------------------------- */
var PARAMS = (function () {
  var out = {}, q = (location.search || '').replace(/^\?/, '').split('&');
  for (var i = 0; i < q.length; i++) {
    if (!q[i]) continue;
    var kv = q[i].split('=');
    out[decodeURIComponent(kv[0])] = kv.length > 1 ? decodeURIComponent(kv[1]) : '1';
  }
  return out;
})();

/* ---- seeded randomness ---------------------------------------------------
   Two streams: `sim` drives gameplay and must be reproducible (replays,
   daily seeds, future LAN), `fx` drives cosmetics and may vary freely.       */
var RNG = {
  sim: null, fx: null,
  seed: function (s) {
    s = (s >>> 0) || 1;
    this.sim = mulberry32(s);
    this.fx = mulberry32((Math.imul(s, 2654435761) >>> 0) || 7);
  },
  s: function () { return this.sim(); },
  sr: function (a, b) { return a + this.sim() * (b - a); },
  si: function (a, b) { return Math.floor(a + this.sim() * (b - a + 1)); },
  sPick: function (arr) { return arr[Math.floor(this.sim() * arr.length)]; },
  sChance: function (p) { return this.sim() < p; },
  f: function () { return this.fx(); },
  fChance: function (p) { return this.fx() < p; },
  fr: function (a, b) { return a + this.fx() * (b - a); },
  fi: function (a, b) { return Math.floor(a + this.fx() * (b - a + 1)); }
};
RNG.seed(Date.now() & 0x7fffffff);

/* ---- settings ----------------------------------------------------------- */
var SETTINGS_DEFAULTS = {
  difficulty: 1,     /* 0 recruit, 1 commando, 2 eon */
  palette: 0,        /* 0 default, 1 deuteranopia, 2 high contrast */
  reduceMotion: 0,
  flash: 1,          /* 0..1 flash intensity */
  hudScale: 1,       /* 0.85..1.3 */
  music: 1,
  sfx: 1,
  muted: 0,
  autoFire: 0,
  pads: null
};

var SET = (function () {
  var d = {}, k, saved = Store.get('settings', null);
  for (k in SETTINGS_DEFAULTS) d[k] = SETTINGS_DEFAULTS[k];
  if (saved && typeof saved === 'object') {
    for (k in SETTINGS_DEFAULTS) if (saved[k] !== undefined) d[k] = saved[k];
  }
  return d;
})();

function saveSettings() { Store.set('settings', SET); }

/* ---- difficulty --------------------------------------------------------- */
var DIFFICULTY = [
  { name: 'RECRUIT',  hp: 6, lives: 5, dmgTaken: 0.5, enemyHp: 0.8, fireRate: 1.25, drop: 1.3 },
  { name: 'COMMANDO', hp: 4, lives: 3, dmgTaken: 1.0, enemyHp: 1.0, fireRate: 1.0,  drop: 1.0 },
  { name: 'EON',      hp: 2, lives: 1, dmgTaken: 1.5, enemyHp: 1.2, fireRate: 0.8,  drop: 0.7 }
];
function diff() { return DIFFICULTY[clamp(SET.difficulty, 0, 2)]; }

/* ---- colour schemes (accessibility) ------------------------------------- */
var SCHEMES = [
  { name: 'DEFAULT',      hostile: '#ff4d6d', hostileGlow: '#ffd0d8', elite: '#ffe08a', heal: '#54ffa8', gold: '#ffd257' },
  { name: 'DEUTERANOPIA', hostile: '#ff9d00', hostileGlow: '#ffe0a0', elite: '#ffffff', heal: '#5ad4ff', gold: '#ffffff' },
  { name: 'HIGH CONTRAST',hostile: '#ff0000', hostileGlow: '#ff9090', elite: '#ffff00', heal: '#00ff00', gold: '#ffffff' }
];
function scheme() { return SCHEMES[clamp(SET.palette, 0, 2)]; }

/* ---- local leaderboard -------------------------------------------------- */
var Scores = {
  key: 'scores',
  all: function () {
    var a = Store.get(this.key, []);
    return Array.isArray(a) ? a : [];
  },
  add: function (entry) {
    var a = this.all();
    a.push(entry);
    a.sort(function (x, y) { return y.score - x.score; });
    a = a.slice(0, 5);
    Store.set(this.key, a);
    return a;
  },
  best: function () {
    var a = this.all();
    return a.length ? a[0].score : 0;
  }
};

/* ---- lifetime stats ----------------------------------------------------- */
var Stats = {
  get: function () {
    var s = Store.get('stats', null);
    return s && typeof s === 'object' ? s : { runs: 0, kills: 0, deaths: 0, best: 0, time: 0 };
  },
  bump: function (field, by) {
    var s = this.get();
    s[field] = (s[field] || 0) + (by === undefined ? 1 : by);
    Store.set('stats', s);
    return s;
  }
};

/* ---- daily seed ----------------------------------------------------------
   Same date, same run — derived from the local date, no server involved.     */
var Daily = {
  seed: function () {
    var d = new Date();
    var str = 'EON-DAILY-' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0) || 1;
  },
  label: function () {
    var d = new Date();
    return d.getDate() + '/' + (d.getMonth() + 1);
  }
};

/* ---- input recording -----------------------------------------------------
   Only the inputs and the seed are stored. The simulation is deterministic,
   so replaying them reproduces the run exactly.                              */
var MASK_ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'fire', 'dash', 'melee', 'grenade'];

function maskOf(cur) {
  var m = 0;
  for (var i = 0; i < MASK_ACTIONS.length; i++) if (cur && cur[MASK_ACTIONS[i]]) m |= (1 << i);
  return m;
}
function actionsFromMask(m) {
  var o = {};
  for (var i = 0; i < MASK_ACTIONS.length; i++) o[MASK_ACTIONS[i]] = !!(m & (1 << i));
  return o;
}

var Rec = {
  recording: false,
  frames: [],          /* [count, mask] pairs — RLE, because input is mostly static */
  lastMask: -1,
  seed: 0,
  coop: false,
  limit: 60 * 60 * 6,  /* six minutes of frames */

  start: function (seed, coop) {
    this.recording = true;
    this.frames = [];
    this.lastMask = -1;
    this.seed = seed >>> 0;
    this.coop = !!coop;
    this.total = 0;
  },

  capture: function () {
    if (!this.recording) return;
    if (this.total >= this.limit) { this.recording = false; return; }
    this.total++;
    var m = maskOf(Input.cur) | (maskOf(Input.cur2) << 9);
    if (m === this.lastMask && this.frames.length) {
      this.frames[this.frames.length - 1][0]++;
    } else {
      this.frames.push([1, m]);
      this.lastMask = m;
    }
  },

  stop: function () {
    this.recording = false;
    return { seed: this.seed, coop: this.coop, frames: this.frames.slice(), total: this.total };
  },

  pack: function (rec) {
    return {
      seed: rec.seed,
      coop: rec.coop ? 1 : 0,
      n: rec.total,
      d: rec.frames.map(function (f) { return f[0].toString(36) + '.' + f[1].toString(36); }).join(',')
    };
  },

  unpack: function (packed) {
    if (!packed || !packed.d) return null;
    var parts = packed.d.split(','), frames = [], i;
    for (i = 0; i < parts.length; i++) {
      var ab = parts[i].split('.');
      frames.push([parseInt(ab[0], 36) || 1, parseInt(ab[1], 36) || 0]);

  save: function (rec) { Store.set('lastReplay', this.pack(rec)); },
  load: function () { return this.unpack(Store.get('lastReplay', null)); },
  has: function () { return !!Store.get('lastReplay', null); }
};

  /* ---- music ------------------------------------------------------------- */
  playMusic: function (track) {
    this.init();
    if (!this.ctx) return;
    if (this.track === track) return;
    this.track = track;
    this.step = 0;
    this.stepDur = 60 / track.bpm / 4;              // 16th notes
    this.nextTime = this.ctx.currentTime + 0.08;
    if (this.timer) return;
    var self = this;
    this.timer = setInterval(function () { self.schedule(); }, 40);
  },

  stopMusic: function () {
    this.track = null;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },

  schedule: function () {
    if (!this.ctx || !this.track) return;
    var lookahead = this.ctx.currentTime + 0.25;
    var guard = 0;
    while (this.nextTime < lookahead && guard++ < 64) {
      this.playStep(this.step, this.nextTime);
      this.nextTime += this.stepDur;
      this.step = (this.step + 1) % 16;
    }
  },

  midi: function (n) { return 440 * Math.pow(2, (n - 69) / 12); },

  playStep: function (step, time) {
    var tr = this.track;
    if (!tr || this.muted) return;
    var delay = Math.max(0, time - this.ctx.currentTime);

    var bass = tr.bass[step];
    if (bass !== null && bass !== undefined) {
      this.blip({ freq: this.midi(tr.root + bass), dur: this.stepDur * 1.7,
                  type: 'triangle', vol: 0.3, delay: delay, bus: this.musicBus });
    }
    var lead = tr.lead[step];
    if (lead !== null && lead !== undefined) {
      this.blip({ freq: this.midi(tr.root + 24 + lead), dur: this.stepDur * 1.1,
                  type: 'square', vol: 0.1, delay: delay, bus: this.musicBus });
    }
    var drum = tr.drums.charAt(step);
    if (drum === 'k') {
      this.noise({ freq: 140, dur: 0.1, vol: 0.22, filter: 'lowpass', delay: delay, bus: this.musicBus });
    } else if (drum === 's') {
      this.noise({ freq: 2000, dur: 0.09, vol: 0.13, filter: 'highpass', delay: delay, bus: this.musicBus });
    } else if (drum === 'h') {
      this.noise({ freq: 7000, dur: 0.03, vol: 0.05, filter: 'highpass', delay: delay, bus: this.musicBus });
    }
  }
};

/* ===========================================================================
   EON COMMANDO — 30 input
   One action set, three sources: keyboard, touch pads, gamepad.
   =========================================================================== */

var Input = {
  keys: {},          // physical keys currently down
  touch: {},         // on-screen buttons currently down
  pad: {},           // gamepad-derived actions
  cur: {},           // merged actions this frame (player one)
  prev: {},          // merged actions last frame
  keys2: {}, touch2: {}, pad2: {},
  cur2: {}, prev2: {},   // player two
  anyKey: false,
  anyKey: false,

  /* ---- bindings: data-driven, persisted, per player -------------------- */
  BINDINGS: null,
  rev: {}, rev2: {},
  listening: null,          /* { player, action } while rebinding */

  DEFAULTS: {
    p1: {
      left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
      jump: ['Space', 'KeyX', 'KeyK'], fire: ['KeyZ', 'KeyJ', 'ControlLeft', 'ControlRight'],
      dash: ['ShiftLeft', 'ShiftRight', 'KeyL'], melee: ['KeyV', 'KeyC'],
      grenade: ['KeyG', 'KeyB'], power: ['KeyE', 'KeyQ'], pause: ['KeyP', 'Escape'], start: ['Enter', 'NumpadEnter'],
      start2: ['Digit2'], mute: ['KeyM'], restart: ['KeyR'], fullscreen: ['KeyF'],
      settings: ['KeyO'], daily: ['KeyD'], replay: ['KeyR']
    },
    p2: {
      left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'],
      jump: ['Period'], fire: ['Comma'], dash: ['Slash'], melee: ['Semicolon'],
      grenade: ['Quote'], start: ['Digit2']
    }
  },

  loadBindings: function () {
    var saved = Store.get('bindings', null), out = {}, pl, a;
    for (pl in this.DEFAULTS) {
      out[pl] = {};
      for (a in this.DEFAULTS[pl]) {
        var v = saved && saved[pl] && saved[pl][a];
        out[pl][a] = (Array.isArray(v) && v.length) ? v.slice() : this.DEFAULTS[pl][a].slice();
      }
    }
    this.BINDINGS = out;
    this.buildMaps();
  },

  saveBindings: function () {
    Store.set('bindings', this.BINDINGS);
    this.buildMaps();
  },

  buildMaps: function () {
    this.rev = {};
    this.rev2 = {};
    var pl, a, i;
    for (pl in this.BINDINGS) {
      var target = pl === 'p1' ? this.rev : this.rev2;
      for (a in this.BINDINGS[pl]) {
        var list = this.BINDINGS[pl][a];
        for (i = 0; i < list.length; i++) {
          if (!target[list[i]]) target[list[i]] = [];
          target[list[i]].push(a);
        }
      }
    }
  },

  /* bind one key to one action, clearing it from any other action for that player */
  bind: function (player, action, code) {
    if (!code) return;
    var map = this.BINDINGS[player];
    var a, i;
    for (a in map) {
      var idx = map[a].indexOf(code);
      if (idx >= 0) map[a].splice(idx, 1);
      if (!map[a].length) map[a] = this.DEFAULTS[player][a].slice(0, 1);
    }
    map[action] = [code];
    this.saveBindings();
  },

  resetBindings: function (player) {
    var a;
    for (a in this.DEFAULTS[player]) this.BINDINGS[player][a] = this.DEFAULTS[player][a].slice();
    this.saveBindings();
  },

  MAP: {}, MAP2: {},

  ACTIONS: ['left', 'right', 'up', 'down', 'jump', 'fire', 'dash', 'melee', 'grenade',
            'start', 'start2', 'pause', 'mute', 'restart', 'fullscreen', 'settings', 'daily', 'replay', 'power'],

  init: function () {
    var self = this;
    this.loadBindings();

    window.addEventListener('keydown', function (e) {
      Snd.resume();
      self.anyKey = true;

      /* rebinding: swallow the next key press */
      if (self.listening) {
        if (e.code !== 'Escape') {
          self.bind(self.listening.player, self.listening.action, e.code);
          self.listening = null;
        }
        e.preventDefault();
        return;
      }

      var hits = self.rev[e.code];
      if (hits) {
        for (var i = 0; i < hits.length; i++) self.keys[hits[i]] = true;
        if (e.code === 'Space' || e.code.indexOf('Arrow') === 0 || e.code === 'Enter') e.preventDefault();
      }
      var hits2 = self.rev2[e.code];
      if (hits2) {
        for (var j = 0; j < hits2.length; j++) self.keys2[hits2[j]] = true;
        if (e.code === 'Period' || e.code === 'Comma') e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('keyup', function (e) {
      var hits = self.rev[e.code];
      if (hits) for (var i = 0; i < hits.length; i++) self.keys[hits[i]] = false;
      var hits2 = self.rev2[e.code];
      if (hits2) for (var j = 0; j < hits2.length; j++) self.keys2[hits2[j]] = false;
    });

    window.addEventListener('blur', function () {
      self.keys = {};
      self.touch = {};
      self.keys2 = {};
      self.touch2 = {};
    });

    /* on-screen pads -------------------------------------------------------- */
    var buttons = document.querySelectorAll('[data-k]');
    for (var i = 0; i < buttons.length; i++) {
      (function (btn) {
        var action = btn.getAttribute('data-k');
        var down = function (e) {
          e.preventDefault();
          self.touch[action] = true;
          btn.classList.add('on');
          Snd.resume();
        };
        var up = function (e) {
          if (e) e.preventDefault();
          self.touch[action] = false;
          btn.classList.remove('on');
        };
        btn.addEventListener('pointerdown', down);
        btn.addEventListener('pointerup', up);
        btn.addEventListener('pointercancel', up);
        btn.addEventListener('pointerleave', up);
        btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  },

  frame: function () {

    var cur = {}, i, a;
    for (i = 0; i < this.ACTIONS.length; i++) {
      a = this.ACTIONS[i];
      cur[a] = !!(this.keys[a] || this.touch[a] || this.pad[a]);
    }
    this.cur = cur;

    this.prev2 = this.cur2;
    var cur2 = {};
    for (i = 0; i < this.ACTIONS.length; i++) {
      a = this.ACTIONS[i];
      cur2[a] = !!(this.keys2[a] || this.touch2[a] || this.pad2[a]);

  },

  pollGamepad: function () {
    if (!navigator.getGamepads) return;

      var p = pads[i];
      if (!p) continue;
      var b = p.buttons, ax = p.axes;
      var set = seen === 0 ? this.pad : this.pad2;
      set.left = (b[14] && b[14].pressed) || ax[0] < -0.4;
      set.right = (b[15] && b[15].pressed) || ax[0] > 0.4;
      set.up = (b[12] && b[12].pressed) || ax[1] < -0.4;
      set.down = (b[13] && b[13].pressed) || ax[1] > 0.4;
      set.jump = !!(b[0] && b[0].pressed);
      set.fire = !!((b[2] && b[2].pressed) || (b[1] && b[1].pressed));
      set.dash = !!((b[5] && b[5].pressed) || (b[7] && b[7].pressed));
      set.melee = !!(b[3] && b[3].pressed);
      set.grenade = !!(b[4] && b[4].pressed);
      set.power = !!((b[6] && b[6].pressed) || (b[5] && b[5].pressed));
      set.start = !!((b[9] && b[9].pressed) || (b[8] && b[8].pressed));
      set.pause = !!(b[9] && b[9].pressed);

  /* player two reads through the same interface as player one */
  ctl2: {
    held: function (a) { return !!Input.cur2[a]; },
    pressed: function (a) { return !!Input.cur2[a] && !Input.prev2[a]; },
    axis: function () { return (Input.cur2.right ? 1 : 0) - (Input.cur2.left ? 1 : 0); }
  },

  held: function (a) { return !!this.cur[a]; },
  pressed: function (a) { return !!this.cur[a] && !this.prev[a]; },
  released: function (a) { return !this.cur[a] && !!this.prev[a]; },
  axis: function () { return (this.held('right') ? 1 : 0) - (this.held('left') ? 1 : 0); }
};

/* ---- canvas scaling ------------------------------------------------------
   Keep the 480x270 buffer crisp: scale by a whole number where possible.   */
function fitCanvas() {
  var cv = document.getElementById('c');
  if (!cv) return;

  /* the visual viewport, so mobile browser chrome is accounted for */
  var vv = window.visualViewport;
  var vw = Math.max(240, (vv ? vv.width : window.innerWidth) || 320);
  var vh = Math.max(240, (vv ? vv.height : window.innerHeight) || 320);
  var portrait = vh > vw;
  document.body.classList.toggle('portrait', portrait);

  /* logical width follows the aspect ratio */
  W = viewWidthFor(vw, vh);

  /* Portrait gets a taller canvas: the 270px world band sits at the top and the
     earth continues below it, with the thumb pads over that lower band. */
  if (portrait) {
    VIEW_H = clamp(Math.round(W * (vh / vw)), H, 900);
  } else {
    VIEW_H = H;
  }
  Y0 = 0;

  DPR = clamp(window.devicePixelRatio || 1, 1, 2);
  var wantW = Math.round(W * DPR), wantH = Math.round(VIEW_H * DPR);
  if (cv.width !== wantW || cv.height !== wantH) {
    cv.width = wantW;
    cv.height = wantH;
    var g2 = cv.getContext('2d');
    g2.imageSmoothingEnabled = false;
    if (typeof Game !== 'undefined' && Game.stage) {
      Game.camX = clamp(Game.camX, 0, Math.max(0, Game.stage.length - W));
    }
    if (typeof buildScanlines === 'function') buildScanlines();
  }

  if (PARAMS.shot) {
    var sc0 = Math.min(vw / W, vh / VIEW_H);
    cv.style.width = Math.round(W * sc0) + 'px';
    cv.style.height = Math.round(VIEW_H * sc0) + 'px';
    return;
  }

  var scale = Math.min(vw / W, vh / VIEW_H);
  if (scale <= 0) scale = 1;

  /* snap to a whole number when it costs almost nothing — crisper pixels */
  var snapped = Math.floor(scale);
  if (snapped >= 1 && snapped / scale > 0.88) scale = snapped;

  cv.style.width = Math.round(W * scale) + 'px';
  cv.style.height = Math.round(VIEW_H * scale) + 'px';
}

/* ===== 40_art.js ===== */
/* ===========================================================================
   EON COMMANDO — 40 art
   Pixel-pure, but drawn with curves: rounded caps, arcs, ellipses and bezier
   limbs instead of stacked rectangles. Everything is still on the 480x270
   grid, still asset-free, still drawn at runtime.
   =========================================================================== */

function px(g, x, y, w, h, c) {
  g.fillStyle = c;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

/* ---- curved primitives (pixel-scale friendly) --------------------------- */
function rr(g, x, y, w, h, r, c) {
  r = Math.min(r, w / 2, h / 2);
  g.fillStyle = c;
  g.beginPath();
  if (g.roundRect) {
    g.roundRect(x, y, w, h, r);
  } else {
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
  }
  g.closePath();
  g.fill();
}

function el(g, cx, cy, rx, ry, c) {
  g.fillStyle = c;
  g.beginPath();
  g.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, 6.2832);
  g.fill();
}

function circ(g, cx, cy, r, c) {
  g.fillStyle = c;
  g.beginPath();
  g.arc(cx, cy, Math.max(0.5, r), 0, 6.2832);
  g.fill();
}

/* a limb: a stroked line with round caps reads as a capsule */
function limb(g, x1, y1, x2, y2, thick, c) {
  g.strokeStyle = c;
  g.lineWidth = thick;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(x1, y1);
  g.lineTo(x2, y2);
  g.stroke();
}

function curve(g, pts, thick, c) {
  g.strokeStyle = c;
  g.lineWidth = thick;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length - 1; i += 2) {
    g.quadraticCurveTo(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
  }
  g.stroke();
}

/* soft radial glow, used for cores, muzzles and pickups */
function glow(g, cx, cy, r, c, alpha) {
  var grd = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, r));
  grd.addColorStop(0, rgba(c, alpha === undefined ? 0.55 : alpha));
  grd.addColorStop(1, rgba(c, 0));
  g.fillStyle = grd;
  g.fillRect(cx - r, cy - r, r * 2, r * 2);
}

var FONT = (function () {
  var out = {};
  for (var ch in FONT_SRC) out[ch] = FONT_SRC[ch].split('/');
  return out;
})();

function textWidth(str, scale) {
  scale = scale || 1;
  return (str.length * 6 - 1) * scale;
}

/* Text is rendered once per (string, scale, colour, shadow) into a tiny
   offscreen canvas and then blitted. Drawing glyph rects every frame costs
   hundreds of fillRects per HUD update. */
var TextCache = {}, TextCacheN = 0, TEXT_CACHE_MAX = 80;

function textCanvas(str, scale, color, shadow) {
  var key = str + '|' + scale + '|' + color + '|' + (shadow || '');
  var cv = TextCache[key];
  if (cv) return cv;

  if (TextCacheN > TEXT_CACHE_MAX) { TextCache = {}; TextCacheN = 0; }

  var w = textWidth(str, scale);
  cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.ceil(w + scale));
  cv.height = Math.max(1, 7 * scale + scale);
  var cg = cv.getContext('2d');

  function paint(ox, oy, col) {
    cg.fillStyle = col;
    for (var i = 0; i < str.length; i++) {
      var glyph = FONT[str.charAt(i)] || FONT['?'];
      var gx = ox + i * 6 * scale;
      for (var r = 0; r < 7; r++) {
        var row = glyph[r];
        for (var c = 0; c < 5; c++) {
          if (row.charAt(c) === '#') cg.fillRect(gx + c * scale, oy + r * scale, scale, scale);
        }
      }
    }
  }

  if (shadow) paint(scale, scale, shadow);
  paint(0, 0, color || '#fff');

  TextCache[key] = cv;
  TextCacheN++;
  return cv;
}

function drawText(g, str, x, y, scale, color, align, shadow) {
  scale = scale || 1;
  str = String(str).toUpperCase();
  if (!str.length) return;
  var w = textWidth(str, scale);
  if (align === 'center') x -= w / 2;
  else if (align === 'right') x -= w;
  x = Math.round(x); y = Math.round(y);
  g.drawImage(textCanvas(str, scale, color, shadow), x, y);
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---- the commando ------------------------------------------------------- */
function drawPlayer(g, p) {
  var x = Math.round(p.x), y = Math.round(p.y);
  var f = p.facing >= 0 ? 1 : -1;
  var duck = p.ducking && p.onGround;
  var hurt = p.hurtFlash > 0 && (Math.floor(p.hurtFlash / 3) % 2 === 0);
  var OL = SUIT.outline;
  function C(c) { return hurt ? '#ffffff' : c; }

  var suit = C(SUIT.suit), suitLit = C(SUIT.suitLit), suitDark = C(SUIT.suitDark);
  var armour = C(SUIT.armour), armourLit = C(SUIT.armourLit), armourDark = C(SUIT.armourDark);
  var boot = C(SUIT.boot), visor = C(SUIT.visor), visorLit = C(SUIT.visorLit);

  /* draw in local space, mirrored by the transform — curves stay symmetrical */
  g.save();
  g.translate(f > 0 ? x : x + 12, y);
  g.scale(f, 1);

  if (duck) {
    /* crouched: low, coiled, still reads as a soldier */
    limb(g, 3, 12, 2, 13, 4, suitDark);
    limb(g, 9, 12, 10, 13, 4, suitDark);
    rr(g, 1, 6, 10, 6, 2.5, armour);
    rr(g, 1, 6, 10, 2, 1.5, armourLit);
    rr(g, 0.5, 9, 3, 3, 1.2, suit);
    circ(g, 6, 3.4, 3.4, suit);
    rr(g, 4, 1.6, 6, 3.4, 1.6, suit);
    rr(g, 4.4, 1.8, 5.2, 1.2, 0.6, suitLit);
    rr(g, 5.5, 2.6, 4, 1.6, 0.8, visor);
    px(g, 6.5, 2.6, 2, 0.9, visorLit);
    rr(g, 0.6, 12, 4.4, 2, 0.8, boot);
    rr(g, 7, 12, 4.4, 2, 0.8, boot);
  } else {
    /* legs — capsule thighs and shins with a real run cycle */
    var swing = p.onGround ? Math.sin(p.runPhase * Math.PI * 2) : 0.55;
    var lift = p.onGround ? Math.max(0, Math.cos(p.runPhase * Math.PI * 2)) : 0;
    var backX = 5 - swing * 2.2, frontX = 7 + swing * 2.2;
    var backLift = Math.max(0, -swing) * 2.4, frontLift = Math.max(0, swing) * 2.4;

    limb(g, 5, 15, backX, 20 - backLift, 3.2, suitDark);
    limb(g, 7, 15, frontX, 20 - frontLift, 3.2, suit);
    rr(g, backX - 2, 19 - backLift, 4.2, 2.2, 0.9, boot);
    rr(g, frontX - 1.4, 19 - frontLift, 4.6, 2.2, 0.9, boot);

    /* backpack */
    rr(g, 0.2, 9, 2.2, 5.4, 1, suitDark);

    /* torso */
    rr(g, 1.4, 8, 9.2, 7.4, 2.6, armour);
    rr(g, 1.4, 8, 9.2, 2.6, 1.6, armourLit);
    rr(g, 3.4, 11.4, 5.4, 1.4, 0.7, suit);
    rr(g, 1.6, 13.4, 8.8, 1.2, 0.6, armourDark);

    /* shoulder pad */
    rr(g, 1, 8, 3.4, 3.2, 1.5, armour);
    px(g, 1.8, 8.6, 1.8, 0.9, armourLit);

    /* neck + helmet */
    rr(g, 4.2, 6.2, 3.6, 2, 0.9, suitDark);
    circ(g, 6, 3.6, 3.5, suit);
    rr(g, 3.2, 1.2, 6.2, 4.4, 2, suit);
    rr(g, 3.8, 1.4, 5, 1.2, 0.6, suitLit);
    /* crest */
    rr(g, 5.4, 0.2, 2.4, 1.4, 0.7, armour);

    /* visor, angled with the aim */
    var vis = clamp(p.aimAngle, -1.1, 1.1);
    g.save();
    g.translate(6.4, 3.4);
    g.rotate(vis * 0.22);
    rr(g, -1.4, -1.1, 5, 2.2, 1.1, visor);
    px(g, 0.2, -0.9, 2.2, 0.8, visorLit);
    g.restore();
  }
  g.restore();

  /* arm + weapon in world space, because the aim angle already has facing in it */
  var shoulderX = f > 0 ? x + 8 : x + 4;
  var shoulderY = y + (duck ? 8 : 10.5);
  var handX = shoulderX + Math.cos(p.aimAngle) * 5.5;
  var handY = shoulderY + Math.sin(p.aimAngle) * 5.5;
  limb(g, shoulderX, shoulderY, handX, handY, 2.6, hurt ? '#ffffff' : SUIT.suit);

  g.save();
  g.translate(handX, handY);
  g.rotate(p.aimAngle);
  rr(g, -1, -1.4, 8.4, 2.8, 1.2, SUIT.outline);
  rr(g, -0.4, -0.9, 7.4, 1.8, 0.8, hurt ? '#ffffff' : SUIT.gun);
  px(g, -0.4, -0.9, 7, 0.7, hurt ? '#ffffff' : '#d6e2ec');
  rr(g, 3.4, -1.8, 4.4, 3.4, 1.2, SUIT.outline);
  rr(g, 3.8, -1.3, 3.4, 2.4, 0.9, SUIT.gunDark);
  if (p.muzzle > 0) {
    glow(g, 9, 0, 7, '#ffb545', 0.55);
    rr(g, 8, -1.6, 4, 3.2, 1.4, '#ffe9a8');
    rr(g, 9.4, -0.9, 3, 1.8, 0.9, '#fff8e0');
  }
  g.restore();
}

function drawGrunt(g, e) {
  var P = palFor(e), OL = '#120810';

  function C(c) { return flash ? '#ffffff' : c; }
  var x = Math.round(e.x), y = Math.round(e.y);
  var f = e.facing >= 0 ? 1 : -1;
  var s = e.scale || 1;

  g.save();
  g.translate(f > 0 ? x + 6 : x + 6, y + e.h);
  g.scale(f * s, s);
  g.translate(-6, -18);

  /* legs */
  var swing = Math.sin(e.walkPhase * Math.PI * 2) * 1.8;
  limb(g, 5, 13, 4.4 - swing * 0.4, 17 + swing * 0.3, 2.6, C(P.bodyDark));
  limb(g, 7, 13, 7.6 + swing * 0.4, 17 - swing * 0.3, 2.6, C(P.bodyDark));

  /* body */
  rr(g, 1.6, 5, 8.8, 8.6, 2.8, C(P.body));
  rr(g, 1.6, 5, 8.8, 2.4, 1.4, C(P.bodyLit));
  rr(g, 3, 8.6, 6, 1.2, 0.6, C(P.bodyDark));

  /* rifle */
  limb(g, 8, 10, 14, 9.4, 1.8, C(P.metal));
  px(g, 12.4, 8.6, 1.6, 2, C(P.metalLit));

  /* arms */
  limb(g, 8.2, 8, 10.4, 9.6, 2, C(P.body));

  circ(g, 6, 3.2, 3.2, C(P.metal));
  rr(g, 2.9, 0.6, 6.2, 3.4, 1.7, C(P.metal));
  rr(g, 3.3, 0.8, 5.4, 1, 0.5, C(P.metalLit));
  rr(g, 4.4, 2.4, 3.6, 1.6, 0.8, C(P.eye));
  px(g, 5.2, 2.4, 1.6, 0.8, C(P.eyeLit));
  if (e.elite) {
    rr(g, 2.6, -0.4, 1.4, 1.6, 0.6, '#ffe08a');

}

function drawRunner(g, e) {

function drawDrone(g, e) {

  var x = Math.round(e.x), y = Math.round(e.y);
  var bob = Math.sin(e.age * 0.12) * 1.4;
  var cx = x + 8, cy = y + 5 + bob;
  var s = e.scale || 1;

  glow(g, cx, cy, 13, C(P.eye), 0.16);

  g.save();
  g.translate(cx, cy);
  g.scale(s, s);

  /* rotor arms */
  limb(g, -9, -2, -4, -1, 1.2, C(P.metal));
  limb(g, 9, -2, 4, -1, 1.2, C(P.metal));
  var spin = Math.floor(e.age / 3) % 2 === 0 ? 4.4 : 2.6;
  el(g, -9, -2.6, spin, 0.9, '#8fa4b8');
  el(g, 9, -2.6, spin, 0.9, '#8fa4b8');

  /* hull */
  el(g, 0, 0, 8, 4.6, C(P.metal));
  el(g, 0, -1.2, 6.4, 2.6, C(P.metalLit));
  rr(g, -3, -4.4, 6, 2.4, 1.2, C(P.metal));

  /* eye */
  circ(g, 0, 0.8, 2.4, C(P.eye));
  circ(g, -0.4, 0.2, 1.1, C(P.eyeLit));
  g.restore();
}

function drawWarden(g, b) {

function drawWraith(g, b) {
  var flash = b.flash > 0 && (Math.floor(b.flash / 2) % 2 === 0);
  function C(c) { return flash ? '#ffffff' : c; }
  var x = Math.round(b.x), y = Math.round(b.y);
  var w = b.w, h = b.h;
  var flap = Math.sin(b.age * 0.14) * 6;
  var shell = C('#2b6f8f'), shellLit = C('#7fe3ff'), dark = '#08131c';
  var cx = x + w / 2, cy = y + h / 2;

  /* wings — bezier membranes */
  g.save();
  g.fillStyle = shell;
  g.beginPath();
  g.moveTo(cx - 12, cy - 2);
  g.quadraticCurveTo(cx - 34, cy - 16 + flap, cx - 46, cy - 2 + flap);
  g.quadraticCurveTo(cx - 30, cy + 2 + flap, cx - 12, cy + 8);
  g.closePath();
  g.fill();
  g.beginPath();
  g.moveTo(cx + 12, cy - 2);
  g.quadraticCurveTo(cx + 34, cy - 16 - flap, cx + 46, cy - 2 - flap);
  g.quadraticCurveTo(cx + 30, cy + 2 - flap, cx + 12, cy + 8);
  g.closePath();
  g.fill();
  g.restore();
  limb(g, cx - 14, cy - 1, cx - 42, cy - 4 + flap, 1.6, shellLit);
  limb(g, cx + 14, cy - 1, cx + 42, cy - 4 - flap, 1.6, shellLit);

  /* body */
  el(g, cx, cy, w / 2 - 6, h / 2 - 6, dark);
  el(g, cx, cy, w / 2 - 8, h / 2 - 8, shell);
  el(g, cx, cy - 6, w / 2 - 12, 4, shellLit);

  /* crystal core */
  glow(g, cx, cy + 4, 24, b.phase === 2 ? '#ff5c3c' : '#bff4ff', 0.45);
  circ(g, cx, cy + 4, 8, dark);
  circ(g, cx, cy + 4, 6, b.phase === 2 ? '#ff5c3c' : '#bff4ff');
  circ(g, cx, cy + 4, 2.6, '#ffffff');

  /* eyes */
  circ(g, cx - 13, cy - 8, 2.4, dark);
  circ(g, cx + 13, cy - 8, 2.4, dark);
  circ(g, cx - 13, cy - 8, 1.3, '#ff4d6d');
  circ(g, cx + 13, cy - 8, 1.3, '#ff4d6d');
}

function drawHeart(g, b) {
  var flash = b.flash > 0 && (Math.floor(b.flash / 2) % 2 === 0);
  function C(c) { return flash ? '#ffffff' : c; }
  var x = Math.round(b.x), y = Math.round(b.y);
  var cx = x + b.w / 2, cy = y + b.h / 2;
  var spin = b.age * 0.04;
  var pulse = 1 + Math.sin(b.age * 0.16) * 0.08;

  /* orbiting nodes */
  for (var i = 0; i < 3; i++) {
    var a = spin + i * Math.PI * 2 / 3;
    var ox = cx + Math.cos(a) * (b.w / 2 - 5);
    var oy = cy + Math.sin(a) * (b.h / 4);
    circ(g, ox, oy, 4.4, '#0a0e16');
    circ(g, ox, oy, 3.4, C('#c9a227'));
    circ(g, ox, oy, 1.6, '#ffe9a8');
  }

  /* shell */
  circ(g, cx, cy, 26, '#0a0e16');
  circ(g, cx, cy, 24, C('#3a1030'));
  el(g, cx, cy - 12, 20, 8, C('#6b1d4f'));

  /* the heart */
  glow(g, cx, cy, 34, b.phase === 2 ? '#ff3b2f' : '#ff2d95', 0.5);
  circ(g, cx, cy, 15 * pulse, b.phase === 2 ? '#ff5c3c' : '#ff2d95');
  circ(g, cx, cy, 9 * pulse, '#ffd0e4');
  circ(g, cx, cy, 4.4 * pulse, '#ffffff');
}

function drawMeleeArc(g, p, camX) {
  var cx = p.x - camX + p.w / 2, cy = p.y + p.h / 2;

function drawDashGhost(g, gh, camX) {

/* THE DROWNED RELAY — a sunken pylon with a single glowing eye */
function drawRelay(g, b) {
  var x = Math.round(b.x), y = Math.round(b.y);
  var lit = b.flash > 0;
  var body = lit ? '#ffffff' : '#1d4a44';
  var rim = lit ? '#ffffff' : '#3f8f74';
  var eye = lit ? '#ffffff' : (b.phase === 2 ? '#ff4d6d' : '#54ffa8');

  /* base plinth */
  rr(g, x - 6, y + b.h - 12, b.w + 12, 12, 3, lit ? '#fff' : '#123029');
  rr(g, x - 4, y + b.h - 12, b.w + 8, 3, 1.5, rim);

  /* mast */
  rr(g, x + b.w / 2 - 9, y + 20, 18, b.h - 32, 6, body);
  rr(g, x + b.w / 2 - 9, y + 20, 4, b.h - 32, 2, rim);

  /* head */
  rr(g, x, y + 4, b.w, 22, 8, body);
  rr(g, x + 2, y + 6, b.w - 4, 4, 2, rim);

  /* the eye */
  el(g, x + b.w / 2, y + 17, 8, 6, '#06110f');
  el(g, x + b.w / 2, y + 17, 5.5, 4, eye);
  if (!lit) el(g, x + b.w / 2 - 1.5, y + 15.5, 2, 1.4, '#ffffff');

  /* antennae */
  limb(g, x + 8, y + 4, x + 2, y - 12, 2, rim);
  limb(g, x + b.w - 8, y + 4, x + b.w - 2, y - 12, 2, rim);
  el(g, x + 2, y - 12, 2, 2, eye);
  el(g, x + b.w - 2, y - 12, 2, 2, eye);
}

/* ORBIT WRECK — a station core with a spinning ring */
function drawOrbit(g, b) {
  var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  var lit = b.flash > 0;
  var body = lit ? '#ffffff' : '#2a2450';
  var rim = lit ? '#ffffff' : '#8a7bff';
  var core = lit ? '#ffffff' : (b.phase === 2 ? '#ff4d6d' : '#c9c2ff');

  /* ring, rotated by age */
  g.save();
  g.translate(cx, cy);
  g.rotate(b.age * 0.02);
  g.strokeStyle = rim;
  g.lineWidth = 3;
  g.beginPath();
  g.ellipse(0, 0, b.w * 0.62, b.h * 0.30, 0, 0, Math.PI * 2);
  g.stroke();
  /* ring nodes */
  for (var i = 0; i < 4; i++) {
    var a = i * Math.PI / 2;
    el(g, Math.cos(a) * b.w * 0.62, Math.sin(a) * b.h * 0.30, 2.5, 2.5, core);
  }
  g.restore();

  /* hull */
  el(g, cx, cy, b.w * 0.40, b.h * 0.40, body);
  el(g, cx, cy, b.w * 0.30, b.h * 0.30, lit ? '#ffffff' : '#171233');
  el(g, cx, cy, b.w * 0.16, b.h * 0.16, core);
  /* plating */
  limb(g, cx - b.w * 0.30, cy, cx + b.w * 0.30, cy, 2, rim);
}

/* THE LAST SECOND — a clock face with two hands */
function drawClock(g, b) {
  var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  var r = b.w / 2;
  var lit = b.flash > 0;
  var body = lit ? '#ffffff' : '#241d12';
  var rim = lit ? '#ffffff' : '#b08a3a';
  var hand = lit ? '#ffffff' : (b.phase === 2 ? '#ff4d6d' : '#ffd257');

  el(g, cx, cy, r, r, body);
  g.strokeStyle = rim;
  g.lineWidth = 3;
  g.beginPath();
  g.arc(cx, cy, r - 2, 0, Math.PI * 2);
  g.stroke();

  /* ticks */
  for (var i = 0; i < 12; i++) {
    var a = i * Math.PI / 6;
    var inner = r - (i % 3 === 0 ? 12 : 7);
    limb(g, cx + Math.cos(a) * inner, cy + Math.sin(a) * inner,
         cx + Math.cos(a) * (r - 4), cy + Math.sin(a) * (r - 4),
         i % 3 === 0 ? 2 : 1, rim);
  }

  /* hands */
  limb(g, cx, cy, cx + Math.cos(b.angle) * (r - 10), cy + Math.sin(b.angle) * (r - 10), 3, hand);
  limb(g, cx, cy, cx + Math.cos(b.angle2) * (r - 20), cy + Math.sin(b.angle2) * (r - 20), 2, hand);
  el(g, cx, cy, 4, 4, hand);
}

    desc: 'TAKE 20% LESS DAMAGE.', color: '#9fe8d6' },
  { id: 'reserve', name: 'RESERVE', tag: 'LIVES',
    desc: '+1 LIFE.', color: '#ff2d95' }
];

/* ===== 60_entities.js ===== */
/* ===========================================================================
   EON COMMANDO — 60 entities
   The commando, five enemy archetypes, three bosses, bullets and debris.
   =========================================================================== */

var PHYS = {
  grav: 0.52, maxFall: 11.5,
  runAcc: 0.58, runMax: 2.55, friction: 0.62, airAcc: 0.42,
  jumpV: -7.7, jumpCut: -3.2, coyote: 6, buffer: 7
};

/* ---- world collision ---------------------------------------------------- */
function groundRects() {
  var segs = Game.stage.groundSegs, out = [], i;
  for (i = 0; i < segs.length; i++) {
    out.push({ x: segs[i][0], y: GROUND_Y, w: segs[i][1], h: H - GROUND_Y + 60 });
  }
  if (Game.gate) out.push(Game.gate);
  return out;
}
function platformRects() {
  var plats = Game.stage.platforms, out = [], i;
  for (i = 0; i < plats.length; i++) {
    out.push({ x: plats[i].x, y: plats[i].y, w: plats[i].w, h: 8 });
  }
  return out;
}
function supportedAt(x, y) {
  var i, segs = Game.stage.groundSegs;
  if (y >= GROUND_Y - 2 && y <= GROUND_Y + 6) {
    for (i = 0; i < segs.length; i++) if (x >= segs[i][0] && x <= segs[i][0] + segs[i][1]) return true;
  }
  var plats = Game.stage.platforms;
  for (i = 0; i < plats.length; i++) {
    if (Math.abs(plats[i].y - (y - 2)) < 8 && x >= plats[i].x && x <= plats[i].x + plats[i].w) return true;
  }
  return false;
}

/* move an entity, resolving against solids and one-way platforms */
function moveEntity(e, solids, oneways, corner) {
  var i, r;
  e.x += e.vx;
  for (i = 0; i < solids.length; i++) {
    r = solids[i];
    if (aabb(e, r)) {
      if (e.vx > 0) e.x = r.x - e.w;
      else if (e.vx < 0) e.x = r.x + r.w;
      e.vx = 0;
    }
  }

  var prevBottom = e.y + e.h;
  e.y += e.vy;
  e.onGround = false;
  for (i = 0; i < solids.length; i++) {
    r = solids[i];
    if (aabb(e, r)) {
      if (e.vy > 0) { e.y = r.y - e.h; e.onGround = true; e.vy = 0; }
      else if (e.vy < 0) {
        /* corner correction: slide around a ledge instead of bonking your head */
        var pokeL = (e.x + e.w) - r.x;
        var pokeR = (r.x + r.w) - e.x;
        var least = Math.min(pokeL, pokeR);
        if (corner && least > 0 && least <= 4.5) {
          e.x += (pokeL < pokeR) ? -pokeL : pokeR;
        } else {
          e.y = r.y + r.h;
          e.vy = 0;
        }
      }
    }
  }
  if (e.vy >= 0 && oneways) {
    for (i = 0; i < oneways.length; i++) {
      r = oneways[i];
      if (e.x + e.w > r.x + 1 && e.x < r.x + r.w - 1 &&
          prevBottom <= r.y + 1 && e.y + e.h >= r.y) {
        e.y = r.y - e.h;
        e.vy = 0;
        e.onGround = true;
      }
    }
  }
}

/* ---- player helpers ----------------------------------------------------- */
function livePlayers() {
  var out = [], i;
  for (i = 0; i < Game.players.length; i++) {
    var p = Game.players[i];
    if (p && !p.dead && !p.downed) out.push(p);
  }
  return out.length ? out : (Game.player ? [Game.player] : []);
}

function nearestPlayer(x, y) {
  var list = livePlayers(), best = list[0], bd = Infinity, i;
  for (i = 0; i < list.length; i++) {
    var d = dist2(x, y, list[i].x + list[i].w / 2, list[i].y + list[i].h / 2);
    if (d < bd) { bd = d; best = list[i]; }
  }
  return best;
}

/* smallest signed difference between two angles */
function angDiff(a, b) {
  var d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

/* the nearest thing worth shooting, if it is roughly where you are aiming.
   Auto-fire aims for you; it does not decide *what* you are pointing at. */
function autoTarget(p) {
  var best = null, bestD = 210 * 210;
  var ox = p.x + p.w / 2;
  var oy = p.y + (p.ducking ? 8 : 10);
  var list = Game.enemies, i, e;

  for (var pass = 0; pass < 2; pass++) {
    if (pass === 1) {
      if (!Game.boss || Game.boss.dead) break;
      list = [Game.boss];
    }
    for (i = 0; i < list.length; i++) {
      e = list[i];
      if (!e || e.dead) continue;
      var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
      var dx = cx - ox, dy = cy - oy;
      var d2 = dx * dx + dy * dy;
      if (d2 > 210 * 210 || d2 > bestD) continue;
      var a = Math.atan2(dy, dx);
      if (SET.autoFire) {
        /* no manual vertical aim: accept anything on the facing side */
        if (dx * p.facing < -12) continue;
      } else if (Math.abs(angDiff(a, p.aimAngle)) > 0.55) {
        continue;   /* ~31 deg, matching 8-way aim */
      }
      bestD = d2;
      best = { angle: a, target: e };
    }
  }
  return best;
}

/* ---- the commando ------------------------------------------------------- */
function makePlayer(x, y) {
  var pl = {
    x: x, y: y, w: 12, h: 22,
    vx: 0, vy: 0, facing: 1,
    onGround: false, ducking: false, runPhase: 0,
    aimAngle: 0, muzzle: 0,
    hp: 4, maxHp: 4,
    invuln: 90, hurtFlash: 0,
    coyote: 0, jumpBuffer: 0, jumpHeld: false,
    weapon: 'rifle', cd: 0,
    dashT: 0, dashCd: 0, dashDir: 1,
    meleeT: 0, meleeCd: 0,
    grenades: 3, maxGrenades: 3,
    ctl: null, downed: false, downTimer: 0, reviveT: 0, autoAiming: false,
    dead: false, deadTimer: 0,
    spawnX: x, spawnY: y
  };

  return pl;
}

function setDuck(p, want) {
  if (want === p.ducking) return;
  if (want) {
    p.y += p.h - 14;
    p.h = 14;
  } else {
    /* only stand up when there is room */
    var test = { x: p.x, y: p.y - 8, w: p.w, h: 22 };
    var solids = groundRects();
    for (var i = 0; i < solids.length; i++) if (aabb(test, solids[i])) return;
    p.y -= 8;
    p.h = 22;
  }
  p.ducking = want;
}

function playerUpdate(p) {
  var solids = groundRects(), oneways = platformRects();
  var ctl = p.ctl || Input;

  /* downed in co-op: no control, but still subject to gravity and the floor */
  if (p.downed) {
    p.downTimer--;
    p.vx *= 0.9;
    p.vy = Math.min(p.vy + PHYS.grav, PHYS.maxFall);
    moveEntity(p, solids, oneways, false);
    return;
  }

  if (p.dead) {
    p.deadTimer++;
    p.vy = Math.min(p.vy + PHYS.grav, PHYS.maxFall);
    p.y += p.vy;
    p.x += p.vx;
    p.vx *= 0.96;
    return;
  }

  var ax = ctl.axis();
  var wantDuck = ctl.held('down') && p.onGround;
  setDuck(p, wantDuck);

  /* horizontal */
  if (ax !== 0 && !p.ducking) {
    var acc = p.onGround ? PHYS.runAcc : PHYS.airAcc;
    p.vx = approach(p.vx, ax * PHYS.runMax, acc);
    p.facing = ax;
  } else {
    p.vx = approach(p.vx, 0, p.onGround ? PHYS.friction : PHYS.friction * 0.25);
  }

  /* jump with coyote time + input buffering + variable height */
  if (p.onGround) p.coyote = PHYS.coyote; else if (p.coyote > 0) p.coyote--;
  if (ctl.pressed('jump') || (SET.autoFire && ctl.pressed('up'))) p.jumpBuffer = PHYS.buffer;
  else if (p.jumpBuffer > 0) p.jumpBuffer--;

  if (p.jumpBuffer > 0 && p.coyote > 0) {
    p.vy = PHYS.jumpV;
    p.onGround = false;
    p.coyote = 0;
    p.jumpBuffer = 0;
    p.jumpHeld = true;
    Snd.sfx('jump');
    puff(p.x + p.w / 2, p.y + p.h, 5, '#c8d6e2');
  }
  if (p.jumpHeld && !(ctl.held('jump') || (SET.autoFire && ctl.held('up'))) && p.vy < PHYS.jumpCut) {
    p.vy = PHYS.jumpCut;
    p.jumpHeld = false;
  }
  if (p.onGround) p.jumpHeld = false;

  /* dash — short, invulnerable, horizontal */
  if (p.dashCd > 0) p.dashCd--;
  if (ctl.pressed('dash') && p.dashCd <= 0 && !p.ducking) {
    p.dashT = 10;
    p.dashCd = Math.round(42 * (Game.dashMul || 1));
    p.dashDir = p.facing;
    p.vy = 0;
    Snd.sfx('dash');
    Game.shake = Math.max(Game.shake, 2);
  }
  if (p.dashT > 0) {
    p.dashT--;
    p.vx = p.dashDir * 6.4;
    p.vy = Math.min(p.vy, 0.3);
    if (p.dashT % 2 === 0) {
      Game.ghosts.push({ x: p.x, y: p.y, w: p.w, h: p.h, life: 10, max: 10 });
    }
  }

  /* melee — a short arc that solves "enemy on top of me" */
  if (p.meleeCd > 0) p.meleeCd--;
  if (ctl.pressed('melee') && p.meleeCd <= 0) {
    p.meleeT = 9;
    p.meleeCd = 26;
    Snd.sfx('melee');
    var reach = 19;
    var box = {
      x: p.facing > 0 ? p.x + p.w - 2 : p.x - reach + 2,
      y: p.y + 3, w: reach, h: p.h - 6
    };
    var struck = false, i;
    for (i = 0; i < Game.enemies.length; i++) {
      var en = Game.enemies[i];
      if (!en.dead && aabb(box, en)) { damageEnemy(en, 3, p.facing * 2); struck = true; }
    }
    if (Game.boss && !Game.boss.dead && aabb(box, Game.boss)) {
      damageBoss(Game.boss, 4); struck = true;
    }
    if (struck) {
      Game.hitStop = 3;
      Game.shake = Math.max(Game.shake, 3);
    }
  }
  if (p.meleeT > 0) p.meleeT--;

  /* grenades */
  if (ctl.pressed('grenade') && p.grenades > 0) {
    p.grenades--;
    spawnGrenade(p);
    Snd.sfx('throw');
  }

  /* gravity */
  p.vy = Math.min(p.vy + PHYS.grav, PHYS.maxFall);

  var wasAir = !p.onGround;
  moveEntity(p, solids, oneways, true);
  if (wasAir && p.onGround) {
    puff(p.x + p.w / 2, p.y + p.h, 3, '#8fa4b8');
    if (p.vy > 6) Snd.sfx('land');
  }

  /* keep the commando inside the level */
  if (p.x < 2) { p.x = 2; if (p.vx < 0) p.vx = 0; }
  var maxX = Game.stage.length - p.w - 2;
  if (p.x > maxX) { p.x = maxX; if (p.vx > 0) p.vx = 0; }

  /* animation */
  if (p.onGround && Math.abs(p.vx) > 0.2) p.runPhase += Math.abs(p.vx) * 0.055;
  else if (p.onGround) p.runPhase = 0;

  /* aim direction */
  var up = ctl.held('up'), down = ctl.held('down');
  var axAim = 0, ayAim = 0;
  if (up) ayAim = -1;
  else if (down && !p.onGround) ayAim = 1;
  if (up || (down && !p.onGround)) {
    if (ctl.held('left')) axAim = -1;
    else if (ctl.held('right')) axAim = 1;
  } else {
    axAim = p.facing;
  }
  if (axAim === 0 && ayAim === 0) axAim = p.facing;
  p.aimAngle = Math.atan2(ayAim, axAim);

  /* firing — manual, or automatic when a target sits inside the aim cone */
  if (p.cd > 0) p.cd--;
  if (p.muzzle > 0) p.muzzle--;
  var wantFire = ctl.held('fire');
  var fireAngle = null;
  if (SET.autoFire && !wantFire) {
    var aim = autoTarget(p);
    if (aim) {
      /* the arm swings toward the target for looks; the shot goes where it aims */
      p.aimAngle += angDiff(aim.angle, p.aimAngle) * 0.45;
      fireAngle = aim.angle;
      p.autoAiming = true;
      wantFire = true;
    } else {
      p.autoAiming = false;
    }
  } else {
    p.autoAiming = false;
  }
  if (wantFire && p.cd <= 0) fireWeapon(p, fireAngle);

  /* timers */
  if (p.invuln > 0) p.invuln--;
  if (p.hurtFlash > 0) p.hurtFlash--;

  /* fell into a chasm */
  if (p.y > H + 60) {
    p.hp = 0;
    killPlayer(p);
  }
}

function fireWeapon(p, angleOverride) {
  var w = WEAPONS[p.weapon];
  var base = (angleOverride === undefined || angleOverride === null) ? p.aimAngle : angleOverride;
  var cdBase = w.cd * (Game.cdMul || 1);
  p.cd = Game.fury > 0 ? Math.max(2, Math.round(cdBase * 0.45)) : Math.round(cdBase);
  p.muzzle = 4;
  Snd.sfx(w.sfx);
  var ox = p.x + p.w / 2 + Math.cos(base) * 9;
  var oy = p.y + (p.ducking ? 8 : 10) + Math.sin(base) * 9;

  for (var i = 0; i < w.shots; i++) {
    var a = base;
    if (w.shots > 1) a += (i - (w.shots - 1) / 2) * w.spread;
    a += RNG.sr(-w.jitter, w.jitter);
    spawnBullet({
      x: ox, y: oy, vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed,
      dmg: Math.max(1, Math.round(w.dmg * (Game.dmgMul || 1))), friendly: true, color: w.color, glow: w.glow,
      w: w.w, h: w.h, pierce: w.pierce, life: w.life, angle: a
    });
  }
  /* recoil shove */
  p.vx -= Math.cos(base) * (w.name === 'LASER' ? 0.6 : 0.14);
}

function playerHurt(p, dmg) {
  if (p.invuln > 0 || p.dead || p.dashT > 0) return;
  amount = Math.max(1, Math.round(amount * (Game.takenMul || 1)));
  dmg = dmg * diff().dmgTaken;
  p.hp -= dmg;
  p.hurtFlash = 24;
  p.invuln = 80;
  Game.shake = Math.max(Game.shake, 5);
  Snd.sfx('hurt');
  if (p.hp <= 0) killPlayer(p);
}

function killPlayer(p) {
  if (p.dead || p.downed) return;

  /* with a partner still standing, go down instead of dying */
  var partnerUp = false;
  for (var i = 0; i < Game.players.length; i++) {
    var q = Game.players[i];
    if (q !== p && q && !q.dead && !q.downed) partnerUp = true;
  }
  if (Game.coop && partnerUp) {
    p.downed = true;
    p.downTimer = 360;
    p.reviveT = 0;
    p.hp = 0;
    p.vx = 0;
    p.vy = -2.4;
    Game.shake = 6;
    Snd.sfx('death');
    floatText(p.x, p.y - 8, 'DOWN', '#ff4d6d');
    return;
  }

  p.dead = true;
  p.deadTimer = 0;
  p.hp = 0;
  p.vx = -p.facing * 1.6;
  p.vy = -4.5;
  Snd.sfx('death');
  Game.shake = 9;
  burst(p.x + p.w / 2, p.y + p.h / 2, 26, ['#ff5c3c', '#ffb545', '#ffffff']);
}

/* ---- bullets ------------------------------------------------------------ */
function spawnBullet(o) {
  o.life = o.life || 90;
  o.pierce = o.pierce || 0;
  o.hits = 0;
  Game.bullets.push(o);
  return o;
}

function bulletUpdate(b) {
  b.x += b.vx;
  b.y += b.vy;
  b.life--;
  if (b.life <= 0) { b.dead = true; return; }
  if (b.x < -40 || b.x > Game.stage.length + 40 || b.y < -60 || b.y > H + 60) { b.dead = true; return; }

  var box = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };

  /* terrain */
  var solids = groundRects(), i;
  for (i = 0; i < solids.length; i++) {
    if (aabb(box, solids[i])) {
      b.dead = true;
      spark(b.x, b.y, b.color);
      return;
    }
  }
  if (b.friendly) {
    /* enemy bullets are blocked by platforms; yours pass through thin ones */
    for (i = 0; i < Game.enemies.length; i++) {
      var e = Game.enemies[i];
      if (e.dead) continue;
      /* broad phase: skip anything the bullet cannot possibly touch */
      if (e.x > b.x + 40 || e.x + e.w < b.x - 40) continue;
      if (aabb(box, e)) {
        damageEnemy(e, b.dmg, b.vx);
        b.hits++;
        if (b.hits > b.pierce) { b.dead = true; spark(b.x, b.y, b.color); return; }
      }
    }
    var boss = Game.boss;
    if (boss && !boss.dead && aabb(box, boss)) {
      damageBoss(boss, b.dmg, b.x, b.y);
      b.hits++;
      if (b.hits > b.pierce) { b.dead = true; spark(b.x, b.y, b.color); return; }
    }
  } else {
    var p = Game.player;
    if (!p.dead && aabb(box, { x: p.x, y: p.y, w: p.w, h: p.h })) {
      playerHurt(p, b.dmg || 1);
      b.dead = true;
      spark(b.x, b.y, b.color);
    }
  }
}

/* ---- particles ---------------------------------------------------------- */
function spawnParticle(o) {
  o.life = o.life || 20;
  o.maxLife = o.life;
  o.grav = o.grav === undefined ? 0.06 : o.grav;
  Game.particles.push(o);
}
function spark(x, y, color) {
  for (var i = 0; i < 4; i++) {
    spawnParticle({
      x: x, y: y, vx: rnd(-1.4, 1.4), vy: rnd(-1.4, 0.6),
      life: rndi(8, 16), color: color, size: 1, grav: 0.04
    });
  }
}
function burst(x, y, n, colors) {
  for (var i = 0; i < n; i++) {
    var a = rnd(0, Math.PI * 2), s = rnd(0.4, 3.2);
    spawnParticle({
      x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.6,
      life: rndi(16, 40), color: pick(colors), size: rndi(1, 3), grav: 0.08
    });
  }
}
function puff(x, y, n, color) {
  for (var i = 0; i < n; i++) {
    spawnParticle({
      x: x, y: y, vx: rnd(-0.7, 0.7), vy: rnd(-0.5, 0.2),
      life: rndi(8, 18), color: color, size: 1, grav: 0.02
    });
  }
}
function explosion(x, y, size) {
  burst(x, y, 16 + size * 6, ['#ffb545', '#ff5c3c', '#ffe9a8', '#ffffff']);
  for (var i = 0; i < 3 + size; i++) {
    spawnParticle({
      x: x + rnd(-8, 8), y: y + rnd(-8, 8), vx: rnd(-0.4, 0.4), vy: rnd(-1.2, -0.2),
      life: rndi(20, 34), color: '#4a5568', size: rndi(2, 4), grav: -0.02, smoke: true
    });
  }
  Game.shake = Math.max(Game.shake, 3 + size);
}

function particleUpdate(pt) {
  pt.x += pt.vx;
  pt.y += pt.vy;
  pt.vy += pt.grav;
  pt.vx *= 0.985;
  pt.life--;
  if (pt.life <= 0) pt.dead = true;
}

/* ---- pickups ------------------------------------------------------------ */
function spawnPickup(o) {
  Game.pickups.push({
    kind: o.kind, w: o.w, label: o.label, x: o.x, y: o.y,
    baseY: o.y, age: rnd(0, 60), vy: 0, dead: false
  });
}
function pickupUpdate(c) {
  c.age++;
  c.y = c.baseY + Math.sin(c.age * 0.06) * 3;
  var p = null, pi;
  for (pi = 0; pi < Game.players.length; pi++) {
    var cand = Game.players[pi];
    if (cand && !cand.dead && !cand.downed &&
        aabb({ x: c.x - 2, y: c.y - 2, w: 18, h: 18 }, { x: cand.x, y: cand.y, w: cand.w, h: cand.h })) {
      p = cand;
      break;
    }
  }
  if (p) {
    c.dead = true;
    if (c.kind === 'weapon') {
      p.weapon = c.w;
      Snd.sfx('pickup');
      floatText(c.x, c.y, WEAPONS[c.w].name + '!', WEAPONS[c.w].color);
      burst(c.x + 7, c.y + 7, 10, [WEAPONS[c.w].color, '#ffffff']);
      Game.score += 250;
    } else if (c.kind === 'health') {
      p.hp = Math.min(p.maxHp, p.hp + 2);
      Snd.sfx('health');
      floatText(c.x, c.y, 'REPAIR', '#54ffa8');
      burst(c.x + 7, c.y + 7, 10, ['#54ffa8', '#ffffff']);
      Game.score += 100;
    } else {
      Snd.sfx('coin');
      floatText(c.x, c.y, '+500', '#ffd257');
      burst(c.x + 7, c.y + 7, 8, ['#ffd257', '#ffffff']);
      Game.score += 500;
    }
  }
}

function floatText(x, y, text, color) {
  Game.floaters.push({ x: x, y: y, text: text, color: color || '#fff', life: 50 });
}

/* ---- enemies ------------------------------------------------------------ */
function spawnEnemy(spec) {
  var def = ENEMIES[spec.t];
  if (!def) return;
  Game.enemies.push({
    t: spec.t, x: spec.x, y: spec.y, w: def.w, h: def.h,
    hp: def.hp, maxHp: def.hp, vx: 0, vy: 0,
    facing: -1, onGround: false, walkPhase: 0, age: rnd(0, 120),
    shootT: rndi(40, 120), flash: 0, dead: false,
    homeX: spec.x, homeY: spec.y, aimAngle: 0,
    /* one rig, many looks: era palette, scale jitter, occasional elite */
    pal: (typeof Game !== 'undefined' && Game.stageIndex) || 0,
    scale: 0.94 + RNG.s() * 0.12,
    elite: RNG.sChance(0.12),
    wind: 0, chargeCd: 0
  });
  var last = Game.enemies[Game.enemies.length - 1];
  if (last) {
    last.hp = Math.max(1, Math.round(last.hp * diff().enemyHp * (last.elite ? 1.8 : 1)));
    last.maxHp = last.hp;
    if (last.elite) last.w += 2;
  }
}

function damageEnemy(e, dmg, knock) {
  /* a shielder's plate stops anything coming from the front */
  if (e.t === 'shielder' && knock && sign(knock) === e.facing) {
    e.flash = 5;
    spark(e.x + e.w / 2, e.y + e.h / 2, '#c8d6e2');
    Snd.sfx('hit');
    return;
  }
  e.hp -= dmg;
  e.flash = 8;
  if (knock) e.vx += sign(knock) * 0.5;
  if (e.hp <= 0 && !e.dead) {
    e.dead = true;
    var def = ENEMIES[e.t];
    Game.combo++;
    Game.comboT = 160;
    Game.power = Math.min(100, Game.power + Math.round((8 + Math.min(Game.combo, 12)) * (Game.powerMul || 1)));
    var gained = Math.round(def.score * (Game.scoreMul || 1) * (1 + Math.min(Game.combo, 20) * 0.05));
    Game.score += gained;
    floatText(e.x, e.y - 6, '+' + gained, '#ffd257');
    explosion(e.x + e.w / 2, e.y + e.h / 2, 1);
    Snd.sfx('explode');
    if (RNG.sChance(def.drop * diff().drop)) {
      spawnPickup({ kind: RNG.sChance(0.35) ? 'health' : 'coin', x: e.x, y: e.y });
    }
  } else {
    Snd.sfx('hit');
  }
}

function enemyShootAt(e, speed, count, spreadArc, offsetY) {
  var p = nearestPlayer(e.x + e.w / 2, e.y + e.h / 2) || Game.player;
  var ox = e.x + e.w / 2, oy = e.y + (offsetY === undefined ? e.h / 2 : offsetY);
  var base = Math.atan2((p.y + p.h / 2) - oy, (p.x + p.w / 2) - ox);
  count = count || 1;
  for (var i = 0; i < count; i++) {
    var a = base + (count > 1 ? (i - (count - 1) / 2) * (spreadArc || 0.2) : 0);
    spawnBullet({
      x: ox, y: oy, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      dmg: 1, friendly: false, color: scheme().hostile, glow: scheme().hostileGlow,
      w: 4, h: 4, pierce: 0, life: 160, angle: a
    });
  }
  Snd.sfx('enemyShot');
}

function enemyUpdate(e) {
  var def = ENEMIES[e.t];
  var p = nearestPlayer(e.x + e.w / 2, e.y + e.h / 2) || Game.player;
  var solids = groundRects(), oneways = platformRects();
  e.age++;
  if (e.flash > 0) e.flash--;

  var pcx = p.x + p.w / 2, ecx = e.x + e.w / 2;
  var dx = pcx - ecx;
  var adx = Math.abs(dx);
  var dy = (p.y + p.h / 2) - (e.y + e.h / 2);
  var engaged = adx < 240 && Math.abs(dy) < 140;

  switch (e.t) {
    case 'grunt':
      if (engaged) {
        e.facing = sign(dx) || e.facing;
        if (adx > 46) e.vx = e.facing * def.speed;
        else e.vx = 0;
        if (e.wind > 0) {
          e.wind--;
          if (e.wind === 0) enemyShootAt(e, def.bulletSpeed, 1, 0, 8);
        } else if (e.shootT-- <= 0) {
          e.wind = 16;
          e.shootT = def.shootEvery / diff().fireRate;
        }
      } else {
        e.vx = e.facing * def.speed * 0.6;
        if (!supportedAt(e.x + (e.facing > 0 ? e.w + 2 : -2), e.y + e.h + 2)) e.facing *= -1;
      }
      break;

    case 'runner':
      if (adx < 260) {
        e.facing = sign(dx) || e.facing;
        e.vx = e.facing * def.speed;
        if (!supportedAt(e.x + (e.facing > 0 ? e.w + 2 : -2), e.y + e.h + 2) && e.onGround) {
          e.vy = -6.2;
        }
      } else {
        e.vx = e.facing * 0.4;
      }
      break;

    case 'drone':
      e.vx = approach(e.vx, clamp(dx * 0.02, -def.speed, def.speed), 0.05);
      if (e.shootT-- <= 0) {
        if (adx < 220) {
          spawnBullet({
            x: e.x + e.w / 2, y: e.y + e.h, vx: rnd(-0.4, 0.4), vy: 1.9,
            dmg: 1, friendly: false, color: scheme().hostile, glow: scheme().hostileGlow,
            w: 4, h: 5, pierce: 0, life: 180, angle: Math.PI / 2
          });
          Snd.sfx('enemyShot');
        }
        e.shootT = def.shootEvery;
      }
      break;

    case 'turret':
      e.aimAngle = Math.atan2(dy, dx);
      if (e.wind > 0) {
        e.wind--;
        if (e.wind === 0) enemyShootAt(e, def.bulletSpeed, 1, 0, 5);
      } else if (adx < 300 && e.shootT-- <= 0) {
        e.wind = 18;
        e.shootT = def.shootEvery / diff().fireRate;
      }
      break;

    case 'sniper':
      e.facing = sign(dx) || e.facing;
      if (e.wind > 0) {
        e.wind--;
        if (e.wind === 0) enemyShootAt(e, def.bulletSpeed, 1, 0, 6);
      } else if (adx < 340 && e.shootT-- <= 0) {
        e.wind = 42;                      /* long, readable laser sight */
        e.shootT = def.shootEvery / diff().fireRate;
      }
      break;

    case 'swarm':
      e.vx = approach(e.vx, sign(dx) * def.speed, 0.08);
      e.vy = approach(e.vy, clamp(dy * 0.02, -1.4, 1.4), 0.08);
      e.x += e.vx;
      e.y += e.vy;
      if (e.y < 20) e.y = 20;
      if (e.y > GROUND_Y - e.h) e.y = GROUND_Y - e.h;
      break;

    case 'brute':
      if (e.chargeCd > 0) e.chargeCd--;
      if (adx < 220) {
        e.facing = sign(dx) || e.facing;
        e.vx = e.facing * def.speed;
        if (e.onGround && adx < 90 && e.chargeCd <= 0) {
          e.wind = 14;              /* telegraphed shoulder charge */
          e.chargeCd = 150;
        }
        if (e.wind > 0) {
          e.wind--;
          e.vx = 0;
          if (e.wind === 0) { e.vy = -4.6; e.vx = e.facing * 3.2; Snd.sfx('jump'); }
        }
      } else {
        e.vx = e.facing * def.speed * 0.4;
        if (!supportedAt(e.x + (e.facing > 0 ? e.w + 2 : -2), e.y + e.h + 2)) e.facing *= -1;
      }
      break;

    case 'shielder':
      if (engaged) {
        e.facing = sign(dx) || e.facing;
        if (adx > 60) e.vx = e.facing * def.speed;
        else e.vx = 0;
        if (e.wind > 0) {
          e.wind--;
          if (e.wind === 0) enemyShootAt(e, def.bulletSpeed, 1, 0, 8);
        } else if (e.shootT-- <= 0) {
          e.wind = 20;
          e.shootT = def.shootEvery / diff().fireRate;
        }
      } else {
        e.vx = e.facing * def.speed * 0.6;
      }
      break;

    case 'jumper':
      if (e.onGround && e.shootT-- <= 0) {
        e.facing = sign(dx) || e.facing;
        e.vy = -6.4;
        e.vx = e.facing * (adx < 200 ? 1.7 : 0.8);
        e.shootT = def.shootEvery;
      }
      break;
  }

  if (e.t === 'swarm') {
    /* handled in its own case above */
  } else if (def.gravity) {
    e.vy = Math.min(e.vy + PHYS.grav, PHYS.maxFall);
    moveEntity(e, solids, oneways);
  } else {
    e.x += e.vx;
    e.y = e.homeY + Math.sin(e.age * 0.045) * 8;
  }

  if (e.t === 'grunt' || e.t === 'runner' || e.t === 'jumper') {
    if (Math.abs(e.vx) > 0.1) e.walkPhase += Math.abs(e.vx) * 0.09;
  }

  /* contact damage, against every commando on screen */
  for (var ci = 0; ci < Game.players.length; ci++) {
    var cp = Game.players[ci];
    if (cp && !cp.dead && !cp.downed &&
        aabb(e, { x: cp.x + 1, y: cp.y + 1, w: cp.w - 2, h: cp.h - 2 })) {
      playerHurt(cp, 1);
    }
  }

  /* cull enemies far behind the camera */
  if (e.x < Game.camX - 320 || e.y > H + 120) e.dead = true;
}

/* ---- grenades ----------------------------------------------------------- */
function spawnGrenade(p) {
  Game.grenades.push({
    x: p.x + p.w / 2, y: p.y + 8,
    vx: p.facing * 3.2 + p.vx * 0.4, vy: -3.4,
    fuse: 74, dead: false
  });
}

function grenadeUpdate(n) {
  n.vy = Math.min(n.vy + 0.34, 9);
  n.x += n.vx;
  n.y += n.vy;
  n.fuse--;

  /* bounce off the ground */
  if (n.y > GROUND_Y - 3) {
    n.y = GROUND_Y - 3;
    n.vy *= -0.42;
    n.vx *= 0.72;
    if (Math.abs(n.vy) < 0.6) n.vy = 0;
  }

  if (n.fuse <= 0) {
    n.dead = true;
    var R = 42, i;
    explosion(n.x, n.y, 3);
    Snd.sfx('explode');
    Game.shake = Math.max(Game.shake, 7);
    for (i = 0; i < Game.enemies.length; i++) {
      var e = Game.enemies[i];
      if (e.dead) continue;
      var d2 = dist2(n.x, n.y, e.x + e.w / 2, e.y + e.h / 2);
      if (d2 < R * R) damageEnemy(e, 5, sign(e.x - n.x));
    }
    if (Game.boss && !Game.boss.dead) {
      var bd2 = dist2(n.x, n.y, Game.boss.x + Game.boss.w / 2, Game.boss.y + Game.boss.h / 2);
      if (bd2 < (R + 24) * (R + 24)) damageBoss(Game.boss, 7);
    }
    for (i = 0; i < Game.particles.length; i++) { /* cosmetic only */ }
  }
}

/* ---- arena hazards ------------------------------------------------------ */
function spawnDebris(x, count, delay) {
  for (var i = 0; i < count; i++) {
    Game.hazards.push({
      kind: 'debris',
      x: x + (i - (count - 1) / 2) * 26,
      y: -20,
      vy: 0,
      w: 12, h: 14,
      telegraph: 42 + (delay || 0),
      life: 240,
      dead: false
    });
  }
}

function spawnBeamAt(cx, cy, angle, spin, telegraph, active, len, w) {
  Game.hazards.push({
    kind: 'beam', cx: cx, cy: cy, angle: angle, spin: spin,
    telegraph: telegraph, active: active, len: len, w: w, dead: false
  });
}

function spawnBeam(b, count) {
  for (var i = 0; i < count; i++) {
    Game.hazards.push({
      kind: 'beam',
      cx: b.x + b.w / 2,
      cy: b.y + b.h / 2,
      angle: (i * Math.PI) + 0.4,
      spin: (i % 2 === 0 ? 1 : -1) * 0.012,
      telegraph: 70,
      active: 150,
      len: 420,
      w: 5,
      dead: false
    });
  }
}

function hazardUpdate(hz) {
  var pi, p;
  if (hz.kind === 'debris') {
    if (hz.telegraph > 0) { hz.telegraph--; return; }
    hz.vy = Math.min(hz.vy + 0.6, 13);
    hz.y += hz.vy;
    for (pi = 0; pi < Game.players.length; pi++) {
      p = Game.players[pi];
      if (!p || p.dead || p.downed) continue;
      if (aabb({ x: hz.x - hz.w / 2, y: hz.y - hz.h / 2, w: hz.w, h: hz.h },
               { x: p.x + 1, y: p.y + 1, w: p.w - 2, h: p.h - 2 })) {
        playerHurt(p, 1);
      }
    }
    if (hz.y > GROUND_Y) {
      hz.dead = true;
      explosion(hz.x, GROUND_Y - 4, 1);
      Game.shake = Math.max(Game.shake, 3);
      for (pi = 0; pi < Game.players.length; pi++) {
        p = Game.players[pi];
        if (!p || p.dead || p.downed) continue;
        if (Math.abs((p.x + p.w / 2) - hz.x) < 16 && Math.abs((p.y + p.h) - GROUND_Y) < 26) {
          playerHurt(p, 1);
        }
      }
    }
    return;
  }

  if (hz.kind === 'beam') {
    if (hz.telegraph > 0) { hz.telegraph--; return; }
    hz.active--;
    hz.angle += hz.spin;
    if (hz.active <= 0) { hz.dead = true; return; }

    /* damage anything crossing the beam */
    for (pi = 0; pi < Game.players.length; pi++) {
      p = Game.players[pi];
      if (!p || p.dead || p.downed) continue;
      var px2 = p.x + p.w / 2 - hz.cx;
      var py2 = p.y + p.h / 2 - hz.cy;
      var proj = px2 * Math.cos(hz.angle) + py2 * Math.sin(hz.angle);
      if (proj < 0 || proj > hz.len) continue;
      var perp = Math.abs(-px2 * Math.sin(hz.angle) + py2 * Math.cos(hz.angle));
      if (perp < hz.w / 2 + 4) playerHurt(p, 1);
    }
  }
}

/* ---- bosses ------------------------------------------------------------- */
function makeBoss(kind) {
  var def = BOSSES[kind];
  var arenaStart = Game.stage.arenaStart;
  return {
    kind: kind, def: def, name: def.name,
    x: arenaStart + ARENA_W - def.w - 20, y: GROUND_Y - def.h,
    w: def.w, h: def.h,
    hp: def.hp, maxHp: def.hp,
    age: 0, flash: 0, phase: 1, dir: -1,
    shootT: 100, specialT: 240, angle: 0, angle2: Math.PI,
    dead: false, dying: 0, active: false, introT: 90
  };
}

function damageBoss(b, dmg, hx, hy) {
  if (b.dead) return;

  /* weak point: the Warden's core takes double damage */
  if (b.kind === 'warden' && hx !== undefined) {
    var coreY = b.y + b.h - 42;
    if (hx > b.x + b.w / 2 - 12 && hx < b.x + b.w / 2 + 12 &&
        hy > coreY - 4 && hy < coreY + 22) {
      dmg *= 2;
      if (RNG.sChance(0.5)) floatText(hx, hy - 6, 'CORE', '#ffd257');
    }
  }

  b.hp -= dmg;
  b.flash = 6;
  Snd.sfx('bossHit');
  if (b.hp <= 0) {
    b.hp = 0;
    b.dead = true;
    b.dying = 120;
    var bgained = Math.round(b.def.score * (Game.scoreMul || 1));
    Game.score += bgained;
    floatText(b.x + b.w / 2, b.y, '+' + bgained, '#ffd257');
    Snd.sfx('bigExplode');
    Game.shake = 12;
  }
  if (b.phase === 1 && b.hp < b.maxHp * 0.5) {
    b.phase = 2;
    Game.flash = 0.55;
    Snd.sfx('bossWarn');
    floatText(b.x + b.w / 2, b.y - 14, 'OVERDRIVE', '#ff4d6d');
  }
}

function bossUpdate(b) {
  var p = nearestPlayer(b.x + b.w / 2, b.y + b.h / 2) || Game.player;
  b.age++;
  if (b.flash > 0) b.flash--;

  if (b.dead) {
    b.dying--;
    if (b.dying % 9 === 0) {
      explosion(b.x + rnd(6, b.w - 6), b.y + rnd(6, b.h - 6), 2);
    }
    if (b.dying <= 0) {
      explosion(b.x + b.w / 2, b.y + b.h / 2, 4);
      Snd.sfx('bigExplode');
      Game.boss = null;
      Game.onBossDead();
    }
    return;
  }

  if (b.introT > 0) {
    b.introT--;
    b.y = GROUND_Y - b.h - Math.sin(b.introT * 0.05) * 4;
    return;
  }

  var arenaStart = Game.stage.arenaStart;
  /* the arena is 480 wide but a portrait view can be 270 — keep the boss on screen */
  var leftBound = Math.max(arenaStart + 20, Game.camX + 30);
  var rightBound = Math.min(arenaStart + ARENA_W - b.w - 20, Game.camX + W - b.w - 30);
  if (rightBound < leftBound) rightBound = leftBound;
  var pcx = p.x + p.w / 2;
  var speed = b.phase === 2 ? 1.5 : 1.0;

  if (b.kind === 'warden') {
    b.y = GROUND_Y - b.h;
    if (b.x <= leftBound) b.dir = 1;
    if (b.x >= rightBound) b.dir = -1;
    b.x += b.dir * speed * 0.55;

    /* third attack: ceiling debris telegraphed by falling shadows */
