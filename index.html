/* ===== 60_entities.js ===== */
/* ===========================================================================
   EON COMMANDO — 60 entities
   The commando, five enemy archetypes, three bosses, bullets and debris.
   =========================================================================== */

var PHYS = {
  grav: 0.52, maxFall: 11.5,
  runAcc: 0.58, runMax: 2.55, friction: 0.62, airAcc: 0.42,
  jumpV: -7.7, jumpCut: -3.2, coyote: 6, buffer: 7
};

/* ---- world collision ---------------------------------------------------- */
function groundRects() {
  var segs = Game.stage.groundSegs, out = [], i;
  for (i = 0; i < segs.length; i++) {
    out.push({ x: segs[i][0], y: GROUND_Y, w: segs[i][1], h: H - GROUND_Y + 60 });
  }
  if (Game.gate) out.push(Game.gate);
  return out;
}
function platformRects() {
  var plats = Game.stage.platforms, out = [], i;
  for (i = 0; i < plats.length; i++) {
    out.push({ x: plats[i].x, y: plats[i].y, w: plats[i].w, h: 8 });
  }
  return out;
}
function supportedAt(x, y) {
  var i, segs = Game.stage.groundSegs;
  if (y >= GROUND_Y - 2 && y <= GROUND_Y + 6) {
    for (i = 0; i < segs.length; i++) if (x >= segs[i][0] && x <= segs[i][0] + segs[i][1]) return true;
  }
  var plats = Game.stage.platforms;
  for (i = 0; i < plats.length; i++) {
    if (Math.abs(plats[i].y - (y - 2)) < 8 && x >= plats[i].x && x <= plats[i].x + plats[i].w) return true;
  }
  return false;
}

/* move an entity, resolving against solids and one-way platforms */
function moveEntity(e, solids, oneways, corner) {
  var i, r;
  e.x += e.vx;
  for (i = 0; i < solids.length; i++) {
    r = solids[i];
    if (aabb(e, r)) {
      if (e.vx > 0) e.x = r.x - e.w;
      else if (e.vx < 0) e.x = r.x + r.w;
      e.vx = 0;
    }
  }

  var prevBottom = e.y + e.h;
  e.y += e.vy;
  e.onGround = false;
  for (i = 0; i < solids.length; i++) {
    r = solids[i];
    if (aabb(e, r)) {
      if (e.vy > 0) { e.y = r.y - e.h; e.onGround = true; e.vy = 0; }
      else if (e.vy < 0) {
        /* corner correction: slide around a ledge instead of bonking your head */
        var pokeL = (e.x + e.w) - r.x;
        var pokeR = (r.x + r.w) - e.x;
        var least = Math.min(pokeL, pokeR);
        if (corner && least > 0 && least <= 4.5) {
          e.x += (pokeL < pokeR) ? -pokeL : pokeR;
        } else {
          e.y = r.y + r.h;
          e.vy = 0;
        }
      }
    }
  }
  if (e.vy >= 0 && oneways) {
    for (i = 0; i < oneways.length; i++) {
      r = oneways[i];
      if (e.x + e.w > r.x + 1 && e.x < r.x + r.w - 1 &&
          prevBottom <= r.y + 1 && e.y + e.h >= r.y) {
        e.y = r.y - e.h;
        e.vy = 0;
        e.onGround = true;
      }
    }
  }
}

/* ---- the commando ------------------------------------------------------- */
function makePlayer(x, y) {
  return {
    x: x, y: y, w: 12, h: 22,
    vx: 0, vy: 0, facing: 1,
    onGround: false, ducking: false, runPhase: 0,
    aimAngle: 0, muzzle: 0,
    hp: 4, maxHp: 4,
    invuln: 90, hurtFlash: 0,
    coyote: 0, jumpBuffer: 0, jumpHeld: false,
    weapon: 'rifle', cd: 0,
    dead: false, deadTimer: 0,
    spawnX: x, spawnY: y
  };
}

function setDuck(p, want) {
  if (want === p.ducking) return;
  if (want) {
    p.y += p.h - 14;
    p.h = 14;
  } else {
    /* only stand up when there is room */
    var test = { x: p.x, y: p.y - 8, w: p.w, h: 22 };
    var solids = groundRects();
    for (var i = 0; i < solids.length; i++) if (aabb(test, solids[i])) return;
    p.y -= 8;
    p.h = 22;
  }
  p.ducking = want;
}

function playerUpdate(p) {
  var solids = groundRects(), oneways = platformRects();

  if (p.dead) {
    p.deadTimer++;
    p.vy = Math.min(p.vy + PHYS.grav, PHYS.maxFall);
    p.y += p.vy;
    p.x += p.vx;
    p.vx *= 0.96;
    return;
  }

  var ax = Input.axis();
  var wantDuck = Input.held('down') && p.onGround;
  setDuck(p, wantDuck);

  /* horizontal */
  if (ax !== 0 && !p.ducking) {
    var acc = p.onGround ? PHYS.runAcc : PHYS.airAcc;
    p.vx = approach(p.vx, ax * PHYS.runMax, acc);
    p.facing = ax;
  } else {
    p.vx = approach(p.vx, 0, p.onGround ? PHYS.friction : PHYS.friction * 0.25);
  }

  /* jump with coyote time + input buffering + variable height */
  if (p.onGround) p.coyote = PHYS.coyote; else if (p.coyote > 0) p.coyote--;
  if (Input.pressed('jump')) p.jumpBuffer = PHYS.buffer; else if (p.jumpBuffer > 0) p.jumpBuffer--;

  if (p.jumpBuffer > 0 && p.coyote > 0) {
    p.vy = PHYS.jumpV;
    p.onGround = false;
    p.coyote = 0;
    p.jumpBuffer = 0;
    p.jumpHeld = true;
    Snd.sfx('jump');
    puff(p.x + p.w / 2, p.y + p.h, 5, '#c8d6e2');
  }
  if (p.jumpHeld && !Input.held('jump') && p.vy < PHYS.jumpCut) {
    p.vy = PHYS.jumpCut;
    p.jumpHeld = false;
  }
  if (p.onGround) p.jumpHeld = false;

  /* gravity */
  p.vy = Math.min(p.vy + PHYS.grav, PHYS.maxFall);

  var wasAir = !p.onGround;
  moveEntity(p, solids, oneways, true);
  if (wasAir && p.onGround) {
    puff(p.x + p.w / 2, p.y + p.h, 3, '#8fa4b8');
    if (p.vy > 6) Snd.sfx('land');
  }

  /* keep the commando inside the level */
  if (p.x < 2) { p.x = 2; if (p.vx < 0) p.vx = 0; }
  var maxX = Game.stage.length - p.w - 2;
  if (p.x > maxX) { p.x = maxX; if (p.vx > 0) p.vx = 0; }

  /* animation */
  if (p.onGround && Math.abs(p.vx) > 0.2) p.runPhase += Math.abs(p.vx) * 0.055;
  else if (p.onGround) p.runPhase = 0;

  /* aim direction */
  var up = Input.held('up'), down = Input.held('down');
  var axAim = 0, ayAim = 0;
  if (up) ayAim = -1;
  else if (down && !p.onGround) ayAim = 1;
  if (up || (down && !p.onGround)) {
    if (Input.held('left')) axAim = -1;
    else if (Input.held('right')) axAim = 1;
  } else {
    axAim = p.facing;
  }
  if (axAim === 0 && ayAim === 0) axAim = p.facing;
  p.aimAngle = Math.atan2(ayAim, axAim);

  /* firing */
  if (p.cd > 0) p.cd--;
  if (p.muzzle > 0) p.muzzle--;
  if (Input.held('fire') && p.cd <= 0) fireWeapon(p);

  /* timers */
  if (p.invuln > 0) p.invuln--;
  if (p.hurtFlash > 0) p.hurtFlash--;

  /* fell into a chasm */
  if (p.y > H + 60) {
    p.hp = 0;
    killPlayer(p);
  }
}

function fireWeapon(p) {
  var w = WEAPONS[p.weapon];
  p.cd = w.cd;
  p.muzzle = 4;
  Snd.sfx(w.sfx);
  var ox = p.x + p.w / 2 + Math.cos(p.aimAngle) * 9;
  var oy = p.y + (p.ducking ? 8 : 10) + Math.sin(p.aimAngle) * 9;

  for (var i = 0; i < w.shots; i++) {
    var a = p.aimAngle;
    if (w.shots > 1) a += (i - (w.shots - 1) / 2) * w.spread;
    a += rnd(-w.jitter, w.jitter);
    spawnBullet({
      x: ox, y: oy, vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed,
      dmg: w.dmg, friendly: true, color: w.color, glow: w.glow,
      w: w.w, h: w.h, pierce: w.pierce, life: w.life, angle: a
    });
  }
  /* recoil shove */
  p.vx -= Math.cos(p.aimAngle) * (w.name === 'LASER' ? 0.6 : 0.14);
}

function playerHurt(p, dmg) {
  if (p.invuln > 0 || p.dead) return;
  p.hp -= dmg;
  p.hurtFlash = 24;
  p.invuln = 80;
  Game.shake = Math.max(Game.shake, 5);
  Snd.sfx('hurt');
  if (p.hp <= 0) killPlayer(p);
}

function killPlayer(p) {
  if (p.dead) return;
  p.dead = true;
  p.deadTimer = 0;
  p.hp = 0;
  p.vx = -p.facing * 1.6;
  p.vy = -4.5;
  Snd.sfx('death');
  Game.shake = 9;
  burst(p.x + p.w / 2, p.y + p.h / 2, 26, ['#ff5c3c', '#ffb545', '#ffffff']);
}

/* ---- bullets ------------------------------------------------------------ */
function spawnBullet(o) {
  o.life = o.life || 90;
  o.pierce = o.pierce || 0;
  o.hits = 0;
  Game.bullets.push(o);
  return o;
}

function bulletUpdate(b) {
  b.x += b.vx;
  b.y += b.vy;
  b.life--;
  if (b.life <= 0) { b.dead = true; return; }
  if (b.x < -40 || b.x > Game.stage.length + 40 || b.y < -60 || b.y > H + 60) { b.dead = true; return; }

  var box = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };

  /* terrain */
  var solids = groundRects(), i;
  for (i = 0; i < solids.length; i++) {
    if (aabb(box, solids[i])) {
      b.dead = true;
      spark(b.x, b.y, b.color);
      return;
    }
  }
  if (b.friendly) {
    /* enemy bullets are blocked by platforms; yours pass through thin ones */
    for (i = 0; i < Game.enemies.length; i++) {
      var e = Game.enemies[i];
      if (e.dead) continue;
      if (aabb(box, e)) {
        damageEnemy(e, b.dmg, b.vx);
        b.hits++;
        if (b.hits > b.pierce) { b.dead = true; spark(b.x, b.y, b.color); return; }
      }
    }
    var boss = Game.boss;
    if (boss && !boss.dead && aabb(box, boss)) {
      damageBoss(boss, b.dmg);
      b.hits++;
      if (b.hits > b.pierce) { b.dead = true; spark(b.x, b.y, b.color); return; }
    }
  } else {
    var p = Game.player;
    if (!p.dead && aabb(box, { x: p.x, y: p.y, w: p.w, h: p.h })) {
      playerHurt(p, b.dmg || 1);
      b.dead = true;
      spark(b.x, b.y, b.color);
    }
  }
}

/* ---- particles ---------------------------------------------------------- */
function spawnParticle(o) {
  o.life = o.life || 20;
  o.maxLife = o.life;
  o.grav = o.grav === undefined ? 0.06 : o.grav;
  Game.particles.push(o);
}
function spark(x, y, color) {
  for (var i = 0; i < 4; i++) {
    spawnParticle({
      x: x, y: y, vx: rnd(-1.4, 1.4), vy: rnd(-1.4, 0.6),
      life: rndi(8, 16), color: color, size: 1, grav: 0.04
    });
  }
}
function burst(x, y, n, colors) {
  for (var i = 0; i < n; i++) {
    var a = rnd(0, Math.PI * 2), s = rnd(0.4, 3.2);
    spawnParticle({
      x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.6,
      life: rndi(16, 40), color: pick(colors), size: rndi(1, 3), grav: 0.08
    });
  }
}
function puff(x, y, n, color) {
  for (var i = 0; i < n; i++) {
    spawnParticle({
      x: x, y: y, vx: rnd(-0.7, 0.7), vy: rnd(-0.5, 0.2),
      life: rndi(8, 18), color: color, size: 1, grav: 0.02
    });
  }
}
function explosion(x, y, size) {
  burst(x, y, 16 + size * 6, ['#ffb545', '#ff5c3c', '#ffe9a8', '#ffffff']);
  for (var i = 0; i < 3 + size; i++) {
    spawnParticle({
      x: x + rnd(-8, 8), y: y + rnd(-8, 8), vx: rnd(-0.4, 0.4), vy: rnd(-1.2, -0.2),
      life: rndi(20, 34), color: '#4a5568', size: rndi(2, 4), grav: -0.02, smoke: true
    });
  }
  Game.shake = Math.max(Game.shake, 3 + size);
}

function particleUpdate(pt) {
  pt.x += pt.vx;
  pt.y += pt.vy;
  pt.vy += pt.grav;
  pt.vx *= 0.985;
  pt.life--;
  if (pt.life <= 0) pt.dead = true;
}

/* ---- pickups ------------------------------------------------------------ */
function spawnPickup(o) {
  Game.pickups.push({
    kind: o.kind, w: o.w, label: o.label, x: o.x, y: o.y,
    baseY: o.y, age: rnd(0, 60), vy: 0, dead: false
  });
}
function pickupUpdate(c) {
  c.age++;
  c.y = c.baseY + Math.sin(c.age * 0.06) * 3;
  var p = Game.player;
  if (!p.dead && aabb({ x: c.x - 2, y: c.y - 2, w: 18, h: 18 }, { x: p.x, y: p.y, w: p.w, h: p.h })) {
    c.dead = true;
    if (c.kind === 'weapon') {
      p.weapon = c.w;
      Snd.sfx('pickup');
      floatText(c.x, c.y, WEAPONS[c.w].name + '!', WEAPONS[c.w].color);
      burst(c.x + 7, c.y + 7, 10, [WEAPONS[c.w].color, '#ffffff']);
      Game.score += 250;
    } else if (c.kind === 'health') {
      p.hp = Math.min(p.maxHp, p.hp + 2);
      Snd.sfx('health');
      floatText(c.x, c.y, 'REPAIR', '#54ffa8');
      burst(c.x + 7, c.y + 7, 10, ['#54ffa8', '#ffffff']);
      Game.score += 100;
    } else {
      Snd.sfx('coin');
      floatText(c.x, c.y, '+500', '#ffd257');
      burst(c.x + 7, c.y + 7, 8, ['#ffd257', '#ffffff']);
      Game.score += 500;
    }
  }
}

function floatText(x, y, text, color) {
  Game.floaters.push({ x: x, y: y, text: text, color: color || '#fff', life: 50 });
}

/* ---- enemies ------------------------------------------------------------ */
function spawnEnemy(spec) {
  var def = ENEMIES[spec.t];
  if (!def) return;
  Game.enemies.push({
    t: spec.t, x: spec.x, y: spec.y, w: def.w, h: def.h,
    hp: def.hp, maxHp: def.hp, vx: 0, vy: 0,
    facing: -1, onGround: false, walkPhase: 0, age: rnd(0, 120),
    shootT: rndi(40, 120), flash: 0, dead: false,
    homeX: spec.x, homeY: spec.y, aimAngle: 0,
    /* one rig, many looks: era palette, scale jitter, occasional elite */
    pal: (typeof Game !== 'undefined' && Game.stageIndex) || 0,
    scale: 0.94 + Math.random() * 0.12,
    elite: Math.random() < 0.12
  });
  var last = Game.enemies[Game.enemies.length - 1];
  if (last && last.elite) {
    last.hp = Math.round(last.hp * 1.8);
    last.maxHp = last.hp;
    last.w += 2;
  }
}

function damageEnemy(e, dmg, knock) {
  e.hp -= dmg;
  e.flash = 8;
  if (knock) e.vx += sign(knock) * 0.5;
  if (e.hp <= 0 && !e.dead) {
    e.dead = true;
    var def = ENEMIES[e.t];
    Game.score += def.score;
    floatText(e.x, e.y - 6, '+' + def.score, '#ffd257');
    explosion(e.x + e.w / 2, e.y + e.h / 2, 1);
    Snd.sfx('explode');
    if (chance(def.drop)) {
      spawnPickup({ kind: chance(0.35) ? 'health' : 'coin', x: e.x, y: e.y });
    }
  } else {
    Snd.sfx('hit');
  }
}

function enemyShootAt(e, speed, count, spreadArc, offsetY) {
  var p = Game.player;
  var ox = e.x + e.w / 2, oy = e.y + (offsetY === undefined ? e.h / 2 : offsetY);
  var base = Math.atan2((p.y + p.h / 2) - oy, (p.x + p.w / 2) - ox);
  count = count || 1;
  for (var i = 0; i < count; i++) {
    var a = base + (count > 1 ? (i - (count - 1) / 2) * (spreadArc || 0.2) : 0);
    spawnBullet({
      x: ox, y: oy, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      dmg: 1, friendly: false, color: '#ff4d6d', glow: '#ffd0d8',
      w: 4, h: 4, pierce: 0, life: 160, angle: a
    });
  }
  Snd.sfx('enemyShot');
}

function enemyUpdate(e) {
  var def = ENEMIES[e.t];
  var p = Game.player;
  var solids = groundRects(), oneways = platformRects();
  e.age++;
  if (e.flash > 0) e.flash--;

  var pcx = p.x + p.w / 2, ecx = e.x + e.w / 2;
  var dx = pcx - ecx;
  var adx = Math.abs(dx);
  var dy = (p.y + p.h / 2) - (e.y + e.h / 2);
  var engaged = adx < 240 && Math.abs(dy) < 140;

  switch (e.t) {
    case 'grunt':
      if (engaged) {
        e.facing = sign(dx) || e.facing;
        if (adx > 46) e.vx = e.facing * def.speed;
        else e.vx = 0;
        if (e.shootT-- <= 0) { enemyShootAt(e, def.bulletSpeed, 1, 0, 8); e.shootT = def.shootEvery; }
      } else {
        e.vx = e.facing * def.speed * 0.6;
        if (!supportedAt(e.x + (e.facing > 0 ? e.w + 2 : -2), e.y + e.h + 2)) e.facing *= -1;
      }
      break;

    case 'runner':
      if (adx < 260) {
        e.facing = sign(dx) || e.facing;
        e.vx = e.facing * def.speed;
        if (!supportedAt(e.x + (e.facing > 0 ? e.w + 2 : -2), e.y + e.h + 2) && e.onGround) {
          e.vy = -6.2;
        }
      } else {
        e.vx = e.facing * 0.4;
      }
      break;

    case 'drone':
      e.vx = approach(e.vx, clamp(dx * 0.02, -def.speed, def.speed), 0.05);
      if (e.shootT-- <= 0) {
        if (adx < 220) {
          spawnBullet({
            x: e.x + e.w / 2, y: e.y + e.h, vx: rnd(-0.4, 0.4), vy: 1.9,
            dmg: 1, friendly: false, color: '#ff4d6d', glow: '#ffd0d8',
            w: 4, h: 5, pierce: 0, life: 180, angle: Math.PI / 2
          });
          Snd.sfx('enemyShot');
        }
        e.shootT = def.shootEvery;
      }
      break;

    case 'turret':
      e.aimAngle = Math.atan2(dy, dx);
      if (adx < 300 && e.shootT-- <= 0) {
        enemyShootAt(e, def.bulletSpeed, 1, 0, 5);
        e.shootT = def.shootEvery;
      }
      break;

    case 'jumper':
      if (e.onGround && e.shootT-- <= 0) {
        e.facing = sign(dx) || e.facing;
        e.vy = -6.4;
        e.vx = e.facing * (adx < 200 ? 1.7 : 0.8);
        e.shootT = def.shootEvery;
      }
      break;
  }

  if (def.gravity) {
    e.vy = Math.min(e.vy + PHYS.grav, PHYS.maxFall);
    moveEntity(e, solids, oneways);
  } else {
    e.x += e.vx;
    e.y = e.homeY + Math.sin(e.age * 0.045) * 8;
  }

  if (e.t === 'grunt' || e.t === 'runner' || e.t === 'jumper') {
    if (Math.abs(e.vx) > 0.1) e.walkPhase += Math.abs(e.vx) * 0.09;
  }

  /* contact damage */
  if (!p.dead && aabb(e, { x: p.x + 1, y: p.y + 1, w: p.w - 2, h: p.h - 2 })) {
    playerHurt(p, 1);
  }

  /* cull enemies far behind the camera */
  if (e.x < Game.camX - 320 || e.y > H + 120) e.dead = true;
}

/* ---- bosses ------------------------------------------------------------- */
function makeBoss(kind) {
  var def = BOSSES[kind];
  var arenaStart = Game.stage.arenaStart;
  return {
    kind: kind, def: def, name: def.name,
    x: arenaStart + ARENA_W - def.w - 20, y: GROUND_Y - def.h,
    w: def.w, h: def.h,
    hp: def.hp, maxHp: def.hp,
    age: 0, flash: 0, phase: 1, dir: -1,
    shootT: 100, specialT: 240, angle: 0,
    dead: false, dying: 0, active: false, introT: 90
  };
}

function damageBoss(b, dmg) {
  if (b.dead) return;
  b.hp -= dmg;
  b.flash = 6;
  Snd.sfx('bossHit');
  if (b.hp <= 0) {
    b.hp = 0;
    b.dead = true;
    b.dying = 120;
    Game.score += b.def.score;
    floatText(b.x + b.w / 2, b.y, '+' + b.def.score, '#ffd257');
    Snd.sfx('bigExplode');
    Game.shake = 12;
  }
  if (b.phase === 1 && b.hp < b.maxHp * 0.5) {
    b.phase = 2;
    Game.flash = 0.55;
    Snd.sfx('bossWarn');
    floatText(b.x + b.w / 2, b.y - 14, 'OVERDRIVE', '#ff4d6d');
  }
}

function bossUpdate(b) {
  var p = Game.player;
  b.age++;
  if (b.flash > 0) b.flash--;

  if (b.dead) {
    b.dying--;
    if (b.dying % 9 === 0) {
      explosion(b.x + rnd(6, b.w - 6), b.y + rnd(6, b.h - 6), 2);
    }
    if (b.dying <= 0) {
      explosion(b.x + b.w / 2, b.y + b.h / 2, 4);
      Snd.sfx('bigExplode');
      Game.boss = null;
      Game.onBossDead();
    }
    return;
  }

  if (b.introT > 0) {
    b.introT--;
    b.y = GROUND_Y - b.h - Math.sin(b.introT * 0.05) * 4;
    return;
  }

  var arenaStart = Game.stage.arenaStart;
  var leftBound = arenaStart + 20;
  var rightBound = arenaStart + ARENA_W - b.w - 20;
  var pcx = p.x + p.w / 2;
  var speed = b.phase === 2 ? 1.5 : 1.0;

  if (b.kind === 'warden') {
    b.y = GROUND_Y - b.h;
    if (b.x <= leftBound) b.dir = 1;
    if (b.x >= rightBound) b.dir = -1;
    b.x += b.dir * speed * 0.55;

    if (b.shootT-- <= 0) {
      var n = b.phase === 2 ? 5 : 3;
      var ox = b.x + b.w / 2, oy = b.y + 34;
      var base = Math.atan2((p.y + p.h / 2) - oy, pcx - ox);
      for (var i = 0; i < n; i++) {
        var a = base + (i - (n - 1) / 2) * 0.17;
        spawnBullet({
          x: ox, y: oy, vx: Math.cos(a) * 2.9, vy: Math.sin(a) * 2.9,
          dmg: 1, friendly: false, color: '#ff7a45', glow: '#ffd9a8',
          w: 5, h: 5, life: 200, angle: a
        });
      }
      Snd.sfx('enemyShot');
      b.shootT = b.phase === 2 ? 62 : 96;
    }
    if (b.specialT-- <= 0) {
      /* ground shockwave */
      for (var s = 0; s < 2; s++) {
        var dirS = s === 0 ? -1 : 1;
        spawnBullet({
          x: b.x + b.w / 2, y: GROUND_Y - 6, vx: dirS * 3.4, vy: 0,
          dmg: 1, friendly: false, color: '#ffb545', glow: '#fff3c4',
          w: 8, h: 8, life: 200, angle: 0
        });
      }
      Game.shake = 8;
      Snd.sfx('explode');
      b.specialT = b.phase === 2 ? 150 : 230;
    }
  }

  if (b.kind === 'wraith') {
    b.x = clamp(b.x + Math.cos(b.age * 0.013) * 0.9, leftBound, rightBound);
    b.y = GROUND_Y - b.h - 62 + Math.sin(b.age * 0.035) * 18;

    if (b.shootT-- <= 0) {
      var ox2 = b.x + b.w / 2, oy2 = b.y + b.h - 4;
      var base2 = Math.atan2((p.y + p.h / 2) - oy2, pcx - ox2);
      for (var j = 0; j < (b.phase === 2 ? 3 : 2); j++) {
        spawnBullet({
          x: ox2, y: oy2, vx: Math.cos(base2 + j * 0.18 - 0.09) * 3.1,
          vy: Math.sin(base2 + j * 0.18 - 0.09) * 3.1,
          dmg: 1, friendly: false, color: '#7fe3ff', glow: '#e6fbff',
          w: 5, h: 5, life: 220, angle: base2
        });
      }
      Snd.sfx('enemyShot');
      b.shootT = b.phase === 2 ? 58 : 84;
    }
    if (b.specialT-- <= 0) {
      for (var k = 0; k < 7; k++) {
        var aa = Math.PI / 2 + (k - 3) * 0.22;
        spawnBullet({
          x: b.x + b.w / 2, y: b.y + b.h, vx: Math.cos(aa) * 2.2, vy: Math.sin(aa) * 2.2,
          dmg: 1, friendly: false, color: '#bff4ff', glow: '#ffffff',
          w: 4, h: 6, life: 240, angle: aa
        });
      }
      if (b.phase === 2) {
        spawnEnemy({ t: 'drone', x: b.x, y: b.y + 20 });
        spawnEnemy({ t: 'drone', x: b.x + b.w, y: b.y + 20 });
      }
      Snd.sfx('spread');
      b.specialT = b.phase === 2 ? 180 : 260;
    }
  }

  if (b.kind === 'heart') {
    b.x = arenaStart + ARENA_W / 2 - b.w / 2;
    b.y = GROUND_Y - b.h - 56 + Math.sin(b.age * 0.03) * 8;

    if (b.shootT-- <= 0) {
      var arms = b.phase === 2 ? 6 : 4;
      b.angle += 0.42;
      for (var m = 0; m < arms; m++) {
        var ang = b.angle + m * (Math.PI * 2 / arms);
        spawnBullet({
          x: b.x + b.w / 2, y: b.y + b.h / 2,
          vx: Math.cos(ang) * 2.5, vy: Math.sin(ang) * 2.5,
          dmg: 1, friendly: false, color: '#ff2d95', glow: '#ffd0e4',
          w: 5, h: 5, life: 260, angle: ang
        });
      }
      Snd.sfx('enemyShot');
      b.shootT = b.phase === 2 ? 40 : 56;
    }
    if (b.specialT-- <= 0) {
      /* aimed volley at the player */
      var ox3 = b.x + b.w / 2, oy3 = b.y + b.h / 2;
      var base3 = Math.atan2((p.y + p.h / 2) - oy3, pcx - ox3);
      for (var q = -2; q <= 2; q++) {
        spawnBullet({
          x: ox3, y: oy3, vx: Math.cos(base3 + q * 0.12) * 3.6,
          vy: Math.sin(base3 + q * 0.12) * 3.6,
          dmg: 1, friendly: false, color: '#ffb545', glow: '#fff3c4',
          w: 5, h: 5, life: 240, angle: base3
        });
      }
      if (b.phase === 2) spawnEnemy({ t: 'runner', x: arenaStart + 40, y: GROUND_Y - 15 });
      Snd.sfx('spread');
      b.specialT = b.phase === 2 ? 140 : 210;
    }
  }

  /* contact damage */
  if (!p.dead && aabb(b, { x: p.x + 1, y: p.y + 1, w: p.w - 2, h: p.h - 2 })) {
    playerHurt(p, 1);
  }
}

function drawBoss(g, b) {
  if (b.kind === 'warden') drawWarden(g, b);
  else if (b.kind === 'wraith') drawWraith(g, b);
  else drawHeart(g, b);
}

/* ===== 70_game.js ===== */
/* ===========================================================================
   EON COMMANDO — 70 game
   State machine, stage flow, camera, spawning, scoring, save.
   =========================================================================== */

var Game = {
  state: 'title',
  stageIndex: 0,
  stage: null,
  bg: null,
  player: null,
  enemies: [],
  bullets: [],
  particles: [],
  pickups: [],
  floaters: [],
  pending: [],
  boss: null,
  gate: null,
  camX: 0,
  score: 0,
  lives: 3,
  hiScore: 0,
  shake: 0,
  flash: 0,
  time: 0,
  frames: 0,
  stateTimer: 0,
  banner: null,
  arenaLocked: false,
  bossTriggered: false,
  stageTime: 0,
  lastRun: null,
  errors: [],

  init: function () {
    this.hiScore = Store.get('hiScore', 0) || 0;
    this.state = 'title';
    this.stateTimer = 0;
    this.stage = STAGES[0];
    this.bg = makeBackground(STAGES[0]);
    this.camX = 0;
    this.time = 0;
  },

  startGame: function () {
    this.score = 0;
    this.lives = 3;
    this.stageIndex = 0;
    this.stateTimer = 0;
    Snd.resume();
    Snd.sfx('start');
    this.loadStage(0);
    this.state = 'playing';
  },

  loadStage: function (i) {
    this.stageIndex = i;
    this.stage = STAGES[i];
    this.bg = makeBackground(this.stage);
    this.enemies = [];
    this.bullets = [];
    this.particles = [];
    this.pickups = [];
    this.floaters = [];
    this.boss = null;
    this.gate = null;
    this.camX = 0;
    this.arenaLocked = false;
    this.bossTriggered = false;
    this.stageTime = 0;
    this.shake = 0;
    this.flash = 0;

    this.player = makePlayer(48, GROUND_Y - 22);
    this.player.invuln = 60;

    this.pending = this.stage.enemies.slice().sort(function (a, b) { return a.x - b.x; });
    for (var k = 0; k < this.stage.pickups.length; k++) {
      var pk = this.stage.pickups[k];
      spawnPickup({
        kind: pk.kind, w: pk.w, x: pk.x, y: pk.y,
        label: pk.w ? WEAPONS[pk.w].name.charAt(0) : 'W'
      });
    }
    this.banner = { text: 'ERA ' + (i + 1), sub: this.stage.name, life: 130, color: this.stage.accent };
    Snd.playMusic(TRACKS[this.stage.music]);
  },

  checkpointX: function () {
    if (this.arenaLocked) return this.stage.arenaStart + 40;
    var cps = this.stage.checkpoints || [48];
    var best = cps[0];
    var px = this.player ? this.player.x : 0;
    for (var i = 0; i < cps.length; i++) if (px >= cps[i]) best = cps[i];
    return best;
  },

  respawn: function () {
    var x = this.checkpointX();
    this.player = makePlayer(x, GROUND_Y - 22);
    this.player.invuln = 110;
    this.player.weapon = 'rifle';
    if (this.arenaLocked) {
      this.bullets = this.bullets.filter(function (b) { return b.friendly; });
    }
    Snd.playMusic(TRACKS[this.stage.music]);
  },

  triggerBoss: function () {
    this.bossTriggered = true;
    this.arenaLocked = true;
    this.gate = { x: this.stage.arenaStart - 4, y: 0, w: 4, h: GROUND_Y + 60 };
    this.boss = makeBoss(this.stage.boss);
    this.banner = { text: 'WARNING', sub: this.boss.name, life: 150, color: '#ff4d6d' };
    this.flash = 0.4;
    Snd.sfx('bossWarn');
    Snd.playMusic(TRACKS.boss);
  },

  onBossDead: function () {
    this.state = 'stageclear';
    this.stateTimer = 0;
    var bonus = 1500 + this.player.hp * 250 + this.lives * 500;
    this.lastRun = {
      stage: this.stage.name,
      bonus: bonus,
      hp: this.player.hp,
      lives: this.lives
    };
    this.score += bonus;
    Snd.sfx('stageClear');
    Snd.stopMusic();
  },

  gameOver: function () {
    this.state = 'gameover';
    this.stateTimer = 0;
    Snd.sfx('gameOver');
    Snd.stopMusic();
    this.saveHi();
  },

  victory: function () {
    this.state = 'victory';
    this.stateTimer = 0;
    Snd.sfx('stageClear');
    Snd.stopMusic();
    this.saveHi();
  },

  saveHi: function () {
    if (this.score > this.hiScore) {
      this.hiScore = this.score;
      Store.set('hiScore', this.hiScore);
    }
  },

  /* ---- per-frame ------------------------------------------------------- */
  update: function () {
    this.time++;
    this.frames++;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - 0.55);
    if (this.flash > 0) this.flash = Math.max(0, this.flash - 0.045);

    if (this.banner) {
      this.banner.life--;
      if (this.banner.life <= 0) this.banner = null;
    }

    if (Input.pressed('mute')) {
      Snd.setMuted(!Snd.muted);
      Store.set('muted', Snd.muted);
    }

    switch (this.state) {
      case 'title':
        this.updateTitle();
        break;
      case 'playing':
        this.updatePlaying();
        break;
      case 'paused':
        if (Input.pressed('pause') || Input.pressed('start')) {
          this.state = 'playing';
          Snd.sfx('select');
        }
        break;
      case 'stageclear':
        this.updateStageClear();
        break;
      case 'gameover':
      case 'victory':
        this.stateTimer++;
        this.updateParticles();
        if (this.stateTimer > 60 && (Input.pressed('start') || Input.pressed('restart'))) {
          this.startGame();
        }
        break;
    }
  },

  updateTitle: function () {
    if (!Snd.track) Snd.playMusic(TRACKS.title);
    this.stateTimer++;
    if (Input.pressed('start') || Input.pressed('jump') || Input.pressed('fire')) {
      this.startGame();
    }
  },

  updatePlaying: function () {
    this.stageTime++;
    if (Input.pressed('pause')) {
      this.state = 'paused';
      Snd.sfx('select');
      return;
    }

    var p = this.player;
    playerUpdate(p);

    /* spawn enemies as the camera approaches */
    while (this.pending.length && this.pending[0].x < this.camX + W + 80) {
      spawnEnemy(this.pending.shift());
    }

    var i;
    for (i = 0; i < this.enemies.length; i++) if (!this.enemies[i].dead) enemyUpdate(this.enemies[i]);
    for (i = 0; i < this.bullets.length; i++) if (!this.bullets[i].dead) bulletUpdate(this.bullets[i]);
    this.updateParticles();
    for (i = 0; i < this.pickups.length; i++) if (!this.pickups[i].dead) pickupUpdate(this.pickups[i]);

    for (i = this.floaters.length - 1; i >= 0; i--) {
      var f = this.floaters[i];
      f.y -= 0.45;
      f.life--;
      if (f.life <= 0) this.floaters.splice(i, 1);
    }

    if (this.boss && !this.boss.dead) bossUpdate(this.boss);
    else if (this.boss && this.boss.dead) bossUpdate(this.boss);

    /* boss trigger */
    if (!this.bossTriggered && p.x + p.w / 2 > this.stage.arenaStart + 70) {
      this.triggerBoss();
    }

    /* camera */
    var target;
    if (this.arenaLocked) {
      /* centre the fixed-width arena, letting a wide screen see the walls */
      target = this.stage.arenaStart + ARENA_W / 2 - W / 2;
    } else {
      target = p.x + p.w / 2 - W * 0.42;
    }
    target = clamp(target, 0, this.stage.length - W);
    this.camX = lerp(this.camX, target, 0.14);
    if (Math.abs(this.camX - target) < 0.4) this.camX = target;

    /* death handling */
    if (p.dead && p.deadTimer > 90) {
      this.lives--;
      if (this.lives < 0) {
        this.gameOver();
      } else {
        this.respawn();
      }
    }

    /* housekeeping */
    this.enemies = this.enemies.filter(function (e) { return !e.dead; });
    this.bullets = this.bullets.filter(function (b) { return !b.dead; });
    this.particles = this.particles.filter(function (pt) { return !pt.dead; });
    this.pickups = this.pickups.filter(function (c) { return !c.dead; });
  },

  updateParticles: function () {
    for (var i = 0; i < this.particles.length; i++) {
      if (!this.particles[i].dead) particleUpdate(this.particles[i]);
    }
    this.particles = this.particles.filter(function (pt) { return !pt.dead; });
  },

  updateStageClear: function () {
    this.stateTimer++;
    this.updateParticles();
    if (this.stateTimer > 160) {
      if (this.stageIndex + 1 < STAGES.length) {
        this.loadStage(this.stageIndex + 1);
        this.state = 'playing';
      } else {
        this.victory();
      }
    }
  },

  /* ---- input from the page --------------------------------------------- */
  pressStart: function () {
    if (this.state === 'title' || this.state === 'gameover' || this.state === 'victory') {
      if (this.state !== 'title') this.stateTimer = 999;
      this.startGame();
    } else if (this.state === 'paused') {
      this.state = 'playing';
    }
  }
};

/* ===== 80_render.js ===== */
/* ===========================================================================
   EON COMMANDO — 80 render
   Parallax eras, the world, the HUD and every screen.
   =========================================================================== */

function makeBackground(stage) {
  var rng = mulberry32(stage.seed);
  var span = stage.length + 1600;
  var startX = -800;
  var i, x;

  var stars = [];
  for (i = 0; i < 120; i++) {
    stars.push({ x: rng() * span, y: rng() * 118, s: rng() > 0.86 ? 2 : 1, tw: rng() * 6.28 });
  }

  function ridge(amp, base, step) {
    var pts = [];
    for (var xx = -W; xx < span; xx += step) {
      pts.push({
        x: xx,
        y: base + Math.sin(xx * 0.004) * amp * 0.6 +
           Math.sin(xx * 0.011) * amp * 0.28 + rng() * amp * 0.4
      });
    }
    return pts;
  }

  var clouds = [];
  for (i = 0; i < 12; i++) {
    clouds.push({
      x: rng() * span, y: 16 + rng() * 86,
      w: 70 + rng() * 160, h: 5 + rng() * 9, a: 0.04 + rng() * 0.07
    });
  }

  var mid = [];
  x = startX;
  while (x < span) {
    var w = 20 + rng() * 40;
    var h = 30 + rng() * 92;
    var wins = [];
    for (var wy = 8; wy < h - 6; wy += 9) {
      for (var wx = 4; wx < w - 4; wx += 8) {
        if (rng() > 0.55) wins.push({ x: wx, y: wy });
      }
    }
    mid.push({ x: x, w: w, h: h, wins: wins, lit: rng() > 0.25 });
    x += w + 14 + rng() * 46;
  }

  var near = [];
  x = startX;
  while (x < span) {
    near.push({ x: x, w: 30 + rng() * 60, h: 12 + rng() * 34 });
    x += 70 + rng() * 110;
  }

  var fore = [];
  x = startX;
  while (x < span) {
    fore.push({ x: x, w: 34 + rng() * 70, h: 6 + rng() * 16 });
    x += 130 + rng() * 190;
  }

  var motes = [];
  for (i = 0; i < 60; i++) {
    motes.push({
      x: rng() * span, y: rng() * (GROUND_Y - 20),
      s: rng() > 0.85 ? 2 : 1, ph: rng() * 6.28, sp: 0.3 + rng() * 0.9
    });
  }

  var speckles = [];
  for (i = 0; i < 1100; i++) {
    var sx = rng() * stage.length;
    speckles.push({
      x: sx, y: GROUND_Y + 2 + rng() * (H - GROUND_Y),
      s: rng() > 0.7 ? 2 : 1, d: rng() > 0.5
    });
  }

  var props = [];
  for (i = 0; i < 52; i++) {
    props.push({ x: rng() * stage.length, h: 6 + rng() * 22, w: 3 + rng() * 6, kind: rng() > 0.62 ? 1 : 0 });
  }

  return {
    span: span, stars: stars, clouds: clouds,
    ridgeFar: ridge(30, 58, 46), ridgeMid: ridge(22, 100, 38),
    mid: mid, near: near, fore: fore,
    motes: motes, speckles: speckles, props: props,
    disc: { x: W * (0.24 + rng() * 0.5), y: 62 + rng() * 22, r: 22 + rng() * 12 },
    colFar: shade(stage.sky[2], 0.55),
    colMid: shade(stage.sky[2], 0.4)
  };
}

function drawSky(g, stage, bg, camX, time) {
  var grad = g.createLinearGradient(0, 0, 0, GROUND_Y + 20);
  grad.addColorStop(0, stage.sky[0]);
  grad.addColorStop(0.55, stage.sky[1]);
  grad.addColorStop(1, stage.sky[2]);
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);

  /* celestial body */
  if (bg && bg.disc) {
    var dx = bg.disc.x - camX * 0.04, dy = bg.disc.y, dr = bg.disc.r;
    var halo = g.createRadialGradient(dx, dy, dr * 0.4, dx, dy, dr * 3.4);
    halo.addColorStop(0, rgba(stage.accent, 0.30));
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = halo;
    g.fillRect(dx - dr * 3.4, dy - dr * 3.4, dr * 6.8, dr * 6.8);
    g.fillStyle = rgba(stage.accent, 0.75);
    g.beginPath();
    g.arc(dx, dy, dr, 0, 6.2832);
    g.fill();
    g.fillStyle = rgba('#ffffff', 0.28);
    g.beginPath();
    g.arc(dx - dr * 0.2, dy - dr * 0.2, dr * 0.7, 0, 6.2832);
    g.fill();
  }

  /* stars */
  if (bg && bg.stars) {
    for (var i = 0; i < bg.stars.length; i++) {
      var st = bg.stars[i];
      var sx = st.x - camX * 0.05;
      if (sx < -4 || sx > W + 4) continue;
      var tw = 0.35 + Math.abs(Math.sin(time * 0.02 + st.tw)) * 0.55;
      g.fillStyle = rgba('#ffffff', tw * 0.8);
      g.fillRect(sx, st.y, st.s, st.s);
    }
  }

  /* cloud bands */
  if (bg && bg.clouds) {
    for (var c = 0; c < bg.clouds.length; c++) {
      var cl = bg.clouds[c];
      var span = bg.span;
      var cx2 = cl.x - camX * 0.1 - (time * 0.06) % span;
      if (cx2 < -cl.w) cx2 += span;
      if (cx2 > W + cl.w) continue;
      g.globalAlpha = clamp(cl.a * 1.7, 0, 0.16);
      el(g, cx2 + cl.w / 2, cl.y + cl.h / 2, cl.w / 2, cl.h / 2, stage.accent);
      el(g, cx2 + cl.w * 0.35, cl.y + cl.h * 0.4, cl.w * 0.28, cl.h * 0.42, stage.accent);
      g.globalAlpha = 1;
    }
  }

  /* horizon glow */
  var rg = g.createRadialGradient(W * 0.5, GROUND_Y - 6, 4, W * 0.5, GROUND_Y - 6, 200);
  rg.addColorStop(0, rgba(stage.accent, 0.20));
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, W, H);
}

function drawBackground(g, stage, bg, camX, time) {
  var i, o, sx;

  function ridgeLine(pts, factor, color) {
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(-20, H);
    for (var j = 0; j < pts.length; j++) {
      var sxj = pts[j].x - camX * factor;
      if (sxj < -120 || sxj > W + 120) continue;
      g.lineTo(sxj, pts[j].y);
    }
    g.lineTo(W + 20, H);
    g.closePath();
    g.fill();
  }

  ridgeLine(bg.ridgeFar, 0.10, bg.colFar);
  ridgeLine(bg.ridgeMid, 0.18, bg.colMid);

  /* mid skyline */
  for (i = 0; i < bg.mid.length; i++) {
    o = bg.mid[i];
    sx = o.x - camX * 0.34;
    if (sx + o.w < -20 || sx > W + 20) continue;
    var top = GROUND_Y - o.h;
    g.fillStyle = stage.mid;
    g.fillRect(sx, top, o.w, o.h + 40);
    g.fillStyle = rgba('#ffffff', 0.03);
    g.fillRect(sx, top, 2, o.h + 40);
    if (o.lit) {
      g.fillStyle = rgba(stage.accent, 0.55);
      for (var k = 0; k < o.wins.length; k++) {
        g.fillRect(sx + o.wins[k].x, top + o.wins[k].y, 2, 2);
      }
    }
  }

  /* near silhouettes */
  g.fillStyle = stage.near;
  for (i = 0; i < bg.near.length; i++) {
    o = bg.near[i];
    sx = o.x - camX * 0.58;
    if (sx + o.w < -20 || sx > W + 20) continue;
    g.fillRect(sx, GROUND_Y - o.h, o.w, o.h + 30);
    g.fillRect(sx + o.w * 0.25, GROUND_Y - o.h - 6, o.w * 0.5, 6);
  }

  /* drifting motes */
  for (i = 0; i < bg.motes.length; i++) {
    o = bg.motes[i];
    sx = o.x - camX * 0.75 - (time * o.sp * 0.25) % (W + 60);
    if (sx < -20) sx += W + 60;
    var sy = o.y + Math.sin(time * 0.02 + o.ph) * 6;
    g.fillStyle = rgba(stage.accent, 0.35 + Math.sin(time * 0.05 + o.ph) * 0.25);
    g.fillRect(sx, sy, o.s, o.s);
  }
}

function drawGround(g, stage, bg, camX) {
  var i, seg, sx, sw;
  var segs = stage.groundSegs;
  for (i = 0; i < segs.length; i++) {
    seg = segs[i];
    sx = seg[0] - camX;
    sw = seg[1];
    if (sx + sw < -20 || sx > W + 20) continue;

    var grad = g.createLinearGradient(0, GROUND_Y, 0, H);
    grad.addColorStop(0, stage.ground);
    grad.addColorStop(1, stage.groundDark);
    g.fillStyle = grad;
    g.fillRect(sx, GROUND_Y, sw, H - GROUND_Y);

    rr(g, sx, GROUND_Y, sw, 4, 2, stage.groundLit);
    rr(g, sx, GROUND_Y, sw, 2, 1, rgba(stage.accent, 0.5));

    g.fillStyle = 'rgba(0,0,0,0.18)';
    g.fillRect(sx, GROUND_Y + 9, sw, 1);
    g.fillRect(sx, GROUND_Y + 20, sw, 1);

    g.fillStyle = 'rgba(0,0,0,0.6)';
    g.fillRect(sx, GROUND_Y, 2, H - GROUND_Y);
    g.fillRect(sx + sw - 2, GROUND_Y, 2, H - GROUND_Y);
  }

  for (i = 0; i < bg.speckles.length; i++) {
    var sp = bg.speckles[i];
    sx = sp.x - camX;
    if (sx < -4 || sx > W + 4) continue;
    g.fillStyle = sp.d ? rgba(stage.groundLit, 0.45) : 'rgba(0,0,0,0.3)';
    g.fillRect(sx, sp.y, sp.s, sp.s);
  }

  for (i = 0; i < bg.props.length; i++) {
    var pr = bg.props[i];
    sx = pr.x - camX;
    if (sx < -14 || sx > W + 14) continue;
    if (pr.kind === 0) {
      g.fillStyle = stage.groundDark;
      g.fillRect(sx, GROUND_Y - pr.h, pr.w, pr.h);
      g.fillStyle = rgba(stage.accent, 0.65);
      g.fillRect(sx, GROUND_Y - pr.h, pr.w, 2);
    } else {
      g.fillStyle = rgba(stage.accent, 0.85);
      g.beginPath();
      g.moveTo(sx, GROUND_Y + 1);
      g.lineTo(sx + pr.w / 2, GROUND_Y - pr.h);
      g.lineTo(sx + pr.w, GROUND_Y + 1);
      g.closePath();
      g.fill();
      g.fillStyle = rgba('#ffffff', 0.35);
      g.fillRect(sx + pr.w / 2 - 1, GROUND_Y - pr.h + 3, 1, pr.h * 0.5);
    }
  }
}

/* silhouettes drawn in front of the action for depth */
function drawForeground(g, stage, bg, camX) {
  g.fillStyle = 'rgba(0,0,0,0.82)';
  for (var i = 0; i < bg.fore.length; i++) {
    var o = bg.fore[i];
    var sx = o.x - camX * 1.22;
    if (sx + o.w < -30 || sx > W + 30) continue;
    var base = H + 2;
    g.beginPath();
    g.moveTo(sx, base);
    g.lineTo(sx + o.w * 0.22, H - o.h);
    g.lineTo(sx + o.w * 0.42, H - o.h * 0.55);
    g.lineTo(sx + o.w * 0.66, H - o.h * 0.9);
    g.lineTo(sx + o.w, base);
    g.closePath();
    g.fill();
  }
  /* rubble along the bottom edge */
  g.fillStyle = 'rgba(0,0,0,0.55)';
  for (var j = 0; j < bg.props.length; j++) {
    var p = bg.props[j];
    var px2 = p.x * 1.05 - camX * 1.35;
    if (px2 < -20 || px2 > W + 20) continue;
    g.fillRect(px2, H - 4, p.w + 6, 6);
  }
}

function drawPlatforms(g, stage, camX) {
  var plats = stage.platforms;
  for (var i = 0; i < plats.length; i++) {
    var p = plats[i];
    var sx = p.x - camX;
    if (sx + p.w < -20 || sx > W + 20) continue;
    rr(g, sx, p.y + 2.5, p.w, 8, 3, 'rgba(0,0,0,0.38)');
    rr(g, sx, p.y, p.w, 8, 3, stage.ground);
    rr(g, sx, p.y, p.w, 2.6, 1.3, stage.groundLit);
    rr(g, sx + 3, p.y + 4.4, p.w - 6, 1.4, 0.7, rgba(stage.accent, 0.4));
  }
}

function drawParticles(g, camX) {
  for (var i = 0; i < Game.particles.length; i++) {
    var pt = Game.particles[i];
    var a = clamp(pt.life / pt.maxLife, 0, 1);
    g.globalAlpha = pt.smoke ? a * 0.45 : a;
    g.fillStyle = pt.color;
    g.fillRect(Math.round(pt.x - camX), Math.round(pt.y), pt.size, pt.size);
  }
  g.globalAlpha = 1;
}

function drawBullets(g, camX) {
  var i, b, x, y;
  /* trails first so cores always sit on top */
  g.lineCap = 'round';
  for (i = 0; i < Game.bullets.length; i++) {
    b = Game.bullets[i];
    x = b.x - camX; y = b.y;
    var tl = b.friendly ? 5 : 6.5;
    g.globalAlpha = b.friendly ? 0.30 : 0.42;
    g.strokeStyle = b.color;
    g.lineWidth = Math.max(1.4, b.w * 0.55);
    g.beginPath();
    g.moveTo(x - b.vx * tl * 0.16, y - b.vy * tl * 0.16);
    g.lineTo(x, y);
    g.stroke();
  }
  g.globalAlpha = 1;

  for (i = 0; i < Game.bullets.length; i++) {
    b = Game.bullets[i];
    x = Math.round(b.x - camX); y = Math.round(b.y);
    /* dark rim so a bullet never vanishes against a bright wall */
    g.globalAlpha = 0.5;
    g.fillStyle = '#05070d';
    g.fillRect(x - b.w / 2 - 1.5, y - b.h / 2 - 1.5, b.w + 3, b.h + 3);
    g.globalAlpha = 0.4;
    g.fillStyle = b.glow;
    g.fillRect(x - b.w / 2 - 1, y - b.h / 2 - 1, b.w + 2, b.h + 2);
    g.globalAlpha = 1;
    g.fillStyle = b.color;
    g.fillRect(x - b.w / 2, y - b.h / 2, b.w, b.h);
    g.fillStyle = '#ffffff';
    g.fillRect(x - b.w / 4, y - b.h / 4, Math.max(1, b.w / 2), Math.max(1, b.h / 2));
  }
}

/* small arrows at the screen edge for enemies you cannot see yet */
function drawThreatArrows(g, camX) {
  var shown = 0;
  for (var i = 0; i < Game.enemies.length && shown < 4; i++) {
    var e = Game.enemies[i];
    var sx = e.x - camX + e.w / 2;
    if (sx > -30 && sx < W + 30) continue;
    if (Math.abs(sx - W / 2) > W * 1.2) continue;
    var side = sx < 0 ? -1 : 1;
    var ax = side < 0 ? 6 : W - 6;
    var ay = clamp(e.y - camX * 0 + e.h / 2, 40, H - 30);
    var col = e.elite ? '#ffe08a' : '#ff4d6d';
    g.globalAlpha = 0.55 + Math.sin(Game.time * 0.15) * 0.2;
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(ax + side * 5, ay);
    g.lineTo(ax - side * 3, ay - 4);
    g.lineTo(ax - side * 3, ay + 4);
    g.closePath();
    g.fill();
    g.globalAlpha = 1;
    shown++;
  }
}

function drawWorld(g) {
  var stage = Game.stage, camX = Game.camX;
  var bg = Game.bg;
  drawSky(g, stage, bg, camX, Game.time);
  g.globalAlpha = Game.boss ? 0.82 : 1;
  drawBackground(g, stage, bg, camX, Game.time);
  g.globalAlpha = 1;
  drawGround(g, stage, bg, camX);
  drawPlatforms(g, stage, camX);

  var i;
  /* contact shadows */
  g.fillStyle = 'rgba(0,0,0,0.35)';
  for (i = 0; i < Game.enemies.length; i++) {
    var en = Game.enemies[i];
    if (en.y + en.h > GROUND_Y - 4) {
      g.beginPath();
      g.ellipse(en.x - camX + en.w / 2, GROUND_Y + 1, en.w * 0.5, 2, 0, 0, 6.2832);
      g.fill();
    }
  }
  var pl = Game.player;
  if (pl && pl.onGround) {
    g.beginPath();
    g.ellipse(pl.x - camX + pl.w / 2, pl.y + pl.h + 1, pl.w * 0.55, 2, 0, 0, 6.2832);
    g.fill();
  }

  for (i = 0; i < Game.pickups.length; i++) drawCapsule(g, Game.pickups[i]);

  for (i = 0; i < Game.enemies.length; i++) {
    var e = Game.enemies[i];
    var ex = e.x - camX;
    if (ex < -40 || ex > W + 40) continue;
    g.save();
    g.translate(-camX, 0);
    if (e.t === 'grunt') drawGrunt(g, e);
    else if (e.t === 'runner') drawRunner(g, e);
    else if (e.t === 'drone') drawDrone(g, e);
    else if (e.t === 'turret') drawTurret(g, e);
    else if (e.t === 'jumper') drawJumper(g, e);
    g.restore();
  }

  if (Game.boss) {
    g.save();
    g.translate(-camX, 0);
    drawBoss(g, Game.boss);
    g.restore();
  }

  var p = Game.player;
  if (p && !(p.dead && Math.floor(p.deadTimer / 4) % 2 === 1)) {
    g.save();
    g.translate(-camX, 0);
    if (p.invuln > 0 && !p.dead && Math.floor(p.invuln / 4) % 2 === 1) g.globalAlpha = 0.45;
    drawPlayer(g, p);
    g.globalAlpha = 1;
    g.restore();
  }

  drawBullets(g, camX);
  drawParticles(g, camX);
  drawThreatArrows(g, camX);
  drawForeground(g, stage, bg, camX);

  /* floating score text */
  for (i = 0; i < Game.floaters.length; i++) {
    var f = Game.floaters[i];
    g.globalAlpha = clamp(f.life / 30, 0, 1);
    drawText(g, f.text, f.x - camX, f.y, 1, f.color, 'center', 'rgba(0,0,0,0.7)');
    g.globalAlpha = 1;
  }
}

/* ---- HUD ---------------------------------------------------------------- */
function drawHeartIcon(g, x, y, full) {
  var c = full ? '#ff4d6d' : '#31161f';
  var c2 = full ? '#ffd0d8' : '#20101a';
  px(g, x + 1, y, 2, 1, c); px(g, x + 4, y, 2, 1, c);
  px(g, x, y + 1, 7, 2, c);
  px(g, x + 1, y + 3, 5, 1, c);
  px(g, x + 2, y + 4, 3, 1, c);
  px(g, x + 3, y + 5, 1, 1, c);
  px(g, x + 1, y + 1, 1, 1, c2);
}

function drawHUD(g) {
  var p = Game.player;
  var stage = Game.stage;

  /* top bar */
  var grad = g.createLinearGradient(0, 0, 0, 26);
  grad.addColorStop(0, 'rgba(3,5,10,0.82)');
  grad.addColorStop(1, 'rgba(3,5,10,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, 26);

  var i;
  for (i = 0; i < p.maxHp; i++) drawHeartIcon(g, 7 + i * 10, 6, i < p.hp);

  drawText(g, 'X' + Math.max(0, Game.lives), 7, 16, 1, '#9fb2c6');
  px(g, 21, 15, 7, 2, '#0b0f18');
  px(g, 22, 15, 5, 4, '#3f6b8c');
  px(g, 23, 17, 3, 1, '#ffb545');
  px(g, 21, 19, 7, 2, '#2c4a63');

  /* score */
  drawText(g, 'SCORE ' + String(Game.score).padStart(7, '0'), W - 7, 6, 1, '#ffffff', 'right', 'rgba(0,0,0,0.7)');
  drawText(g, 'HI ' + String(Math.max(Game.hiScore, Game.score)).padStart(7, '0'), W - 7, 16, 1, rgba(stage.accent, 0.9), 'right', 'rgba(0,0,0,0.7)');

  /* weapon chip */
  var w = WEAPONS[p.weapon];
  var chipW = textWidth(w.name, 1) + 14;
  px(g, 6, H - 18, chipW, 12, 'rgba(3,5,10,0.7)');
  px(g, 6, H - 18, 2, 12, w.color);
  drawText(g, w.name, 12, H - 15, 1, w.color);

  /* boss bar */
  var b = Game.boss;
  if (b && !b.dead) {
    var bw = 250, bx = (W - bw) / 2, by = 30;
    drawText(g, b.name, W / 2, by - 9, 1, '#ff4d6d', 'center', 'rgba(0,0,0,0.8)');
    px(g, bx - 1, by - 1, bw + 2, 8, 'rgba(0,0,0,0.7)');
    px(g, bx, by, bw, 6, '#2a0d16');
    var frac = clamp(b.hp / b.maxHp, 0, 1);
    px(g, bx, by, bw * frac, 6, b.phase === 2 ? '#ff5c3c' : '#ff2d95');
    px(g, bx, by, bw * frac, 2, '#ffd0e4');
    for (var t = 1; t < 10; t++) px(g, bx + (bw / 10) * t, by, 1, 6, 'rgba(0,0,0,0.4)');
  }

  /* banner */
  if (Game.banner) {
    var bn = Game.banner;
    var life = bn.life;
    var alpha = life > 110 ? (130 - life) / 20 : clamp(life / 30, 0, 1);
    g.globalAlpha = clamp(alpha, 0, 1);
    drawText(g, bn.text, W / 2, 96, 3, bn.color || '#ffffff', 'center', 'rgba(0,0,0,0.85)');
    drawText(g, bn.sub, W / 2, 124, 1, '#cfd8e3', 'center', 'rgba(0,0,0,0.85)');
    g.globalAlpha = 1;
  }
}

/* ---- screens ------------------------------------------------------------ */
function dim(g, a) {
  g.fillStyle = 'rgba(3,5,10,' + a + ')';
  g.fillRect(0, 0, W, H);
}

function drawTitle(g) {
  var t = PARAMS.shot ? 12 : Game.stateTimer;
  /* drifting background of era one */
  Game.camX = (t * 0.35) % (STAGES[0].length - W);
  drawSky(g, STAGES[0], Game.bg, Game.camX, t);
  drawBackground(g, STAGES[0], Game.bg, Game.camX, t);
  drawGround(g, STAGES[0], Game.bg, Game.camX);
  dim(g, 0.55);

  /* title */
  var bob = Math.sin(t * 0.03) * 2;
  g.globalAlpha = 0.25;
  drawText(g, 'EON', W / 2 + 2, 42 + bob, 5, '#ff5c3c', 'center');
  drawText(g, 'COMMANDO', W / 2 + 2, 82 + bob, 5, '#ff5c3c', 'center');
  g.globalAlpha = 1;
  drawText(g, 'EON', W / 2, 40 + bob, 5, '#ffd257', 'center', '#3a1f24');
  drawText(g, 'COMMANDO', W / 2, 80 + bob, 5, '#ffb545', 'center', '#3a1f24');

  drawText(g, 'THREE ERAS. ONE COMMANDO. NO MERCY.', W / 2, 124, 1, '#9fb2c6', 'center');

  /* blinking prompt */
  if (Math.floor(t / 30) % 2 === 0) {
    drawText(g, 'PRESS ENTER  ·  TAP TO START', W / 2, 152, 2, '#54e0ff', 'center', 'rgba(0,0,0,0.8)');
  }

  drawText(g, 'ARROWS / WASD MOVE   SPACE JUMP   Z FIRE   P PAUSE', W / 2, 196, 1, '#7f8fa6', 'center');
  drawText(g, 'HOLD UP TO AIM UP  ·  DOWN IN AIR TO AIM DOWN', W / 2, 208, 1, '#7f8fa6', 'center');
  drawText(g, 'HI SCORE ' + String(Game.hiScore).padStart(7, '0'), W / 2, 232, 1, '#ffd257', 'center');
  drawText(g, 'V1.0  ·  ONE HTML FILE  ·  ZERO DEPENDENCIES', W / 2, 250, 1, '#3f4d61', 'center');
}

function drawPause(g) {
  dim(g, 0.62);
  drawText(g, 'PAUSED', W / 2, 100, 4, '#54e0ff', 'center', 'rgba(0,0,0,0.8)');
  drawText(g, 'P OR ESC TO RESUME', W / 2, 140, 1, '#cfd8e3', 'center');
  drawText(g, 'M MUTES AUDIO', W / 2, 154, 1, '#7f8fa6', 'center');
}

function drawStageClear(g) {
  dim(g, 0.6);
  var t = Game.stateTimer;
  drawText(g, 'ERA CLEARED', W / 2, 78, 4, '#54ffa8', 'center', 'rgba(0,0,0,0.85)');
  drawText(g, Game.stage.name, W / 2, 116, 1, '#cfd8e3', 'center');
  var r = Game.lastRun;
  if (r) {
    drawText(g, 'CLEAR BONUS', W / 2, 140, 1, '#9fb2c6', 'center');
    drawText(g, '+' + r.bonus, W / 2, 154, 2, '#ffd257', 'center', 'rgba(0,0,0,0.8)');
  }
  drawText(g, 'SCORE ' + String(Game.score).padStart(7, '0'), W / 2, 184, 1, '#ffffff', 'center');
  if (t > 100 && Math.floor(t / 20) % 2 === 0) {
    drawText(g, Game.stageIndex + 1 < STAGES.length ? 'ADVANCING...' : 'FINAL ERA COMPLETE', W / 2, 212, 1, '#54e0ff', 'center');
  }
}

function drawGameOver(g) {
  dim(g, 0.72);
  drawText(g, 'GAME OVER', W / 2, 88, 4, '#ff4d6d', 'center', 'rgba(0,0,0,0.85)');
  drawText(g, 'THE EON ENDURES WITHOUT YOU', W / 2, 126, 1, '#9fb2c6', 'center');
  drawText(g, 'SCORE ' + String(Game.score).padStart(7, '0'), W / 2, 150, 2, '#ffffff', 'center', 'rgba(0,0,0,0.8)');
  drawText(g, 'HI SCORE ' + String(Game.hiScore).padStart(7, '0'), W / 2, 176, 1, '#ffd257', 'center');
  if (Math.floor(Game.stateTimer / 30) % 2 === 0) {
    drawText(g, 'ENTER / TAP TO REDEPLOY', W / 2, 208, 1, '#54e0ff', 'center');
  }
}

function drawVictory(g) {
  dim(g, 0.68);
  var t = Game.stateTimer;
  drawText(g, 'EON SECURED', W / 2, 74, 4, '#ffd257', 'center', 'rgba(0,0,0,0.85)');
  drawText(g, 'ALL THREE ERAS CLEARED', W / 2, 112, 1, '#cfd8e3', 'center');
  drawText(g, 'FINAL SCORE ' + String(Game.score).padStart(7, '0'), W / 2, 140, 2, '#ffffff', 'center', 'rgba(0,0,0,0.8)');
  if (Game.score >= Game.hiScore) {
    drawText(g, 'NEW HIGH SCORE', W / 2, 168, 1, '#54ffa8', 'center');
  }
  if (Math.floor(t / 30) % 2 === 0) {
    drawText(g, 'ENTER / TAP TO RUN IT AGAIN', W / 2, 200, 1, '#54e0ff', 'center');
  }
}

/* ---- scanlines + vignette ---------------------------------------------- */
var Scan = { canvas: null };
function buildScanlines() {
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.16)';
  for (var y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
  Scan.canvas = c;
}

/* ---- master draw ------------------------------------------------------- */
function Render(g) {
  var shakeX = 0, shakeY = 0;
  if (Game.shake > 0.2) {
    shakeX = rnd(-Game.shake, Game.shake);
    shakeY = rnd(-Game.shake, Game.shake) * 0.7;
  }

  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);

  if (Game.state === 'title') {
    drawTitle(g);
  } else {
    g.save();
    g.translate(Math.round(shakeX), Math.round(shakeY));
    drawWorld(g);
    g.restore();
    drawHUD(g);

    if (Game.state === 'paused') drawPause(g);
    else if (Game.state === 'stageclear') drawStageClear(g);
    else if (Game.state === 'gameover') drawGameOver(g);
    else if (Game.state === 'victory') drawVictory(g);
  }

  /* hit flash */
  if (Game.flash > 0.01) {
    g.fillStyle = 'rgba(255,255,255,' + (Game.flash * 0.5) + ')';
    g.fillRect(0, 0, W, H);
  }

  /* scanlines */
  if (Scan.canvas) {
    g.globalAlpha = 0.5;
    g.drawImage(Scan.canvas, 0, 0);
    g.globalAlpha = 1;
  }

  /* vignette */
  var vg = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);
}

/* ===== 90_main.js ===== */
/* ===========================================================================
   EON COMMANDO — 90 main
   Canvas setup, the fixed-timestep loop, and the debug harness used to
   capture the screenshots in docs/.
   =========================================================================== */

var canvas, ctx;
var _last = 0, _acc = 0;

/* surface runtime errors instead of failing silently */
window.addEventListener('error', function (e) {
  (window.__eonErrors = window.__eonErrors || []).push(String(e.message));
  try { document.title = 'ERR ' + e.message; } catch (err) {}
});

function boot() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  if (PARAMS.shot) document.body.classList.add('shot');
  buildScanlines();
  Input.init();
  fitCanvas();
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', function () {
    setTimeout(fitCanvas, 150);
  });

  Snd.setMuted(!!Store.get('muted', false));
  Game.init();

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    Snd.resume();
    Game.pressStart();
  });

  window.__eon = Game;              // test hook

  if (PARAMS.demo) runDemo(parseInt(PARAMS.demo, 10) || 240);

  _last = performance.now();
  requestAnimationFrame(loop);
}

function loop(now) {
  var dt = (now - _last) / 1000;
  _last = now;
  if (dt > 0.25) dt = 0.25;
  _acc += dt;

  if (window.__freeze) { Render(ctx); requestAnimationFrame(loop); return; }

  var steps = 0;
  while (_acc >= STEP && steps < 5) {
    Input.frame();
    Game.update();
    _acc -= STEP;
    steps++;
  }

  Render(ctx);
  requestAnimationFrame(loop);
}

/* ---- deterministic demo: used for screenshots and smoke tests ----------- */
function runDemo(n) {
  Game.startGame();
  if (PARAMS.stage) {
    var idx = clamp(parseInt(PARAMS.stage, 10) - 1, 0, STAGES.length - 1);
    Game.loadStage(idx);
  }
  if (PARAMS.warp) {
    Game.player.x = parseFloat(PARAMS.warp);
    Game.camX = clamp(Game.player.x - W * 0.42, 0, Game.stage.length - W);
    Game.pending = Game.pending.filter(function (e) { return e.x > Game.player.x - 100; });
  }
  if (PARAMS.hp) Game.player.hp = parseInt(PARAMS.hp, 10);

  var fire = PARAMS.idle !== '1' && PARAMS.fire !== '0';
  var move = PARAMS.idle !== '1' && PARAMS.right !== '0';
  var jump = PARAMS.jump !== '0';
  for (var i = 0; i < n; i++) {
    Input.touch.right = move;
    Input.touch.fire = fire;
    Input.touch.jump = jump && move && (i % 96 < 5);
    Input.touch.up = PARAMS.aimup === '1' && (i % 120 < 40);
    Input.frame();
    Game.update();
  }
  /* optional final pose, then settle the camera */
  if (PARAMS.px) Game.player.x = parseFloat(PARAMS.px);
  if (PARAMS.py) Game.player.y = parseFloat(PARAMS.py);
  if (PARAMS.px || PARAMS.py) {
    Game.camX = Game.arenaLocked ? Game.stage.arenaStart
      : clamp(Game.player.x - W * 0.42, 0, Game.stage.length - W);
    for (var s2 = 0; s2 < 3; s2++) { Input.frame(); Game.update(); }
  }
  Input.touch = {};
  Game.stateTimer = Math.max(Game.stateTimer, 0);
  if (Game.boss) Game.boss.flash = 0;
  if (Game.player) { Game.player.dead = false; Game.player.hurtFlash = 0; Game.player.invuln = 0; }
  window.__freeze = true;
  if (PARAMS.debug) {
    var b = Game.boss;
    document.title = 'DBG cam=' + Math.round(Game.camX) + ' locked=' + Game.arenaLocked +
      ' boss=' + (b ? (Math.round(b.x) + ',' + Math.round(b.y) + ' hp' + b.hp + ' intro' + b.introT) : 'none') +
      ' player=' + Math.round(Game.player.x) + ',' + Math.round(Game.player.y) +
      ' state=' + Game.state + ' banner=' + (Game.banner ? Game.banner.life : '-');
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

</script>
</body>
</html>
