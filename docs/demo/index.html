<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Eon Commando — live demo</title>
<meta name="description" content="Play Eon Commando in the browser: a retro run-and-gun in one HTML file. No install, works offline.">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png">
<style>
  :root{ --ink:#05070d; --line:#1b2839; --amber:#ffb545; --cyan:#54e0ff; --dim:#7f8fa6; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:#cfd8e3;
    font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #bar{
    position:fixed; inset:0 0 auto 0; height:34px; z-index:20; display:flex; align-items:center;
    gap:10px; padding:0 10px; background:rgba(5,7,13,.92);
    border-bottom:1px solid var(--line); backdrop-filter:blur(6px);
  }
  #bar a{
    color:var(--dim); text-decoration:none; letter-spacing:.14em; font-size:10px;
    padding:6px 9px; border:1px solid transparent; border-radius:5px; white-space:nowrap;
  }
  #bar a:hover{ color:var(--cyan); border-color:var(--line); }
  #bar .name{ color:var(--amber); letter-spacing:.22em; font-size:10px; font-weight:700 }
  #bar .spacer{ flex:1 }
  #bar button{
    background:none; border:1px solid var(--line); color:var(--dim); border-radius:5px;
    padding:6px 9px; font:inherit; font-size:10px; letter-spacing:.14em; cursor:pointer;
  }
  #bar button:hover{ color:var(--cyan); border-color:#2b4258 }
  #frame{ position:fixed; inset:34px 0 0 0; }
  iframe{ width:100%; height:100%; border:0; display:block; background:var(--ink) }
  @media (max-width:520px){ #bar .hide-sm{ display:none } }
</style>
</head>
<body>
<div id="bar">
  <span class="name">EON COMMANDO</span>
  <a href="../" title="Back to the site">&larr; SITE</a>
  <a href="../play/" class="hide-sm" title="Open the game on its own">BARE GAME</a>
  <span class="spacer"></span>
  <a href="https://github.com/drsamonline/eon-commando" class="hide-sm" rel="noopener">SOURCE</a>
  <button id="fs" type="button">FULLSCREEN</button>
</div>
<div id="frame">
  <iframe src="../play/" title="Eon Commando — the game" allow="fullscreen; gamepad; autoplay"></iframe>
</div>
<script>
  document.getElementById('fs').addEventListener('click', function () {
    var el = document.documentElement;
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  });
</script>
</body>
</html>
