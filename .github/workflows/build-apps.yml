# Builds the portable Windows EXE and the Android APK, and publishes them.
#
# The heavy lifting lives in the shared kit so this repo inherits its fixes:
#   https://github.com/drsamonline/app-builder
#
# This repo's legacy Pages builder started failing with "Page build failed" and
# could not be recovered (a manual rebuild failed the same way). So the kit owns
# deployment now: it publishes docs/ through actions/deploy-pages, which gives
# real build logs and does not depend on the legacy Jekyll builder.
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-apps
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@49c2e0b172890f9334bbc7167a0e7fb5cd3756ba
    with:
      app_name: eon-commando
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      actions: write    # the shot job dispatches the run that publishes its picture
      id-token: write
