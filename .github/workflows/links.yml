name: links

# Every local href and src in every page must resolve. Ported from
# drsamonline/Hellgate.
#
# src/*.html are build fragments: they carry a doctype but are concatenated into
# index.html, so their relative paths resolve against the output rather than
# against where they sit. They are excluded rather than checked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # was @v4
        with:
          node-version: '20'
      - name: Every local link and asset resolves
        run: node tools/check-links.mjs . --ignore 'src/*'
